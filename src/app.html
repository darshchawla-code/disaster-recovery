<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AidAtlas · Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="../css/aidatlas.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="wordmark" href="index.html">Aid<b>Atlas</b></a>
    <nav class="tabs" aria-label="Modes">
      <a href="?mode=live" data-mode="live">Live</a>
      <a href="?mode=plan" data-mode="plan">Plan</a>
      <a href="?mode=history" data-mode="history">History</a>
      <a href="?mode=risk" data-mode="risk">Risk</a>
    </nav>
    <div class="search">
      <label class="sr" for="q" hidden>Search a place</label>
      <input id="q" type="search" placeholder="Search a city, address or country" autocomplete="off">
      <ul id="qres" hidden></ul>
    </div>
    <a class="iconbtn" href="guide.html" target="_blank" rel="noopener">Guide</a>
    <button class="iconbtn" id="btnExplain" type="button">Models</button>
    <button class="iconbtn" id="btnWork" type="button" title="Profile, team, saved plans, inventory source">Workspace <span class="wsbadge" id="wsBadge" hidden></span></button>
    <button class="iconbtn" id="btnSettings" type="button">Settings</button>
  </div>
  <div class="main">
    <aside class="panel sketch-bg" id="panel"><div class="panel-inner" id="panelInner"></div></aside>
    <div class="mapwrap">
      <div id="map" aria-label="Satellite map"></div>
      <div class="toast" id="toast" hidden></div>
      <div class="hint" id="hint" hidden><span id="hintText"></span><button type="button" id="hintCancel">Cancel</button></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</div>
<aside class="drawer sketch-bg" id="drawer" aria-label="Model explainer">
  <header><h2>How the numbers were made</h2><button class="iconbtn" id="drawerClose" type="button">Close</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<div class="modal" id="settings" hidden></div>
<div class="modal" id="workspace" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/javascript-lp-solver@0.4.24/prod/solver.js"></script>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/workspace.js"></script>
<script src="../js/cloud.js"></script>
<script src="../js/models/prediction.js"></script>
<script src="../js/models/fairness.js"></script>
<script src="../js/models/efficiency.js"></script>
<script src="../js/models/routing.js"></script>
<script src="../js/models/facility.js"></script>
<script src="../js/models/risk.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/ui/map.js"></script>
<script src="../js/ui/explain.js"></script>
<script src="../js/ui/report.js"></script>
<script src="../js/ui/workspace-ui.js"></script>
<script src="../js/ui/app.js"></script>
</body>
</html>
