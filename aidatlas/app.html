    const words = { water: `${about(q)} kilolitres of drinking water (${about(q * 1000)} litres)`, food: `${about(q)} tonnes of food`, shelter: `${about(q)} family tents`, medical: `${about(q)} medical kits`, staff: `${about(q)} relief workers` };
    return words[k] || `${about(q)} ${c ? c.unit : ''}`;
  };
  R.about = about;

  // ---------- hazard guidance (standard public-safety advice: WHO, IFRC, India NDMA, US FEMA) ----------
  R.ADVICE = {
    EQ: {
      word: 'earthquake',
      warn: 'Warn people to expect aftershocks. Tell them to stay out of cracked buildings, and to drop, cover and hold on if the ground shakes again.',
      first: ['Send search-and-rescue teams to the worst-hit areas first. Most people trapped under rubble are saved in the first 72 hours.', 'Check hospitals, schools, bridges and dams for damage before people go back in.', 'Shut off gas lines in damaged areas to stop fires.'],
      later: ['Set up safe open-ground camps away from tall buildings.', 'Get engineers to tag buildings as safe, unsafe or needs repair.'],
      watch: 'Strong aftershocks, landslides on hill roads, and dam or embankment damage.',
    },
    TC: {
      word: 'cyclone',
      warn: 'Tell people in low-lying coastal areas and in weak (kutcha) houses to move to cyclone shelters now, before the wind and sea surge arrive. Fishing boats must return to harbour.',
      first: ['Move people out of the storm-surge zone first; most cyclone deaths are from sea water, not wind.', 'Fill shelters with water, food and medicine before landfall.', 'Keep cranes, chainsaws and road-clearing teams ready to open roads straight after the storm.'],
      later: ['Do not let people touch fallen power lines.', 'Restore drinking water quickly to stop diarrhoea outbreaks.'],
      watch: 'Changes in the storm track, heavy rain and river flooding after landfall.',
    },
    FL: {
      word: 'flood',
      warn: 'Tell people to move to higher ground with documents, medicine and drinking water. Never walk or drive through moving water; 30 cm of water can sweep away a car.',
      first: ['Send boats and rescue teams to people stranded on roofs and in low areas.', 'Warn villages downstream before any dam or barrage gates are opened.', 'Hand out water purification tablets or chlorine; flood water spreads cholera and typhoid.'],
      later: ['Spray for mosquitoes to prevent dengue and malaria.', 'Check embankments and pump out water from hospitals and power stations first.'],
      watch: 'Rising river levels upstream, more rain in the catchment, and dam releases.',
    },
    WF: {
      word: 'wildfire',
      warn: 'Tell people near the fire to leave early on the named evacuation roads. Close windows and wear N95 masks if there is smoke.',
      first: ['Keep evacuation roads clear for fire engines.', 'Move people with breathing problems, the elderly and children away from the smoke first.'],
      later: ['Watch for flash floods and landslides on burnt hills when it rains.'],
      watch: 'Wind speed and direction, temperature, and new fire spots.',
    },
    VO: {
      word: 'volcanic eruption',
      warn: 'Keep everyone out of the danger zone around the volcano. Tell people to wear masks or wet cloth against ash and to stay indoors when ash is falling.',
      first: ['Evacuate the exclusion zone completely.', 'Cover drinking-water tanks and wells to keep ash out.'],
      later: ['Clear heavy ash from roofs before they collapse, especially after rain.'],
      watch: 'Volcano observatory alerts, ash plume direction and mudflows in river valleys.',
    },
    DR: {
      word: 'drought',
      warn: 'Ask people to save water. Tell them where water tankers will come and when.',
      first: ['Run water tankers on a fixed timetable to the worst-hit villages.', 'Start food and fodder distribution for families and livestock.', 'Screen children under five for malnutrition.'],
      later: ['Repair hand pumps and check-dams; plan crop insurance and work-for-food schemes.'],
      watch: 'Rainfall, groundwater levels, and food prices in local markets.',
    },
  };
  const adv = (h) => R.ADVICE[h] || R.ADVICE.EQ;

  // ---------- bottleneck: stock or vehicles? (shared with the panel) ----------
  R.gap = (st) => {
    const run = st.lastRun, a = run.alloc, K = AA.config.commodities, dt = AA.config.epochHours;
    const open = st.depots.map((d, j) => ({ d, j })).filter((x) => x.d.open);
    const short = [], deliverableKg = { truck: 0, bus: 0 };
    K.forEach((k) => {
      const unmet = M.sum(a.unmet.map((u) => u[k.key] || 0));
      const left = M.sum(open.map(({ d, j }) => Math.max(0, (d.stock[k.key] || 0) - (a.util[j]?.used[k.key] || 0))));
      if (unmet - left > 1e-6 * Math.max(1, unmet)) short.push({ k, n: unmet - left });
      deliverableKg[k.cls] += Math.min(unmet, left) * k.kg;
    });
    const used = M.sum(open.map(({ j }) => a.util[j]?.hours.truck || 0)), budget = M.sum(open.map(({ d }) => (d.fleet.truck || 0) * dt));
    const cyc = a.trips.filter((t) => t.cls === 'truck').map((t) => 2 * run.pb.tau[t.j][t.i] + AA.config.serviceHours);
    const perTruck = Math.max(1, Math.floor(dt / (cyc.length ? M.mean(cyc) : dt)));
    return { short, util: budget ? used / budget : 0, trucks: Math.ceil(deliverableKg.truck / AA.config.vehicles.truck.cap / perTruck), buses: Math.ceil(deliverableKg.bus / AA.config.vehicles.bus.cap / perTruck) };
  };

  /** Supply dispatches grouped by store → zone, largest first. */
  R.dispatches = (st) => {
    const run = st.lastRun; if (!run) return [];
    const g = new Map();
    run.cons.tours.forEach((t) => t.cargo.forEach((c) => {
      const key = `${t.j}>${c.i}`;
      const e = g.get(key) || { j: t.j, i: c.i, trucks: 0, buses: 0, cargo: {}, kg: 0, milk: false };
      if (t.stops[0] === c.i) e[t.cls === 'bus' ? 'buses' : 'trucks']++;
      if (t.kind === 'milk-run') e.milk = true;
      Object.entries(c.cargo).forEach(([k, q]) => { e.cargo[k] = (e.cargo[k] || 0) + q; e.kg += q * AA.config.commodities.find((x) => x.key === k).kg; });
      g.set(key, e);
    }));
    const air = new Set(run.legs.filter((l) => l.airdrop && l.from.kind === 'd').map((l) => `${l.from.idx}>${l.to.idx}`));
    return [...g.values()].map((e) => ({ ...e, depot: st.depots[e.j], zone: st.zones[e.i], hours: run.pb.tau[e.j][e.i], air: air.has(`${e.j}>${e.i}`) })).sort((a, b) => b.kg - a.kg);
  };

  /** Short, ordered key actions for the map overlay and the report summary. */
  R.keyActions = (st) => {
    const run = st.lastRun, sit = st.sit, A = adv(sit.hazard), out = [];
    if (!run) return out;
    const zones = st.zones.slice().sort((a, b) => b.need - a.need);
    const top = zones.slice(0, 3);
    out.push({ icon: '!', text: `Warn and protect people in ${list(top.map((z) => z.name))}.`, detail: A.warn, at: top[0] });
    const rp = st.fcast.reported;
    if (rp && rp.missing > 0) out.push({ icon: '?', text: `Search for ${Math.round(rp.missing).toLocaleString('en')} people reported missing.`, detail: `Agencies have confirmed ${Math.round(rp.deaths || 0).toLocaleString('en')} deaths so far (${rp.asOf || 'latest report'}). ${sit.hazard === 'FL' ? 'Send search-and-rescue teams with boats and ropes downstream and to cut-off villages' : 'Send search-and-rescue teams to the worst-hit and cut-off areas'}; most survivors are found in the first 72 hours.`, at: top[0] });
    const dis = st.fcast.summary.dis.p50;
    if (dis >= 1) out.push({ icon: '⌂', text: `Open shelter for ${people(dis)} (up to ${about(st.fcast.summary.dis.p90)} in the worst case).`, detail: `About ${about(dis / 5)} family tents or equivalent space in schools and halls.`, at: top[0] });
    const flows = run.casualty.flows.slice().sort((a, b) => b.n - a.n);
    if (flows.length) { const fl = flows[0]; out.push({ icon: '+', text: `Send ambulances: ${about(M.sum(flows.map((x) => x.n)))} seriously injured patients to ${list([...new Set(flows.map((x) => st.hospitals[x.h].name))].slice(0, 3))}.`, detail: `First run: ${about(fl.n)} patients from ${st.zones[fl.i].name} to ${st.hospitals[fl.h].name} (${mins(fl.tau)})${st.hospitals[fl.h].address ? `, ${st.hospitals[fl.h].address}` : ''}.`, at: st.hospitals[fl.h] }); }
    const d = R.dispatches(st).filter((x) => !x.air)[0];
    if (d) out.push({ icon: '→', text: `Dispatch supplies: ${d.trucks + d.buses || 1} vehicle${(d.trucks + d.buses) > 1 ? 's' : ''} from ${d.depot.name} to ${d.zone.name} first.`, detail: `${Object.entries(d.cargo).filter(([, q]) => q > 1e-3).map(([k, q]) => qty(k, q)).join('; ')}.${d.depot.address ? ` Pick up at ${d.depot.address}.` : ''}`, at: d.zone });
    const air = run.legs.filter((l) => l.airdrop);
    if (air.length) out.push({ icon: '✈', text: `Arrange helicopter or air drops for ${list([...new Set(air.map((l) => l.b.name))])}: no road gets through.`, detail: 'All road routes cross a closure or a badly damaged stretch.', at: air[0].b });
    const g = R.gap(st);
    if (g.short.length || g.trucks) out.push({ icon: '⇪', text: `Ask for outside help: ${[g.trucks ? plural(g.trucks, 'more truck') : '', ...g.short.slice(0, 3).map((x) => qty(x.k.key, x.n))].filter(Boolean).join(', ')}.`, detail: 'Local stock and vehicles cannot cover this 6-hour period.', at: null });
    if (st.warehouses?.sizes?.length) { const s = st.warehouses.sizes[0], c = st.warehouses.cand[s.j]; out.push({ icon: '◆', text: `Pre-position stock at ${st.warehouses.sizes.length} storage site${st.warehouses.sizes.length > 1 ? 's' : ''} (purple diamonds).`, detail: `Site S1${c.address ? ` (${c.address})` : ''} should hold ${qty('water', s.stock.water)} and ${qty('food', s.stock.food)} for 3 days.`, at: c }); }
    return out;
  };

  // ---------- report builders ----------
  const head = (title, sub) => ({ title, sub, created: new Date() });
  const section = (h, html) => ({ h, html });
  /** "Name (address)" for a place; coordinates when no street address is known. */
  const at = (p) => (p.address ? ` (${esc(p.address)})` : ` (${(+p.lat).toFixed(4)}, ${(+p.lon).toFixed(4)})`);
  const mapLink = (p) => `<a href="${AA.data.mapsUrl(p)}" target="_blank" rel="noopener">map</a>`;
  /** Every place the plan names, with its address, coordinates and a directions link. */
  const placesTable = (rows) => `<table class="rt"><thead><tr><th>Place</th><th>What</th><th>Address</th><th>Coordinates</th><th>Map</th></tr></thead><tbody>${rows.map(([n, what, p]) => `<tr><td>${esc(n)}</td><td>${esc(what)}</td><td>${p.address ? esc(p.address) : '<i>no street address in map data</i>'}</td><td>${(+p.lat).toFixed(5)}, ${(+p.lon).toFixed(5)}</td><td>${mapLink(p)}</td></tr>`).join('')}</tbody></table>`;
  R.placesTable = placesTable;
  const steps = (arr) => `<ol class="steps">${arr.filter(Boolean).map((s) => `<li>${s}</li>`).join('')}</ol>`;
  const bullets = (arr) => `<ul>${arr.filter(Boolean).map((s) => `<li>${s}</li>`).join('')}</ul>`;
  const severityWord = (st) => {
    const max = Math.max(...st.zones.map((z) => z.sevPost ?? z.sevMean)), fat = st.fcast.summary.fat.p50;
    if (max > 0.6 || fat > 1000) return 'very severe';
    if (max > 0.3 || fat > 100) return 'severe';
    if (max > 0.1 || fat > 10) return 'moderate';
    return 'limited';
  };

  R.plan = (st) => {
    const sit = st.sit, run = st.lastRun, A = adv(sit.hazard), sm = st.fcast.summary, K = AA.config.commodities;
    const hzLabel = AA.HAZARDS[sit.hazard].label;
    const strength = sit.hazard === 'EQ' ? `magnitude ${sit.magnitude.toFixed(1)}` : sit.hazard === 'TC' ? `winds of about ${Math.round(sit.magnitude)} km/h` : `intensity ${Math.round(sit.magnitude * 10)}/10`;
    const zones = st.zones.slice().sort((a, b) => b.need - a.need);
    const disp = R.dispatches(st);
    const g = R.gap(st);
    const flows = run.casualty.flows.slice().sort((a, b) => b.n - a.n);
    const air = run.legs.filter((l) => l.airdrop);
    const scenario = sit.event ? (sit.prov === 'historical' ? 'replay of a past event' : 'live event') : 'planning scenario (no disaster is happening; this is a drill)';
    const r = head(`${hzLabel} action report: ${sit.name || sit.placeName || ''}`, `${sit.country || ''} · ${scenario} · plan time T+${st.epoch * AA.config.epochHours} h`);
    r.sections = [
      section('In one paragraph', `<p>${an(hzLabel.toLowerCase()).replace(/^a/, 'A')} with ${strength} is ${sit.event ? 'affecting' : 'assumed to hit'} ${sit.placeName ? `${esc(sit.placeName)}${sit.country ? `, ${esc(sit.country)}` : ''}` : esc(sit.event ? (sit.country || sit.name || 'the area') : (sit.name || 'the area'))}. We expect the damage to be <b>${severityWord(st)}</b> within about ${Math.round(sit.radiusKm)} km. Our best estimate is that <b>${people(sm.aff.p50)}</b> will be affected, <b>${people(sm.dis.p50)}</b> will need shelter, <b>${people(sm.inj.p50)}</b> will be injured and about <b>${about(sm.fat.p50)}</b> could die. These are estimates: the real numbers could be anywhere from ${about(sm.aff.p10)} to ${about(sm.aff.p90)} affected, so plan for the higher number.</p>${(() => { const r = st.fcast.reported; if (!r) return ''; const bits = ['deaths', 'missing', 'injured', 'displaced', 'affected'].filter((k) => r[k] > 0).map((k) => `${Math.round(r[k]).toLocaleString('en')} ${k}`); return `<p><b>Already confirmed by agencies</b> (${esc(r.source)}, ${esc(r.asOf || 'latest')}): ${bits.join(', ')}. These are minimums: the numbers above never go below them${r.missing ? `. With ${Math.round(r.missing).toLocaleString('en')} people still missing, we plan for about ${about(st.fcast.summary.fat.p50)} deaths and up to ${about(st.fcast.summary.fat.p90)}` : ''}.</p>`; })()}`),
      section('Areas that need help first', `<p>Ranked by need (how bad the damage is, how many people, how poor and how hard to reach), not just by size.</p><table class="rt"><thead><tr><th>#</th><th>Area</th><th>People affected</th><th>Need shelter</th><th>Injured</th><th>Reach from nearest store</th></tr></thead><tbody>${zones.slice(0, 6).map((z, k) => `<tr><td>${k + 1}</td><td>${esc(z.name)}</td><td>${about(z.fc.aff.p50)}</td><td>${about(z.fc.dis.p50)}</td><td>${about(z.fc.inj.p50)}</td><td>${air.some((l) => l.b === z) ? 'no road: air drop' : mins(z.accHours || 0)}</td></tr>`).join('')}</tbody></table>`),
      section('Do now: next 6 hours', steps([
        `<b>Warn the public.</b> ${A.warn} Send the warning to ${list(zones.slice(0, 4).map((z) => esc(z.name)))} first.`,
        `<b>Activate the control room</b> and bring in district officials, police, fire service, health and the ${A.word === 'cyclone' || A.word === 'flood' ? 'Met department and irrigation department' : 'Met department'}. Re-check this plan every 6 hours.`,
        ...A.first.map((x) => `<b>${x.split('.')[0]}.</b>${x.split('.').slice(1).join('.')}`),
        sm.dis.p50 >= 1 ? `<b>Open shelters</b> for ${people(sm.dis.p50)} (keep space for ${about(sm.dis.p90)}). That is about ${about(sm.dis.p50 / 5)} family tents, or schools and community halls.` : '',
        flows.length ? `<b>Move the seriously injured.</b> ${flows.slice(0, 4).map((x) => `${about(x.n)} from ${esc(st.zones[x.i].name)} to <b>${esc(st.hospitals[x.h].name)}</b>${at(st.hospitals[x.h])}, ${mins(x.tau)} away`).join('; ')}. Ask these hospitals to clear beds now.` : '',
        disp.length ? `<b>Send these supplies first</b> (largest loads first):${bullets(disp.filter((x) => !x.air).slice(0, 8).map((x) => `From <b>${esc(x.depot.name)}</b>${at(x.depot)} to <b>${esc(x.zone.name)}</b>${at(x.zone)}: ${x.trucks ? plural(x.trucks, 'truck') : ''}${x.trucks && x.buses ? ' and ' : ''}${x.buses ? plural(x.buses, 'bus', 'buses') : ''}${x.milk ? ' (shared truck, also stopping at another area)' : ''}, carrying ${Object.entries(x.cargo).filter(([, q]) => q > 1e-3).map(([k, q]) => qty(k, q)).join(', ')}. Drive time about ${mins(x.hours)}.`))}` : '',
        air.length ? `<b>Arrange air drops</b> for ${list([...new Set(air.map((l) => esc(l.b.name)))])}. No road route is safe or open.` : '',
        st.closures.length ? `<b>Keep traffic away from the ${st.closures.length} closed road${st.closures.length > 1 ? 's' : ''}</b> marked ✕ on the map; trucks have been sent round them.` : '',
        (g.trucks || g.short.length) ? `<b>Ask the state or national authority for more help:</b> ${[g.trucks ? `${plural(g.trucks, 'more truck')}${g.buses ? ` and ${plural(g.buses, 'bus', 'buses')}` : ''} (our vehicles are ${Math.round(g.util * 100)}% busy)` : '', ...g.short.map((x) => qty(x.k.key, x.n))].filter(Boolean).join('; ')}.` : '',
      ])),
      section('Next 1 to 3 days', steps([
        ...A.later,
        st.warehouses?.sizes?.length ? `<b>Stock the recommended storage sites</b> (purple diamonds on the map) so each can supply its areas within ${AA.config.coverageMinutes} minutes for 3 days:${bullets(st.warehouses.sizes.map((s, k) => `<b>S${k + 1}</b> at ${(() => { const c = st.warehouses.cand[s.j]; return c.address ? esc(c.address) : `${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}`; })()} (serves ${s.zones.map((id) => esc(st.zones.find((z) => z.id === id)?.name || id)).join(', ')}): ${qty('water', s.stock.water)}, ${qty('food', s.stock.food)}, ${qty('shelter', s.stock.shelter)}, ${qty('medical', s.stock.medical)}.`))}` : '',
        'Re-run AidAtlas every 6 hours with field reports. Mark areas that have enough so supplies move to the next area in need.',
        'Keep one lane open on main roads for relief trucks and ambulances; send other traffic away.',
      ])),
      section('Supplies needed in the next 6 hours', `<table class="rt"><thead><tr><th>Item</th><th>Needed</th><th>We can deliver</th><th>Still short</th></tr></thead><tbody>${K.map((k) => { const d = M.sum(st.zones.map((z) => z.d[k.key] || 0)), u = M.sum(run.alloc.unmet.map((x) => x[k.key] || 0)); return `<tr><td>${k.label}</td><td>${qty(k.key, d)}</td><td>${qty(k.key, d - u)}</td><td>${u > 1e-6 ? qty(k.key, u) : 'none'}</td></tr>`; }).join('')}</tbody></table><p class="small">Daily amounts follow the Sphere humanitarian standards: 15 litres of water and 2,100 kcal of food per displaced person per day, and one family tent per 5 people.</p>`),
      section('Where everything is', `<p>Addresses come from OpenStreetMap. Where the map has no street address, use the coordinates or the map link (opens Google Maps for directions).</p>${placesTable([
        ...zones.map((z) => [`${z.id} ${z.name}`, `Affected area${z.covers?.length ? ` (also ${z.covers.slice(0, 4).join(', ')})` : ''}`, z]),
        ...[...new Set(disp.map((x) => x.depot))].map((d) => [`${d.id} ${d.name}`, d.typeLabel, d]),
        ...[...new Set(flows.map((x) => st.hospitals[x.h]))].map((h) => [`${h.id} ${h.name}`, 'Receiving hospital', h]),
        ...(st.warehouses?.sizes || []).map((s, k) => [`S${k + 1}`, 'Recommended storage site', st.warehouses.cand[s.j]]),
      ])}`),
      ...(AA.savings ? (() => { const c = AA.savings.compare(st); return c ? [section('What this plan saves', `<p>Compared with sending supplies from the nearest store (the usual manual rule), with the same stock, vehicles and roads, for this ${c.epochHours}-hour period:</p>${bullets(AA.savings.headlines(c).map(esc))}<p class="small">Nearest store: transport ${f.usd(c.baseline.cost)}, ${f.n(c.baseline.vehHours, 0)} vehicle-hours, ${Math.round(c.baseline.critCoverage * 100)} % of critical need delivered. This plan: ${f.usd(c.optimised.cost)}, ${f.n(c.optimised.vehHours, 0)} vehicle-hours, ${Math.round(c.optimised.critCoverage * 100)} %.</p>`)] : []; })() : []),
      section('What could change this plan', bullets([`<b>Watch:</b> ${A.watch}`, 'If an area gets worse, use “Demand surge”. If it has enough, use “Mark served”. If a road or store is lost, mark it on the map: AidAtlas re-plans immediately.', `The forecast range is wide (${about(sm.aff.p10)}–${about(sm.aff.p90)} people affected). Keep about a third of the stock in reserve until field teams confirm.`])),
      section('How these numbers were made', `<p class="small">Hazard data: ${esc(sit.src || 'scenario')}. Towns, hospitals and stores: OpenStreetMap. Roads and drive times: OSRM. Country vulnerability: ${esc(sit.countryIdx?.prov || 'assumed')}. Forecast: 400 computer simulations with damage curves of the kind used by the USGS PAGER system. Allocation: an optimisation model that gives each area a share by need at the lowest transport cost. Stock levels at real facilities are planning assumptions unless your own inventory was loaded. Full calculations are in the app under <i>Models</i>.</p>`),
    ];
    return r;
  };

  R.live = (events) => {
    const top = events.slice(0, 5);
    const r = head('Global situation report: top 5 disasters now', `Live data from GDACS, USGS and NASA EONET`);
    r.sections = [
      section('Summary', `<p>${top.length} disasters are ranked below by their overall severity (agency alert level, size of the event and how deadly this kind of disaster usually is). Open any of them in AidAtlas to get a full local plan with routes and supply lists.</p>`),
      ...top.map((e, k) => {
        const A = adv(e.hazard);
        const sz = e.hazard === 'EQ' ? `magnitude ${(+(e.magnitude ?? e.severity)).toFixed(1)}` : e.hazard === 'TC' ? `winds up to ${Math.round(e.severity || 0)} km/h` : e.severity ? `${about(e.severity)} ${esc(e.severityUnit || '')}` : '';
        const level = e.alertlevel ? `${e.alertlevel} alert` : e.pager ? `USGS ${e.pager} alert` : 'no agency alert yet';
        return section(`${k + 1}. ${esc(e.name)}`, `<p><b>Where:</b> ${esc(e.country || 'see map')} (${e.lat.toFixed(2)}, ${e.lon.toFixed(2)}). <b>What:</b> ${AA.HAZARDS[e.hazard].label}${sz ? `, ${sz}` : ''}. <b>Level:</b> ${esc(level)}. <b>Source:</b> ${esc(e.src)}${e.url ? ` (<a href="${esc(e.url)}">report</a>)` : ''}.</p>${steps([A.warn, A.first[0], `Watch: ${A.watch}`])}`);
      }),
      section('About this ranking', `<p class="small">Severity score = half agency alert + about one third event size + a small weight for how deadly this type of disaster usually is. Green alerts with large sizes can rank above small orange alerts. Always confirm with the national Met department and disaster authority.</p>`),
    ];
    return r;
  };

  R.history = (place, events) => {
    const top = events.slice(0, 5);
    const counts = {}; events.forEach((e) => (counts[e.hazard] = (counts[e.hazard] || 0) + 1));
    const main = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    const r = head(`Disaster history report: ${place.short || place.name}`, `Major events within 300 km`);
    r.sections = [
      section('Summary', `<p>We found <b>${events.length}</b> major recorded events within 300 km of ${esc(place.short || place.name)}. ${main ? `The most frequent type is <b>${AA.HAZARDS[main[0]].label.toLowerCase()}</b> (${main[1]} events).` : ''} The five most recent are listed below. Open each one in AidAtlas to see the aid routes and storage sites that would have worked best.</p>`),
      section('Most recent events', `<table class="rt"><thead><tr><th>Date</th><th>Event</th><th>Size</th><th>Distance</th></tr></thead><tbody>${top.map((e) => `<tr><td>${(e.from || '').slice(0, 10)}</td><td>${esc(e.name)}</td><td>${e.hazard === 'EQ' ? `M ${(+(e.magnitude ?? e.severity)).toFixed(1)}` : esc(e.alertlevel || '')}</td><td>${Math.round(M.haversine(place, e))} km</td></tr>`).join('')}</tbody></table>`),
      section('What this means for planning', steps([
        main ? `Prepare first for <b>${AA.HAZARDS[main[0]].label.toLowerCase()}s</b>: ${adv(main[0]).first[0]}` : '',
        'Use Plan mode at the same place with the size of the largest past event to work out how much stock to keep and where.',
        'Keep at least 3 days of water, food, tents and medicine in storage sites outside the most damaged zone of past events.',
        'Check that hospitals and main roads used in past events have been strengthened.',
      ])),
    ];
    return r;
  };

  R.risk = (rr) => {
    const r = head(`Disaster risk and preparedness report: ${rr.place}`, `Risk grid of about 120 × 120 km`);
    const yrs = rr.gr.lambda6 > 0 ? Math.round(1 / rr.gr.lambda6) : null;
    r.sections = [
      section('Summary', `<p>We combined the earthquake record, 20 years of river flow, past storms, fires and volcanoes, where people live, how far they are from a hospital and national coping capacity. The five areas below have the highest risk. ${yrs ? `In the wider region (400 km), an earthquake of magnitude 6 or more happens about <b>once every ${about(yrs)} years</b> on average.` : ''}</p>`),
      section('Highest-risk areas', `<table class="rt"><thead><tr><th>#</th><th>Area</th><th>Main danger</th><th>Risk (0–1)</th><th>Why</th></tr></thead><tbody>${rr.top.map((c, k) => { const why = [c.H > 0.6 ? 'frequent hazards' : '', c.E > 0.6 ? 'many people' : '', c.V > 0.6 ? 'vulnerable homes and incomes' : '', c.LCC > 0.6 ? 'far from hospitals / low capacity' : ''].filter(Boolean); return `<tr><td>${k + 1}</td><td>${esc(c.name)}</td><td>${AA.HAZARDS[c.dominant].label}</td><td>${c.R.toFixed(2)}</td><td>${why.length ? why.join(', ') : 'combination of factors'}</td></tr>`; }).join('')}</tbody></table>`),
      section('Prepare now', steps([
        ...[...new Set(rr.top.map((c) => c.dominant))].map((h) => `<b>${AA.HAZARDS[h].label}:</b> ${adv(h).first[0]} ${adv(h).warn}`),
        rr.sites?.length ? `<b>Build or rent storage</b> at the ${rr.sites.length} purple sites on the map. Each reaches its high-risk areas within ${AA.config.coverageMinutes} minutes by road: ${rr.sites.map((s, k) => `<b>S${k + 1}</b>${at(s)} serves ${s.serves.map(esc).join(', ')}`).join('; ')}.` : 'Press “Plan storage for all five” to get recommended storage sites.',
        'Run a drill: open each high-risk area in Plan mode and check that its supplies and routes work.',
        'Make sure every high-risk area has a warning system (sirens, SMS, radio) and a known evacuation route.',
      ])),
      section('How the risk score works', `<p class="small">Risk follows the INFORM index used by the UN and EU: hazard × exposure, vulnerability and lack of coping capacity, each weighted equally. A high score in one part cannot be cancelled out by a low score in another.</p>`),
    ];
    return r;
  };

  R.readiness = (rd) => {
    const r = head(`Pre-season readiness report: ${rd.place}`, `Score ${Math.round(rd.score)}/100 · ${rd.grade}`);
    const items = (a) => a.items.map((it) => `${esc(it.label)} ${Math.round(it.r * 100)} %`).join(', ');
    r.sections = [
      section('Summary', `<p>${esc(rd.place)} scores <b>${Math.round(rd.score)} out of 100 (${esc(rd.grade.toLowerCase())})</b>. The score asks: if the worst likely disaster (the P90 case) hit one of the five highest-risk areas, could the stock and vehicles within ${AA.readiness.REACH_HOURS} hours by road cover the first ${AA.readiness.DAYS * 24} hours? 100 means every item and enough vehicles for every area. ${rd.weakest ? `The weakest area is <b>${esc(rd.weakest.area.name)}</b> (${Math.round(rd.weakest.score)}/100).` : ''}</p>`),
      section('Add before the season', rd.gaps.length || rd.vehicles.trucks || rd.vehicles.buses ? steps([...rd.gaps.map((g) => `Add <b>${qty(g.key, g.add)}</b> to stores that can reach the high-risk areas within ${AA.readiness.REACH_HOURS} hours.`), rd.vehicles.trucks ? `Arrange <b>${plural(rd.vehicles.trucks, 'more truck')}</b> (own, contracted or on standby).` : '', rd.vehicles.buses ? `Arrange <b>${plural(rd.vehicles.buses, 'more responder bus', 'more responder buses')}</b>.` : '']) : '<p>No gaps: current stock and vehicles cover the worst likely case in each area.</p>'),
      section('Area by area', `<table class="rt"><thead><tr><th>Area</th><th>Main danger</th><th>People affected (P90)</th><th>Score</th><th>Items covered</th><th>Vehicles</th></tr></thead><tbody>${rd.areas.map((a) => `<tr><td>${esc(a.area.name)}</td><td>${AA.HAZARDS[a.area.hazard]?.label || ''}</td><td>${about(a.area.affP90)}</td><td>${Math.round(a.score)}</td><td>${items(a)}</td><td>${Math.round(a.transport.r * 100)} %</td></tr>`).join('')}</tbody></table>`),
      section('How the score is made', `<p class="small">For each area AidAtlas runs a design disaster (its main hazard; earthquakes at the size expected once in 475 years) and forecasts people affected, displaced and injured with 400 simulations. The worst likely case (90th percentile) is turned into ${AA.readiness.DAYS} days of water, food, tents, medical kits and staff using Sphere standards. Stock counts only if its store is within ${AA.readiness.REACH_HOURS} hours by road and is not itself badly damaged. Item scores are capped at 100 % and weighted by how critical the item is (water and medical highest); vehicles count with weight ${AA.readiness.TRANSPORT_WEIGHT}. The district score weights each area by the people at risk. Stock source: ${esc(rd.source)}. Roads: ${esc(rd.roads)}.</p>`),
    ];
    return r;
  };

  // ---------- render / export ----------
  const toText = (r) => {
    const tmp = document.createElement('div');
    const parts = [r.title, r.sub, `Prepared ${r.created.toLocaleString()} by AidAtlas`, ''];
    r.sections.forEach((s) => { tmp.innerHTML = s.html.replace(/<a href="([^"]+)"[^>]*>[^<]*<\/a>/g, '$1').replace(/<ul>/g, '\n<ul>').replace(/<li>/g, '<li>• ').replace(/<\/(p|li|tr|h\d)>/g, '\n').replace(/<\/t[dh]>/g, ' | '); parts.push(s.h.toUpperCase(), tmp.textContent.replace(/\n\s*\n+/g, '\n').trim(), ''); });
    return parts.join('\n');
  };
  const docHtml = (r) => `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(r.title)}</title><style>${R.CSS}</style></head><body><article class="rep">${R.inner(r)}</article></body></html>`;
  R.inner = (r) => `<header><div class="brand">AidAtlas</div><h1>${esc(r.title)}</h1><p class="sub">${esc(r.sub)} · prepared ${esc(r.created.toLocaleString())}</p></header>${r.sections.map((s) => `<section><h2>${s.h}</h2>${s.html}</section>`).join('')}<footer>Generated from AidAtlas model outputs. Forecasts are estimates, not guarantees. Confirm with the national meteorological department and disaster management authority before acting.</footer>`;
  R.CSS = `body{margin:0;background:#fff;color:#1d2024;font:15px/1.6 'IBM Plex Sans',system-ui,sans-serif}.rep{max-width:780px;margin:0 auto;padding:28px 24px}.rep header{border-bottom:2px solid #1d2024;padding-bottom:10px;margin-bottom:6px}.brand{font:700 22px 'Caveat',cursive;color:#1f5fbf}.rep h1{font-size:24px;line-height:1.2;margin:4px 0}.sub{color:#5b6068;margin:0;font-size:13px}.rep h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:22px 0 6px;color:#1f5fbf}.steps{padding-left:22px}.steps>li{margin:6px 0}.rt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.rt th,.rt td{border-bottom:1px solid #dde0e4;padding:5px 6px;text-align:left;vertical-align:top}.rt th{background:#f4f6f8}.small{font-size:12.5px;color:#4b5058}.rep footer{margin-top:26px;border-top:1px solid #dde0e4;padding-top:8px;font-size:12px;color:#5b6068}@media print{.rep{padding:0}a{color:inherit}}`;

  R.open = (r) => {
    let m = document.getElementById('reportModal');
    if (!m) { m = document.createElement('div'); m.id = 'reportModal'; m.className = 'modal report-modal'; document.body.appendChild(m); }
    m.hidden = false;
    m.innerHTML = `<div class="box report-box" role="dialog" aria-label="Action report"><div class="report-bar"><b>Action report</b><span class="btns"><button class="btn primary" id="repPrint" type="button">Print / save as PDF</button><button class="btn" id="repCopy" type="button">Copy text</button><button class="btn" id="repDl" type="button">Download</button><button class="btn" id="repClose" type="button">Close</button></span></div><style>${R.CSS.replace(/body\{[^}]*\}/, '')}</style><article class="rep">${R.inner(r)}</article></div>`;
    const close = () => (m.hidden = true);
    m.querySelector('#repClose').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
    m.querySelector('#repPrint').onclick = () => { const w = window.open('', '_blank'); if (w) { w.document.write(docHtml(r)); w.document.close(); w.focus(); setTimeout(() => w.print(), 300); } else window.print(); };
    m.querySelector('#repCopy').onclick = async () => { try { await navigator.clipboard.writeText(toText(r)); AA.app?.toast('Report copied as plain text.'); } catch (e) { AA.app?.toast('Copy was blocked by the browser; use Download instead.', { err: true }); } };
    m.querySelector('#repDl').onclick = () => { const b = new Blob([docHtml(r)], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = r.title.replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 80) + '.html'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  };
  R.toText = toText;

  AA.report = R;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/workspace-ui.js */
/* Workspace UI: profile & roles, team, shared back end, saved plans, decision log, watch areas, inventory sync.
   Skill: skills/workspace/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math, W = AA.workspace, ENG = AA.engine;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const $ = (s, el = document) => el.querySelector(s);
  const UI = {};
  const toast = (m, o) => AA.app && AA.app.toast(m, o);
  const fmtDate = (iso) => { try { return new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return iso || ''; } };

  UI.download = (name, text, type = 'application/json') => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  const slug = (s) => String(s || 'plan').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'plan';

  /** Note typed by the user for the next action; ENG.event receives it as meta.note. */
  UI.takeNote = () => { const i = $('#decNote'); const v = i ? i.value.trim() : ''; if (i) i.value = ''; return v; };
  UI.act = (type, p = {}) => ENG.event(type, p, { note: UI.takeNote() });

  UI.roleBadge = () => { const me = W.me(); return `<span class="prov" title="${esc(W.mode() === 'cloud' ? 'Signed in to the shared workspace' : 'Local profile on this browser')}">${esc(me.name)} · ${esc(W.ROLES[me.role]?.label || me.role)}${W.mode() === 'cloud' ? ' · shared' : ''}</span>`; };
  UI.refreshBadge = () => { const b = $('#wsBadge'); if (!b) return; const me = W.me(); b.hidden = false; b.textContent = W.ROLES[me.role]?.label || me.role; b.className = 'wsbadge ' + me.role; };

  // ================= plan view: save, share, decision log, inventory =================
  UI.planSection = (st) => {
    const can = W.can('save'), src = W.inventory.source();
    const decs = (st.decisions || []).slice().reverse();
    return `<div class="sec" id="wsPlan"><h3>Save, share and decision log <a href="guide.html#saved-plans" target="_blank" rel="noopener">?</a></h3>
      <p class="small" style="margin:0">${UI.roleBadge()}${st.savedName ? ` · saved as <b>${esc(st.savedName)}</b>` : ' · not saved yet'}</p>
      ${can ? `<label class="field">Plan name<input id="planName" type="text" maxlength="80" value="${esc(st.savedName || st.sit.name || 'Plan')}"></label>
      <div class="btns"><button class="btn primary" id="planSave" type="button">${st.savedId ? 'Save changes' : 'Save plan'}</button>${st.savedId ? '<button class="btn" id="planSaveNew" type="button">Save as new</button>' : ''}<button class="btn" id="planFile" type="button">Download plan file</button></div>
      <label class="field">Note for the log <span class="muted">(optional: why you are making the next change)</span><input id="decNote" type="text" maxlength="200" placeholder="e.g. District officer confirmed bridge at Km 12 is down"></label>`
      : `<p class="note">View only: your role can read this plan and its reports, but not change or save it.</p><div class="btns"><button class="btn" id="planFile" type="button">Download plan file</button></div>`}
      ${W.can('inventory') ? `<div class="card small" style="display:grid;gap:6px"><b>Live inventory</b>${src ? `<span>Source: ${esc(src.label || src.url)}${src.everyMin ? ` · auto-sync every ${src.everyMin} min` : ''}${st.invSyncedAt ? ` · last synced ${fmtDate(st.invSyncedAt)}` : ''}</span><div class="btns"><button class="btn" id="invSync" type="button">Sync stock and fleet now</button></div>` : `<span>Connect a Google Sheet or CSV so stock and vehicles are real, not assumed.</span><div class="btns"><button class="btn" id="invConnect" type="button">Connect inventory</button></div>`}</div>` : ''}
      <div class="log" style="margin-top:6px">${decs.slice(0, 8).map((d) => `<div class="e"><b>${fmtDate(d.at)}</b> · T+${(d.epoch || 0) * AA.config.epochHours} h · ${esc(d.by)} (${esc(d.role)})<div class="d">${esc(d.reason)}${d.note ? ` — <i>${esc(d.note)}</i>` : ''}</div></div>`).join('') || '<p class="small muted">No decisions yet.</p>'}</div>
      ${decs.length ? `<div class="btns"><button class="btn" id="decCsv" type="button">Download decision log (CSV)</button></div>` : ''}</div>`;
  };
  UI.bindPlan = (st) => {
    const save = async (asNew) => {
      const name = ($('#planName')?.value || '').trim() || st.sit.name || 'Plan';
      try {
        const id = await W.plans.save(ENG.snapshot(name), asNew ? null : st.savedId);
        const first = !st.savedId || asNew;
        st.savedId = id; st.savedName = name;
        ENG.decide('save', {}, `Plan saved as “${name}”${W.mode() === 'cloud' ? ' (shared with the team)' : ' (this browser)'}`, UI.takeNote());
        if (AA.collab && W.mode() === 'cloud') { AA.collab.markSaved(); if (first) { await AA.collab.pushLocal(st); AA.collab.start(st); } }
        toast(`Saved “${esc(name)}”.`); AA.app.rerender();
      } catch (e) { toast(esc(e.message), { err: true }); }
    };
    $('#planSave')?.addEventListener('click', () => save(false));
    $('#planSaveNew')?.addEventListener('click', () => save(true));
    $('#planFile')?.addEventListener('click', () => { const snap = ENG.snapshot(($('#planName')?.value || st.savedName || st.sit.name)); UI.download(`aidatlas-${slug(snap.name)}.json`, JSON.stringify(snap)); });
    $('#decCsv')?.addEventListener('click', () => UI.download(`aidatlas-decisions-${slug(st.savedName || st.sit.name)}.csv`, W.decisionsCSV(st.decisions), 'text/csv'));
    $('#invSync')?.addEventListener('click', () => UI.syncInventory(true));
    $('#invConnect')?.addEventListener('click', () => UI.openWorkspace('inventory'));
  };

  // inventory sync: fetch rows, apply when they changed (or when forced)
  let invTimer = null, lastInvHash = '';
  UI.syncInventory = async (force = false) => {
    const st = ENG.state, src = W.inventory.source(); if (!st || !src) return;
    try {
      const rows = await W.inventory.fetchRows(src.url);
      if (!rows.length) throw new Error('No rows with lat and lon found in the inventory source.');
      const h = JSON.stringify(rows);
      st.invSyncedAt = new Date().toISOString();
      if (!force && h === lastInvHash) return;
      lastInvHash = h;
      await ENG.event('importDepots', { rows, source: src.label || src.url }, { note: force ? 'Manual inventory sync' : 'Automatic inventory sync' });
      toast(`Inventory synced: ${rows.length} stores.`);
    } catch (e) { toast(`Inventory sync failed: ${esc(e.message)}`, { err: true }); }
  };
  UI.startInventoryAuto = () => {
    clearInterval(invTimer); lastInvHash = '';
    const src = W.inventory.source();
    if (!src || !W.can('inventory')) return;
    if (src.applyOnOpen !== false) UI.syncInventory(false);
    if (src.everyMin > 0) invTimer = setInterval(() => { if (ENG.state) UI.syncInventory(false); }, src.everyMin * 60e3);
  };
  UI.stopInventoryAuto = () => clearInterval(invTimer);

  // ================= plan start: saved plans =================
  UI.savedPlansSection = () => `<div class="sec card" id="savedPlans"><h3>Saved plans</h3><div id="savedList" class="small"><span class="spin"></span> Loading…</div>
      <label class="field">Open a plan file<input id="planIn" type="file" accept=".json,application/json"></label></div>`;
  UI.fillSavedPlans = async () => {
    const box = $('#savedList'); if (!box) return;
    try {
      const list = await W.plans.list();
      box.innerHTML = list.length ? `<ul class="plist">${list.map((p) => `<li><button class="linkbtn" type="button" data-open="${esc(p.id)}"><b>${esc(p.name)}</b></button><br><span class="muted">${fmtDate(p.savedAt)} · ${esc(p.savedBy || '')}${p.summary ? ` · ${AA.HAZARDS[p.summary.hazard]?.label || ''} · ${AA.fmt.k(p.summary.affected)} affected · T+${(p.summary.epoch || 0) * AA.config.epochHours} h` : ''}</span>${W.can('save') ? ` <button class="linkbtn danger" type="button" data-del="${esc(p.id)}">delete</button>` : ''}</li>`).join('')}</ul>`
        : `<span class="muted">No saved plans ${W.mode() === 'cloud' ? 'in your team yet' : 'in this browser yet'}. Build a plan, then press “Save plan”.</span>`;
      box.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', async () => { try { const snap = await W.plans.load(b.dataset.open); snap.id = b.dataset.open; AA.app.openSnapshot(snap); } catch (e) { toast(esc(e.message), { err: true }); } }));
      box.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => { if (b.dataset.armed) { try { await W.plans.remove(b.dataset.del); UI.fillSavedPlans(); } catch (e) { toast(esc(e.message), { err: true }); } } else { b.dataset.armed = '1'; b.textContent = 'click again to delete'; } }));
    } catch (e) { box.innerHTML = `<span class="muted">${esc(e.message)}</span>`; }
    $('#planIn')?.addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      try { const snap = JSON.parse(await file.text()); AA.app.openSnapshot(snap); } catch (er) { toast(`Not a valid plan file: ${esc(er.message)}`, { err: true }); }
    });
  };

  // ================= live view: watch areas =================
  UI.watchSection = () => `<div class="sec" id="watchSec"><h3>Watch areas <a href="guide.html#watch-areas" target="_blank" rel="noopener">?</a></h3><div id="watchList" class="small"><span class="spin"></span></div>
      ${W.can('watch') ? `<details class="card small"><summary><b>Add a watch area</b> (centred on the map view)</summary>
        <label class="field">Name<input id="waName" type="text" maxlength="80" placeholder="e.g. My district"></label>
        <div class="grid2"><label class="field">Radius (km)<input id="waR" type="number" min="5" max="1000" value="150"></label>
        <label class="field">Alert me at<select id="waLvl"><option value="Orange">Orange or Red</option><option value="Red">Red only</option><option value="Green">Any level</option></select></label></div>
        <div class="checks">${Object.entries(AA.HAZARDS).map(([k, v]) => `<label><input type="checkbox" data-wh="${k}" checked> ${v.label}</label>`).join(' ')}</div>
        <div class="btns"><button class="btn primary" id="waAdd" type="button">Add watch area</button></div></details>` : ''}
      <div class="btns"><button class="btn" id="waNotify" type="button">Turn on browser alerts</button><button class="btn" id="waExport" type="button">Export for scheduled alerts</button></div>
      <p class="small muted" style="margin:0">Browser alerts work while AidAtlas is open. For e-mail or chat alerts when it is closed, export the list and use the scheduled checker (guide → Watch areas).</p></div>`;
  UI.fillWatch = async (events) => {
    const box = $('#watchList'); if (!box) return;
    let areas = [];
    try { areas = await W.watch.list(); } catch (e) { box.innerHTML = `<span class="muted">${esc(e.message)}</span>`; return; }
    const matches = W.matchWatch(areas, events || AA.app.live || []);
    UI.lastWatch = { areas, matches };
    box.innerHTML = areas.length ? `<ul class="plist">${areas.map((a) => { const hits = matches.filter((m) => m.area.id === a.id); return `<li><b>${esc(a.name)}</b> <span class="muted">${Math.round(a.radiusKm)} km · ${esc(a.minLevel)}+ · ${a.hazards.length === 6 ? 'all hazards' : a.hazards.join(', ')}</span>${hits.length ? `<br>${hits.slice(0, 3).map((m) => `<button class="linkbtn alerthit ${m.level}" type="button" data-ev="${esc(m.event.id)}">${esc(m.level)}: ${esc(m.event.name)} · ${Math.round(m.distKm)} km</button>`).join('<br>')}` : '<br><span class="muted">Nothing active at this level.</span>'}${W.can('watch') ? ` <button class="linkbtn danger" type="button" data-wdel="${esc(a.id)}">remove</button>` : ''}</li>`; }).join('')}</ul>`
      : '<span class="muted">No watch areas yet. Move the map to a place you are responsible for, then add one.</span>';
    box.querySelectorAll('[data-ev]').forEach((b) => b.addEventListener('click', () => { const e = (AA.app.live || []).find((x) => x.id === b.dataset.ev); if (e) AA.app.openEvent(e); }));
    box.querySelectorAll('[data-wdel]').forEach((b) => b.addEventListener('click', async () => { await W.watch.remove(b.dataset.wdel); UI.fillWatch(events); }));
    UI.notify(matches);
  };
  /** Toast + browser notification once per (area, event, level). */
  UI.notify = (matches) => {
    const fresh = W.newMatches(matches);
    if (!fresh.length) return;
    const m = fresh[0];
    toast(`<b>Watch alert:</b> ${esc(m.level)} ${esc(AA.HAZARDS[m.event.hazard]?.label || '')} near ${esc(m.area.name)} — ${esc(m.event.name)}${fresh.length > 1 ? ` (+${fresh.length - 1} more)` : ''}`, { sticky: true });
    try { if (root.Notification && Notification.permission === 'granted') fresh.slice(0, 3).forEach((x) => new Notification(`AidAtlas: ${x.level} alert near ${x.area.name}`, { body: `${x.event.name} · ${Math.round(x.distKm)} km away` })); } catch (e) { /* not supported */ }
  };
  UI.bindWatch = () => {
    $('#waAdd')?.addEventListener('click', async () => {
      const c = AA.map.map().getCenter();
      const hazards = [...document.querySelectorAll('[data-wh]')].filter((i) => i.checked).map((i) => i.dataset.wh);
      try { await W.watch.add({ name: $('#waName').value.trim() || `Area at ${c.lat.toFixed(2)}, ${c.lng.toFixed(2)}`, lat: c.lat, lon: c.lng, radiusKm: +$('#waR').value, minLevel: $('#waLvl').value, hazards }); UI.fillWatch(); toast('Watch area added.'); }
      catch (e) { toast(esc(e.message), { err: true }); }
    });
    $('#waNotify')?.addEventListener('click', async () => {
      if (!root.Notification) { toast('This browser does not support notifications.', { err: true }); return; }
      const p = await Notification.requestPermission();
      toast(p === 'granted' ? 'Browser alerts are on while AidAtlas is open.' : 'Browser alerts were not allowed.', { err: p !== 'granted' });
    });
    $('#waExport')?.addEventListener('click', async () => { const a = await W.watch.list(); UI.download('watch-areas.json', JSON.stringify(a.map(({ name, lat, lon, radiusKm, hazards, minLevel }) => ({ name, lat: +lat.toFixed(4), lon: +lon.toFixed(4), radiusKm, hazards, minLevel })), null, 2)); });
  };

  // ================= workspace modal =================
  UI.openWorkspace = async (focus) => {
    const m = $('#workspace'), me = W.me(), cloud = W.cloud, cfg = cloud?.config();
    m.hidden = false;
    const local = W.mode() === 'local';
    m.innerHTML = `<div class="box wide" role="dialog" aria-label="Workspace"><h2>Workspace</h2>
      <section><div class="eyebrow">You</div>
        ${local ? `<div class="grid2"><label class="field">Name<input id="wsName" type="text" maxlength="80" value="${esc(me.name)}"></label><label class="field">Organisation<input id="wsOrg" type="text" maxlength="80" value="${esc(me.org || '')}"></label></div>
        <label class="field">Role on this browser<select id="wsRole">${Object.entries(W.ROLES).map(([k, v]) => `<option value="${k}" ${me.role === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
        <p class="small muted">Local roles help a shared control-room computer show the right buttons. They are not security: anyone at this computer can change them. For real access control, connect the shared back end below.</p>`
        : `<p class="small">Signed in as <b>${esc(me.email)}</b> · team <b>${esc(me.org || 'none')}</b> · role <b>${esc(W.ROLES[me.role]?.label || me.role)}</b>${cloud.teams.length > 1 ? ` · <select id="wsTeam">${cloud.teams.map((t) => `<option value="${t.id}" ${t.id === cloud.team?.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>` : ''}</p><div class="btns"><button class="btn" id="wsOut" type="button">Sign out</button></div>`}
      </section>
      <section id="wsTeamSec"><div class="eyebrow">Team</div><div id="wsTeamBody" class="small"></div></section>
      <section id="wsInv"><div class="eyebrow">Inventory source</div>
        <p class="small muted" style="margin:0">A Google Sheet (shared “anyone with the link can view”, or File → Share → Publish to web → CSV), any CSV link, or a JSON link. Columns: name, lat, lon, type, water_l, food_kg, tents, medkits, staff, trucks, buses, ambulances, beds. Common spellings (latitude, lng, water, ambulance…) are recognised. <a href="guide.html#inventory" target="_blank" rel="noopener">Guide</a></p>
        <label class="field">Link<input id="wsInvUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(W.inventory.source()?.url || '')}" ${W.can('inventory') ? '' : 'disabled'}></label>
        <div class="grid2"><label class="field">Auto-sync while a plan is open<select id="wsInvEvery" ${W.can('inventory') ? '' : 'disabled'}>${[0, 5, 15, 30, 60].map((n) => `<option value="${n}" ${(W.inventory.source()?.everyMin ?? 15) === n ? 'selected' : ''}>${n ? `every ${n} min` : 'off (manual only)'}</option>`).join('')}</select></label>
        <label class="field">Use it when a plan opens<select id="wsInvOpen" ${W.can('inventory') ? '' : 'disabled'}><option value="1">Yes, replace assumed stock</option><option value="0" ${W.inventory.source()?.applyOnOpen === false ? 'selected' : ''}>No, only when I press Sync</option></select></label></div>
        <div class="btns">${W.can('inventory') ? '<button class="btn" id="wsInvTest" type="button">Test link</button><button class="btn" id="wsInvSave" type="button">Save source</button>' : ''}${W.inventory.source() && W.can('inventory') ? '<button class="btn" id="wsInvClear" type="button">Disconnect</button>' : ''}</div><div id="wsInvMsg" class="small"></div></section>
      <section><div class="eyebrow">Shared back end (optional)</div>
        <p class="small muted" style="margin:0">Connect a free Supabase project to share saved plans and watch areas across a team, with sign-in by e-mailed code and roles enforced by the database. Set-up: run <span class="mono">supabase/schema.sql</span> once in the Supabase SQL editor, then paste the project URL and the public “anon” key here. <a href="guide.html#shared-workspace" target="_blank" rel="noopener">Guide</a></p>
        ${W.can('settings') || !cfg ? `<div class="grid2"><label class="field">Project URL<input id="wsSbUrl" type="url" placeholder="https://xxxx.supabase.co" value="${esc(cfg?.url || '')}"></label><label class="field">Public anon key<input id="wsSbKey" type="text" value="${esc(cfg?.key || '')}"></label></div>
        <div class="btns"><button class="btn" id="wsSbSave" type="button">${cfg ? 'Update connection' : 'Connect'}</button>${cfg ? '<button class="btn" id="wsSbOff" type="button">Disconnect</button>' : ''}</div>` : '<p class="small">Connected. Only an admin can change the connection.</p>'}
        ${cfg && local ? `<div class="grid2"><label class="field">Your e-mail<input id="wsEmail" type="email" placeholder="name@agency.gov"></label><label class="field">6-digit code<input id="wsCode" type="text" inputmode="numeric" maxlength="10" placeholder="from the e-mail"></label></div><div class="btns"><button class="btn" id="wsSend" type="button">Send code</button><button class="btn primary" id="wsVerify" type="button">Sign in</button></div>` : ''}
        <div id="wsSbMsg" class="small"></div></section>
      <div class="btns"><button class="btn primary" id="wsDone" type="button">Done</button></div></div>`;
    const close = () => { m.hidden = true; AA.app.rerender(); UI.refreshBadge(); };
    $('#wsDone').addEventListener('click', () => { if (local && $('#wsName')) { W.setMe({ name: $('#wsName').value.trim() || 'Local user', org: $('#wsOrg').value.trim(), role: $('#wsRole').value }); } close(); });
    m.onclick = (e) => { if (e.target === m) close(); };
    $('#wsOut')?.addEventListener('click', async () => { await cloud.signOut(); UI.openWorkspace(); });
    $('#wsTeam')?.addEventListener('change', (e) => { cloud.useTeam(e.target.value); UI.openWorkspace(); });
    UI.renderTeam();
    // inventory
    const invSrc = () => ({ url: $('#wsInvUrl').value.trim(), everyMin: +$('#wsInvEvery').value, applyOnOpen: $('#wsInvOpen').value === '1', label: (() => { try { const u = new URL($('#wsInvUrl').value.trim()); return /docs\.google\.com/.test(u.host) ? 'Google Sheet' : u.host; } catch (e) { return 'link'; } })() });
    $('#wsInvTest')?.addEventListener('click', async () => { const msg = $('#wsInvMsg'); msg.innerHTML = '<span class="spin"></span> Reading…'; try { const rows = await W.inventory.fetchRows(invSrc().url); msg.innerHTML = rows.length ? `Found <b>${rows.length}</b> stores with locations, e.g. ${esc(rows[0].name || 'unnamed')} (${rows[0].lat}, ${rows[0].lon}): ${rows[0].water_l ?? 0} L water, ${rows[0].trucks ?? 0} trucks.` : 'Read the link, but found no rows with lat and lon.'; } catch (e) { msg.textContent = `Could not read it: ${e.message}. For Google Sheets, share as “anyone with the link can view”.`; } });
    $('#wsInvSave')?.addEventListener('click', () => { const s = invSrc(); if (!/^https:\/\//.test(s.url)) { $('#wsInvMsg').textContent = 'Enter an https:// link.'; return; } W.inventory.setSource(s); $('#wsInvMsg').textContent = 'Saved. It will be used for the next plan you open.'; });
    $('#wsInvClear')?.addEventListener('click', () => { W.inventory.setSource(null); UI.stopInventoryAuto(); UI.openWorkspace('inventory'); });
    // cloud
    const sbMsg = (t) => { $('#wsSbMsg').textContent = t; };
    $('#wsSbSave')?.addEventListener('click', async () => { sbMsg('Connecting…'); try { const signed = await cloud.configure({ url: $('#wsSbUrl').value, key: $('#wsSbKey').value }); sbMsg(signed ? 'Connected and signed in.' : 'Connected. Now sign in with your e-mail.'); UI.openWorkspace(); } catch (e) { sbMsg(e.message); } });
    $('#wsSbOff')?.addEventListener('click', async () => { await cloud.signOut(); await cloud.configure(null); UI.openWorkspace(); });
    $('#wsSend')?.addEventListener('click', async () => { try { await cloud.sendCode($('#wsEmail').value.trim()); sbMsg('Code sent. Check your e-mail and type the code.'); } catch (e) { sbMsg(e.message); } });
    $('#wsVerify')?.addEventListener('click', async () => { try { await cloud.verifyCode($('#wsEmail').value.trim(), $('#wsCode').value); UI.openWorkspace(); toast('Signed in to the shared workspace.'); } catch (e) { sbMsg(e.message); } });
    if (focus) { const el = $(focus === 'inventory' ? '#wsInv' : '#wsTeamSec'); el?.scrollIntoView({ block: 'center' }); }
  };

  UI.renderTeam = async () => {
    const box = $('#wsTeamBody'); if (!box) return;
    const cloud = W.cloud;
    if (W.mode() === 'cloud') {
      if (!cloud.team) { box.innerHTML = `<p>You are not in a team yet. Ask an admin to invite your e-mail, or start one:</p><div class="btns"><input id="wsNewTeam" type="text" placeholder="Team name, e.g. Gurugram DDMA"><button class="btn" id="wsMkTeam" type="button">Create team</button></div>`; $('#wsMkTeam').addEventListener('click', async () => { try { await cloud.createTeam($('#wsNewTeam').value.trim() || 'My team'); UI.openWorkspace(); } catch (e) { toast(esc(e.message), { err: true }); } }); return; }
      try {
        const mem = await cloud.listMembers();
        box.innerHTML = `<table class="t"><thead><tr><th>Person</th><th>Role</th><th></th></tr></thead><tbody>${mem.map((x) => `<tr><td>${esc(x.name || x.email)}<br><span class="muted">${esc(x.email)}${x.user_id ? '' : ' · invited'}</span></td><td>${W.can('team') ? `<select data-role="${esc(x.email)}">${Object.keys(W.ROLES).map((r) => `<option ${x.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>` : esc(x.role)}</td><td>${W.can('team') && x.email !== W.me().email ? `<button class="linkbtn danger" data-rm="${esc(x.email)}" type="button">remove</button>` : ''}</td></tr>`).join('')}</tbody></table>
          ${W.can('team') ? `<div class="grid2"><label class="field">Invite by e-mail<input id="wsInvEmail" type="email"></label><label class="field">Role<select id="wsInvRole">${Object.keys(W.ROLES).map((r) => `<option>${r}</option>`).join('')}</select></label></div><div class="btns"><button class="btn" id="wsInvite" type="button">Invite</button></div><p class="muted">They sign in with that e-mail and join automatically.</p>` : ''}`;
        box.querySelectorAll('[data-role]').forEach((s) => s.addEventListener('change', async () => { try { await cloud.setRole(s.dataset.role, s.value); toast('Role updated.'); } catch (e) { toast(esc(e.message), { err: true }); } }));
        box.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', async () => { try { await cloud.removeMember(b.dataset.rm); UI.renderTeam(); } catch (e) { toast(esc(e.message), { err: true }); } }));
        $('#wsInvite')?.addEventListener('click', async () => { try { await cloud.invite($('#wsInvEmail').value, $('#wsInvRole').value); UI.renderTeam(); } catch (e) { toast(esc(e.message), { err: true }); } });
      } catch (e) { box.textContent = e.message; }
      return;
    }
    const team = W.team();
    box.innerHTML = `<p class="muted" style="margin-top:0">A contact list for this browser (who is involved and in what role). Sharing plans across computers needs the shared back end, or a plan file.</p>
      <table class="t"><tbody>${team.map((x, k) => `<tr><td>${esc(x.name)}<br><span class="muted">${esc(x.email)}</span></td><td>${esc(W.ROLES[x.role]?.label || x.role)}</td><td>${W.can('team') ? `<button class="linkbtn danger" data-tdel="${k}" type="button">remove</button>` : ''}</td></tr>`).join('') || '<tr><td class="muted">Nobody added yet.</td></tr>'}</tbody></table>
      ${W.can('team') ? `<div class="grid2"><label class="field">Name<input id="wtName" type="text"></label><label class="field">E-mail<input id="wtEmail" type="email"></label></div><label class="field">Role<select id="wtRole">${Object.entries(W.ROLES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select></label><div class="btns"><button class="btn" id="wtAdd" type="button">Add person</button></div>` : '<p class="muted">Only an admin can edit the team.</p>'}`;
    $('#wtAdd')?.addEventListener('click', () => { try { W.setTeam([...team, { name: $('#wtName').value.trim(), email: $('#wtEmail').value.trim(), role: $('#wtRole').value }]); UI.renderTeam(); } catch (e) { toast(esc(e.message), { err: true }); } });
    box.querySelectorAll('[data-tdel]').forEach((b) => b.addEventListener('click', () => { W.setTeam(team.filter((_, k) => k !== +b.dataset.tdel)); UI.renderTeam(); }));
  };

  AA.wsui = UI;
})(window);

</script>
<script>/* js/ui/field-ui.js */
/* Plan view: field reports from field teams (field.html) — list, map markers, apply to the plan.
   Skill: skills/field-app/SKILL.md */
(function (root) {
  const AA = root.AA, FR = AA.field, ENG = AA.engine, W = AA.workspace;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const $ = (s) => document.querySelector(s);
  const UI = {};
  const toast = (m, o) => AA.app && AA.app.toast(m, o);
  const ago = (iso) => { const h = (Date.now() - Date.parse(iso)) / 36e5; return h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} d ago`; };

  /** Reports known for this plan: pasted codes + shared back end. Kept on the plan state while it is open. */
  const store = (st) => (st.field = st.field || { reports: [], applied: new Set(), lastFetch: null, err: '' });
  /** A report counts as applied when the plan's event list holds an event with its id (so saved plans remember). */
  const appliedIds = (st) => { const s = store(st).applied; (st.events || []).forEach((e) => e.p?.fieldId && s.add(e.p.fieldId)); return s; };
  UI.add = (st, reports) => {
    const f = store(st), known = new Set(f.reports.map((r) => r.id));
    const fresh = reports.filter((r) => !known.has(r.id));
    f.reports = [...fresh, ...f.reports].sort((a, b) => Date.parse(b.at) - Date.parse(a.at)).slice(0, 500);
    return fresh.length;
  };
  UI.reports = (st) => FR.inPlanArea(store(st).reports, st);

  UI.linkFor = (st) => {
    const base = location.href.replace(/[^/]*$/, '');
    const c = st.sit.focus || st.sit;
    return `${base}field.html?plan=${encodeURIComponent(st.savedName || st.sit.name || 'Plan')}&lat=${c.lat.toFixed(4)}&lon=${c.lon.toFixed(4)}`;
  };

  UI.planSection = (st) => {
    const list = UI.reports(st), applied = appliedIds(st), f = store(st);
    const fresh = list.filter((r) => !applied.has(r.id));
    const canEdit = W.can('edit');
    const row = (r) => {
      const m = FR.match(r, st.zones), dmg = FR.damageLabel(r.damage);
      const needs = r.needs.map((k) => FR.NEEDS.find(([x]) => x === k)?.[1]).filter(Boolean).join(', ');
      return `<li class="frow${applied.has(r.id) ? ' done' : ''}">${r.photoUrl ? `<a href="${esc(r.photoUrl)}" target="_blank" rel="noopener"><img class="fthumb" src="${esc(r.photoUrl)}" alt="Field photo"></a>` : '<span class="fthumb none" aria-hidden="true">◎</span>'}
        <span><b class="dmg d${Math.round(r.damage * 4)}">${esc(dmg)}</b> · ${esc(FR.ROAD[r.road])}${r.people.trapped ? ` · <b>${r.people.trapped} trapped</b>` : ''}${needs ? `<br>Needs: ${esc(needs)}` : ''}
        <br><span class="muted">${ago(r.at)} · ${esc(r.by || 'unnamed')}${r.trained ? ' (trained)' : ''} · ${m ? (m.outside ? `${Math.round(m.distKm)} km from the nearest area` : `${esc(m.zone.id)} ${esc(m.zone.name)}`) : 'no area'}${r.note ? ` · “${esc(r.note.slice(0, 120))}”` : ''}</span></span>
        <span class="fact">${applied.has(r.id) ? '<span class="prov">applied</span>' : canEdit ? `<button class="btn" type="button" data-fapply="${esc(r.id)}">Apply</button>` : ''}<button class="linkbtn" type="button" data-fgo="${esc(r.id)}">map</button></span></li>`;
    };
    return `<div class="sec" id="fieldSec"><h3>Field reports <a href="guide.html#field-app" target="_blank" rel="noopener">?</a></h3>
      <p class="small" style="margin:0 0 6px">${list.length ? `<b>${list.length}</b> report${list.length === 1 ? '' : 's'} in this area${fresh.length ? ` · <b>${fresh.length} not applied yet</b>` : ' · all applied'}` : 'No field reports for this area yet.'}${FR.cloudAvailable() ? ` · shared workspace${f.lastFetch ? `, checked ${ago(f.lastFetch)}` : ''}` : ''}${f.err ? ` · <span class="warn">${esc(f.err)}</span>` : ''}</p>
      ${list.length ? `<ul class="flist">${list.slice(0, 12).map(row).join('')}</ul>` : ''}
      <div class="btns">${canEdit && fresh.length ? '<button class="btn primary" id="fApplyAll" type="button">Apply all new reports</button>' : ''}${FR.cloudAvailable() ? '<button class="btn" id="fRefresh" type="button">Check for new reports</button>' : ''}<button class="btn" id="fLink" type="button">Copy field-app link</button></div>
      <details class="card small"><summary><b>Paste report codes</b> (from WhatsApp or SMS)</summary><textarea id="fPaste" rows="3" placeholder="Paste the whole message; every AA1… code in it is read"></textarea><div class="btns"><button class="btn" id="fAdd" type="button">Add reports</button></div></details>
      <details class="card small"><summary><b>Import from KoboToolbox or ODK</b></summary><p style="margin:4px 0">Teams already on KoboToolbox can use the AidAtlas form (<a href="examples/aidatlas-field-xlsform.xlsx" download>XLSForm</a>). Export the data as CSV with XML values and headers, then open it here.</p><label class="field">CSV file<input id="fKobo" type="file" accept=".csv,text/csv"></label></details>
      <p class="small muted" style="margin:0">Applying a report updates its area's severity by Bayesian update (trained assessor σ ${FR.SD.trained}, others σ ${FR.SD.crowd}) and closes the road at its location when the team marked it blocked. Each change is written to the decision log.</p></div>`;
  };

  const applyOne = async (st, r) => {
    const { events, match } = FR.toEvents(r, st);
    if (!events.length) { toast(`This report is ${match ? `${Math.round(match.distKm)} km from the nearest area` : 'outside the plan'}; nothing to apply.`, { err: true }); store(st).applied.add(r.id); return false; }
    for (const e of events) await ENG.event(e.type, e.p, { note: `Field report by ${r.by || 'field team'}${r.note ? `: ${r.note.slice(0, 80)}` : ''}` });
    store(st).applied.add(r.id);
    return true;
  };
  UI.apply = async (st, ids) => {
    const list = UI.reports(st).filter((r) => ids.includes(r.id)).sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
    let n = 0;
    for (const r of list) { if (ENG.state !== st) return; if (await applyOne(st, r)) n++; }
    if (n) toast(`${n} field report${n === 1 ? '' : 's'} applied to the plan.`);
    AA.app.rerender(); UI.draw(st);
  };

  UI.bind = (st) => {
    const sec = $('#fieldSec'); if (!sec) return;
    sec.querySelectorAll('[data-fapply]').forEach((b) => b.addEventListener('click', () => UI.apply(st, [b.dataset.fapply])));
    sec.querySelectorAll('[data-fgo]').forEach((b) => b.addEventListener('click', () => { const r = store(st).reports.find((x) => x.id === b.dataset.fgo); if (r) AA.map.map().setView([r.lat, r.lon], Math.max(AA.map.map().getZoom(), 13)); }));
    $('#fApplyAll')?.addEventListener('click', () => { const a = appliedIds(st); UI.apply(st, UI.reports(st).filter((r) => !a.has(r.id)).map((r) => r.id)); });
    $('#fRefresh')?.addEventListener('click', () => UI.fetch(st, true));
    $('#fLink')?.addEventListener('click', async () => { const l = UI.linkFor(st); try { await navigator.clipboard.writeText(l); toast('Field-app link copied. Send it to your field teams.'); } catch (e) { toast(`Field-app link: ${esc(l)}`, { sticky: true }); } });
    $('#fKobo')?.addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const { reports, errors } = AA.exports.importKobo(await file.text());
      const n = UI.add(st, reports);
      toast(reports.length ? `${n} new report${n === 1 ? '' : 's'} imported from ${esc(file.name)}${errors.length ? ` (${errors.length} row${errors.length === 1 ? '' : 's'} skipped: ${esc(errors[0])})` : ''}.` : `No usable rows: ${esc(errors[0] || 'check that the export uses XML values')}`, { err: !reports.length });
      AA.app.rerender(); UI.draw(st);
    });
    $('#fAdd')?.addEventListener('click', () => {
      const { reports, errors } = FR.decodeAll($('#fPaste').value);
      const n = UI.add(st, reports);
      const out = reports.length - FR.inPlanArea(reports, st).length;
      toast(reports.length ? `${n} new report${n === 1 ? '' : 's'} added${out ? ` (${out} outside this plan's area)` : ''}.${errors.length ? ' ' + esc(errors[0]) : ''}` : esc(errors[0] || 'No report code (AA1…) found in the text.'), { err: !reports.length });
      AA.app.rerender(); UI.draw(st);
    });
  };

  /** Pull new reports from the shared back end (every minute while a plan is open). */
  UI.fetch = async (st, loud = false) => {
    if (!FR.cloudAvailable()) return;
    const f = store(st);
    try {
      const since = new Date(Date.now() - 14 * 864e5).toISOString();
      const n = UI.add(st, await FR.cloudList(since));
      f.lastFetch = new Date().toISOString(); f.err = '';
      if (n || loud) { if (n) toast(`${n} new field report${n === 1 ? '' : 's'} from the shared workspace.`); if (ENG.state === st) { AA.app.rerender(); UI.draw(st); } }
    } catch (e) { f.err = e.message; if (loud) toast(`Field reports: ${esc(e.message)}`, { err: true }); }
  };
  let timer = null;
  UI.start = (st) => { clearInterval(timer); UI.fetch(st); timer = setInterval(() => { if (ENG.state === st) UI.fetch(st); else clearInterval(timer); }, 60e3); };
  UI.stop = () => clearInterval(timer);

  UI.draw = (st) => { if (AA.map.drawField) AA.map.drawField(UI.reports(st), appliedIds(st)); };

  AA.fieldui = UI;
})(window);

</script>
<script>/* js/ui/collab-ui.js */
/* Plan view: tasks and comments (shared live plan). Skill: skills/collab/SKILL.md */
(function (root) {
  const AA = root.AA, COL = AA.collab, W = AA.workspace;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const $ = (s) => document.querySelector(s);
  const toast = (m, o) => AA.app && AA.app.toast(m, o);
  const UI = {};
  const ago = (iso) => { const h = (Date.now() - Date.parse(iso)) / 36e5; return h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} d ago`; };
  const zname = (st, id) => { const z = st.zones.find((x) => x.id === id); return z ? `${z.id} ${z.name}` : ''; };

  UI.planSection = (st) => {
    const tasks = COL.tasks(st), comments = COL.comments(st), mode = COL.mode(st);
    const open = tasks.filter((t) => t.status !== 'done').length, late = tasks.filter((t) => COL.isOverdue(t)).length;
    const zoneOpts = `<option value="">Whole plan</option>${st.zones.map((z) => `<option value="${esc(z.id)}">${esc(z.id)} ${esc(z.name)}</option>`).join('')}`;
    const row = (t) => `<li class="trow ${t.status}${COL.isOverdue(t) ? ' late' : ''}"><span>${COL.canUpdate(t) ? `<select data-tstat="${esc(t.id)}" aria-label="Status of ${esc(t.title)}">${Object.entries(COL.STATUS).map(([k, v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>` : `<span class="prov">${esc(COL.STATUS[t.status])}</span>`}</span>
      <span><b>${esc(t.title)}</b>${t.zoneId ? ` · <a href="#" data-tz="${esc(t.zoneId)}">${esc(zname(st, t.zoneId) || t.zoneId)}</a>` : ''}<br><span class="small muted">${t.assignee ? `→ ${esc(t.assignee)}` : 'unassigned'}${t.due ? ` · due ${esc(t.due)}${COL.isOverdue(t) ? ' <b class="warn">overdue</b>' : ''}` : ''} · added by ${esc(t.by)}</span></span>
      ${W.can('edit') ? `<button class="linkbtn danger" type="button" data-tdel="${esc(t.id)}" aria-label="Delete task">✕</button>` : '<span></span>'}</li>`;
    return `<div class="sec" id="collabSec"><h3>Tasks and comments <a href="guide.html#tasks" target="_blank" rel="noopener">?</a></h3>
      <p class="small" style="margin:0 0 6px">${mode === 'cloud' ? '<span class="live-dot" aria-hidden="true"></span><b>Live</b>: shared with your team; changes appear for everyone within seconds.' : W.mode() === 'cloud' ? 'Save the plan to share its tasks and comments live with your team.' : 'Kept inside this plan: saved plans and plan files carry them. Connect the shared back end to work on one plan together, live.'}${tasks.length ? ` · ${open} open${late ? `, <b class="warn">${late} overdue</b>` : ''}` : ''}</p>
      ${tasks.length ? `<ul class="tlist">${tasks.slice(0, 20).map(row).join('')}</ul>` : '<p class="small muted" style="margin:0 0 6px">No tasks yet.</p>'}
      ${COL.canCreate() ? `<details class="card small"><summary><b>Add a task</b></summary>
        <label class="field">What needs doing<input id="tTitle" type="text" maxlength="200" placeholder="e.g. Open the school in Sector 29 as a shelter"></label>
        <div class="grid2"><label class="field">Who<input id="tWho" type="text" maxlength="120" list="tPeople" placeholder="name or e-mail"><datalist id="tPeople">${W.team().map((p) => `<option value="${esc(p.email || p.name)}">${esc(p.name)}</option>`).join('')}</datalist></label>
        <label class="field">Due<input id="tDue" type="date"></label></div>
        <label class="field">Where<select id="tZone">${zoneOpts}</select></label>
        <div class="btns"><button class="btn primary" id="tAdd" type="button">Add task</button></div></details>` : ''}
      <div class="comments"><div class="eyebrow" style="margin-top:8px">Comments</div>
        <div class="grid2" style="align-items:end"><label class="field">Comment<input id="cText" type="text" maxlength="1000" placeholder="e.g. Bridge at Km 12 reopened at 14:00"></label><label class="field">About<select id="cZone">${zoneOpts}</select></label></div>
        <div class="btns"><button class="btn" id="cAdd" type="button">Post</button></div>
        <ul class="clist">${comments.slice(0, 15).map((c) => `<li><b>${esc(c.by)}</b>${c.role ? ` <span class="muted">(${esc(c.role)})</span>` : ''} · <span class="muted">${ago(c.at)}${c.zoneId ? ` · ${esc(zname(st, c.zoneId) || c.zoneId)}` : ''}</span><br>${esc(c.text)}</li>`).join('') || '<li class="muted">No comments yet.</li>'}</ul></div></div>`;
  };

  UI.bind = (st) => {
    const sec = $('#collabSec'); if (!sec) return;
    const run = async (fn, ok) => { try { await fn(); if (ok) toast(ok); AA.app.rerender(); } catch (e) { toast(esc(e.message), { err: true }); } };
    $('#tAdd')?.addEventListener('click', () => run(() => COL.addTask(st, { title: $('#tTitle').value, assignee: $('#tWho').value, due: $('#tDue').value, zoneId: $('#tZone').value }), 'Task added.'));
    sec.querySelectorAll('[data-tstat]').forEach((s) => s.addEventListener('change', () => run(() => COL.updateTask(st, s.dataset.tstat, { status: s.value }))));
    sec.querySelectorAll('[data-tdel]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.armed) run(() => COL.removeTask(st, b.dataset.tdel)); else { b.dataset.armed = '1'; b.textContent = 'delete?'; } }));
    sec.querySelectorAll('[data-tz]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const z = st.zones.find((x) => x.id === a.dataset.tz); if (z) AA.map.map().setView([z.lat, z.lon], Math.max(AA.map.map().getZoom(), 12)); }));
    $('#cAdd')?.addEventListener('click', () => run(() => COL.addComment(st, $('#cText').value, $('#cZone').value)));
    $('#cText')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#cAdd').click(); });
    if (W.mode() === 'cloud' && W.cloud?.team) W.cloud.listMembers().then((m) => { const dl = $('#tPeople'); if (dl) dl.innerHTML = m.map((p) => `<option value="${esc(p.email)}">${esc(p.name || p.email)} · ${esc(p.role)}</option>`).join(''); }).catch(() => {});
  };

  COL.on((type, data) => {
    if (type === 'remote' && AA.engine.state === data) { const a = document.activeElement; if (a && a.closest && a.closest('#panel') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; AA.app.rerender(); }
    if (type === 'newer') toast(`${esc(data.by || 'Someone')} saved a newer version of this plan. Reopen it from Saved plans to see their changes.`, { sticky: true });
  });

  AA.collabui = UI;
})(window);

</script>
<script>/* js/ui/app.js */
/* App shell: modes, panel, search, events, settings. Skill: modes */
(function (root) {
  const AA = root.AA, M = AA.math, f = AA.fmt, MAP = AA.map, ENG = AA.engine, D = AA.data;
  const esc = MAP.esc;
  const $ = (s) => document.querySelector(s);
  const app = (AA.app = { mode: 'live', view: 'list' });
  const panel = () => $('#panelInner');
  const hz = (h) => `<span class="chip ${h}">${AA.HAZARDS[h]?.label || h}</span>`;
  const alertDot = (lvl) => `<span class="alert ${lvl || 'na'}" title="${lvl ? lvl + ' alert' : 'no agency alert'}"></span>`;
  const ago = (iso) => { if (!iso) return ''; const t = new Date(/Z$|[+-]\d\d:?\d\d$/.test(iso) || iso.length < 12 ? iso : iso + 'Z').getTime(); const h = (Date.now() - t) / 36e5; return h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} d ago`; };
  const dateStr = (iso) => { if (!iso) return ''; const d = new Date(/Z$/.test(iso) || iso.length < 12 ? iso : iso + 'Z'); return d.toISOString().slice(0, 10); };
  const magText = (e) => e.hazard === 'EQ' ? `M ${(+(e.magnitude ?? e.severity)).toFixed(1)}` : e.hazard === 'TC' ? `${Math.round(e.severity || 0)} km/h` : e.severity ? `${f.n(e.severity)} ${esc(e.severityUnit || '')}` : (e.alertlevel || '');

  // ---------------- toast / hint ----------------
  let toastTimer;
  app.toast = (msg, { err = false, sticky = false } = {}) => {
    const t = $('#toast'); t.hidden = !msg; t.className = 'toast' + (err ? ' err' : ''); t.innerHTML = msg || '';
    clearTimeout(toastTimer); if (msg && !sticky) toastTimer = setTimeout(() => (t.hidden = true), err ? 7000 : 3500);
  };
  let pick = null;
  app.pickPoint = (text, cb) => {
    pick = cb; $('#hintText').textContent = text; $('#hint').hidden = false; MAP.map().getContainer().style.cursor = 'crosshair';
  };
  const endPick = () => { pick = null; $('#hint').hidden = true; MAP.map().getContainer().style.cursor = ''; };

  // ---------------- legend ----------------
  const legend = () => {
    const L = (sw, label, link) => `<li><span class="sw">${sw}</span><span>${label}${link ? ` · <a href="#${link[0]}" data-x="${link[0]}">${link[1]}</a>` : ''}</span></li>`;
    const dot = (c) => `<span class="dot" style="background:${c}"></span>`;
    const ln = (c, dash) => `<span class="ln${dash ? ' dash' : ''}" style="border-color:${c}"></span>`;
    $('#legend').innerHTML = `<h4>Legend <button type="button" id="legendToggle">hide</button></h4><ul>
      ${L(dot('#16a34a'), 'Affected area / demand zone', ['m-pred', 'Monte-Carlo forecast'])}
      ${L(dot('#16a34a'), 'Zone size = need', ['m-need', 'Need score'])}
      ${L(dot('#dc2626'), 'Supply store (H = hospital)', ['m-milp', 'Allocation MILP'])}
      ${L('<span class="site-diamond" style="width:11px;height:11px"></span>', 'Recommended storage', ['m-mclp', 'MCLP'])}
      ${L(ln('#f59e0b'), 'Truck route', ['m-route', 'OSRM + damage'])}
      ${L(ln('#f59e0b', 1), 'Milk run (multi-stop)', ['m-vrp', 'Clarke–Wright'])}
      ${L(ln('#0ea5e9'), 'Responder bus', ['m-bpr', 'BPR congestion'])}
      ${L(ln('#db2777', 1), 'Ambulance flow', ['m-cas', 'Survival LP'])}
      ${L(ln('#dc2626', 1), 'No road: air drop', ['m-route', 'closure rule'])}
      ${L('<span class="closure-x" style="font-size:14px">✕</span>', 'Road closure')}
      ${L(dot('#fdba74'), 'Risk cell', ['m-risk', 'INFORM risk'])}
      ${L(dot('#16a34a'), 'Live ranking', ['m-usi', 'Unified Severity Index'])}
    </ul><p class="small muted" style="margin:0 0 6px"><b>3D map:</b> drag to move, right-drag or Ctrl+drag to tilt and rotate (two fingers on phones). Green column height = people affected; purple columns = storage sites; risk squares rise with risk.</p><label class="small fleet-tog"><input type="checkbox" id="fleetTog" ${AA.config.showFleet ? 'checked' : ''}> Show vehicles in transit</label>
    <p class="small muted" style="margin:0">When on, each moving dot is one dispatched vehicle (orange = truck, blue = responder bus) shown along its planned route. Positions are simulated, not GPS. Hover a dot for its cargo. ${AA.config.tomtomKey ? 'Live traffic: TomTom.' : 'Add a free TomTom key in Settings to see real traffic.'} <a href="guide.html#map-symbols" target="_blank" rel="noopener">All symbols explained</a></p>`;
    $('#fleetTog').addEventListener('change', (e) => { AA.config.showFleet = e.target.checked; MAP.animate(); });
