    (run?.casualty?.flows || []).forEach((fl) => { const z = st.zones[fl.i], h = st.hospitals[fl.h]; if (z && h) F.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[r(z.lon, 6), r(z.lat, 6)], [r(h.lon, 6), r(h.lat, 6)]] }, properties: { layer: 'ambulance_flow', from: z.id, to: h.id, patients: r(fl.n, 1) } }); });
    (st.closures || []).forEach((cl) => F.push(pt(cl, { layer: 'road_closure' })));
    (st.field?.reports || []).forEach((fr) => F.push(pt(fr, { layer: 'field_report', id: fr.id, at: fr.at, damage: fr.damage, road: fr.road, needs: fr.needs.join(' '), trapped: fr.people.trapped, by: fr.by, note: fr.note })));
    (st.collab?.tasks || []).forEach((t) => { const z = st.zones.find((x) => x.id === t.zoneId) || c; F.push(pt(z, { layer: 'task', id: t.id, title: t.title, assignee: t.assignee, due: t.due, status: t.status, area: t.zoneId || '' })); });
    return { type: 'FeatureCollection', name: st.savedName || st.sit.name, generator: `AidAtlas ${AA.MODEL_VERSION}`, generated: new Date().toISOString(), features: F };
  };

  // ---------------- CSV ----------------
  const cell = (v) => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = (head, rows, tags) => [head.map(cell).join(','), ...(tags ? [tags.map(cell).join(',')] : []), ...rows.map((row) => row.map(cell).join(','))].join('\r\n');

  /** Areas with HXL hashtags (second row). Only tags from the HXL core dictionary are used; other columns are untagged. */
  X.hxl = (st) => {
    const date = new Date().toISOString().slice(0, 10);
    const head = ['Date', 'Country', 'Area', 'Latitude', 'Longitude', 'People affected (P50)', 'Displaced (P50)', 'Injured (P50)', 'Deaths (P50)', 'Deaths (P90)', 'Need score', 'Population', 'Source'];
    const tags = ['#date', '#country', '#loc +name', '#geo +lat', '#geo +lon', '#affected', '#affected +displaced', '#affected +injured', '#affected +killed', '', '', '', ''];
    const rows = st.zones.map((z) => [date, st.sit.country || '', z.name, r(z.lat, 5), r(z.lon, 5), r(z.fc.aff.p50), r(z.fc.dis.p50), r(z.fc.inj.p50), r(z.fc.fat.p50), r(z.fc.fat.p90), r(z.need, 3), r(z.pop), `AidAtlas ${AA.MODEL_VERSION} forecast (modelled)`]);
    return csv(head, rows, tags);
  };
  /** Needs per area per item (this 6-hour period and 72-hour P90). */
  X.needsCSV = (st) => {
    const K = AA.config.commodities, F = AA.fairness;
    const rows = [];
    st.zones.forEach((z, i) => K.forEach((k) => rows.push([z.id, z.name, r(z.lat, 5), r(z.lon, 5), k.label, k.unit, r(z.d?.[k.key] || 0, 2), r(st.lastRun?.alloc.unmet[i]?.[k.key] || 0, 2), r(z.D90?.[k.key] || 0, 2)])));
    return csv(['area_id', 'area', 'lat', 'lon', 'item', 'unit', 'needed_this_period', 'not_covered_this_period', 'needed_p90_cumulative'], rows);
  };
  /** Dispatch list: store → area, vehicles and cargo. */
  X.dispatchCSV = (st) => {
    const rows = (AA.report?.dispatches?.(st) || []).map((d) => [d.depot.id, d.depot.name, d.depot.address || '', d.zone.id, d.zone.name, d.trucks, d.buses, d.milk ? 'yes' : 'no', d.air ? 'yes' : 'no', r(d.hours, 2), ...AA.config.commodities.map((k) => r(d.cargo[k.key] || 0, 2))]);
    return csv(['from_id', 'from', 'from_address', 'to_id', 'to', 'trucks', 'buses', 'multi_stop', 'air_drop', 'drive_hours', ...AA.config.commodities.map((k) => `${k.key}_${k.unit.replace(/\W+/g, '')}`)], rows);
  };
  X.tasksCSV = (st) => csv(['id', 'title', 'area_id', 'assignee', 'due', 'status', 'added_by', 'added_at'], (st.collab?.tasks || []).map((t) => [t.id, t.title, t.zoneId, t.assignee, t.due, t.status, t.by, t.at]));

  // ---------------- KoboToolbox / ODK import ----------------
  /** CSV with comma or semicolon (Kobo's default) delimiters and quoted fields. */
  X.parseDelimited = (text) => {
    const first = String(text).split(/\r?\n/)[0] || '';
    const d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], c = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"' && text[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
      else if (ch === '"') q = true; else if (ch === d) { row.push(c); c = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(c); rows.push(row); row = []; c = ''; }
      else c += ch;
    }
    if (c.length || row.length) { row.push(c); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim());
    return rows.filter((x) => x.some((v) => v.trim())).map((x) => Object.fromEntries(head.map((h, k) => [h, (x[k] ?? '').trim()])));
  };
  const DMG = { none: 0, minor: 0.25, moderate: 0.5, severe: 0.75, destroyed: 1 };
  /** Kobo / ODK export (XML values, from examples/aidatlas-field-xlsform.xlsx) → field reports. Group prefixes ("group/name") are ignored. */
  X.importKobo = (text) => {
    const rows = X.parseDelimited(text), out = [], errors = [];
    rows.forEach((raw, k) => {
      const o = {}; Object.entries(raw).forEach(([key, v]) => (o[key.split('/').pop().replace(/^_/, '')] = v));
      let lat = +o.location_latitude, lon = +o.location_longitude;
      if (!isFinite(lat) || !o.location_latitude) { const p = String(o.location || '').trim().split(/\s+/).map(Number); lat = p[0]; lon = p[1]; }
      const needs = String(o.needs || '').split(/\s+/).filter(Boolean);
      try {
        out.push(AA.field.normalise({ id: o.uuid ? `k${o.uuid.replace(/[^a-z0-9]/gi, '').slice(0, 30)}` : undefined, at: o.end || o.submission_time || o.start, lat, lon, acc: +o.location_precision || null,
          damage: DMG[String(o.damage || '').toLowerCase()] ?? +o.damage, needs, people: { affected: o.affected, injured: o.injured, trapped: o.trapped }, road: o.road, note: o.note, by: o.reporter, team: o.team, trained: /^(yes|true|1)$/i.test(o.trained || ''), place: o.place }));
      } catch (e) { errors.push(`Row ${k + 2}: ${e.message}`); }
    });
    return { reports: out, errors };
  };

  /** XLSForm definition (also written to examples/aidatlas-field-xlsform.xlsx by tools/make-xlsform.py). */
  X.XLSFORM = {
    survey: [['type', 'name', 'label', 'required', 'hint', 'parameters'],
      ['start', 'start', '', '', '', ''], ['end', 'end', '', '', '', ''],
      ['geopoint', 'location', 'Where are you?', 'yes', 'Wait for an accuracy under 30 m', ''],
      ['text', 'place', 'Place name (village, ward, landmark)', '', '', ''],
      ['image', 'photo', 'Photo', '', 'Optional', 'max-pixels=1280'],
      ['select_one damage', 'damage', 'How bad is the damage here?', 'yes', '', ''],
      ['select_multiple needs', 'needs', 'What do people need most?', '', '', ''],
      ['integer', 'affected', 'People affected (about)', '', '', ''], ['integer', 'injured', 'Injured', '', '', ''], ['integer', 'trapped', 'Trapped or missing', '', '', ''],
      ['select_one road', 'road', 'Can trucks reach this place?', 'yes', '', ''],
      ['text', 'note', 'Anything else', '', '', ''], ['text', 'reporter', 'Your name', '', '', ''], ['text', 'team', 'Team', '', '', ''],
      ['select_one yesno', 'trained', 'Are you a trained damage assessor?', '', '', '']],
    choices: [['list_name', 'name', 'label'],
      ['damage', 'none', 'No damage'], ['damage', 'minor', 'Minor'], ['damage', 'moderate', 'Moderate'], ['damage', 'severe', 'Severe'], ['damage', 'destroyed', 'Destroyed'],
      ['needs', 'water', 'Water'], ['needs', 'food', 'Food'], ['needs', 'shelter', 'Shelter'], ['needs', 'medical', 'Medical'], ['needs', 'rescue', 'Search & rescue'],
      ['road', 'open', 'Open'], ['road', 'partly', 'Partly blocked'], ['road', 'blocked', 'Blocked'], ['yesno', 'yes', 'Yes'], ['yesno', 'no', 'No']],
    settings: [['form_title', 'form_id', 'version'], ['AidAtlas field report', 'aidatlas_field_report', '3']],
  };

  AA.exports = X;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/map.js */
/* Map layer management (Leaflet). Skill: ui-sketch, routing */
(function (root) {
  const AA = root.AA, M = AA.math;
  const MAP = {};
  let map, layers = {}, anim = null, trafficLayer = null;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  MAP.esc = esc;
  const reduceMotion = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;

  MAP.init = (el) => {
    map = L.map(el, { zoomControl: true, worldCopyJump: true, preferCanvas: false }).setView([20, 10], 2);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, crossOrigin: true, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' });
    const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, crossOrigin: true, attribution: '© OpenStreetMap contributors' });
    const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, crossOrigin: true, pane: 'overlayPane', opacity: 0.9 });
    const roads = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, crossOrigin: true, opacity: 0.75 });
    MAP.base = { sat, streets };
    (AA.config.lowBandwidth ? streets : sat).addTo(map); labels.addTo(map); if (!AA.config.lowBandwidth) roads.addTo(map);
    MAP.overlays = { 'Place labels': labels, 'Road network': roads };
    MAP.control = L.control.layers({ Satellite: sat, Streets: streets }, MAP.overlays, { position: 'topright', collapsed: true }).addTo(map);
    L.control.scale({ imperial: false }).addTo(map);
    ['base', 'impact', 'zones', 'depots', 'hosp', 'legs', 'cas', 'fleet', 'sites', 'closures', 'risk', 'events', 'field'].forEach((k) => (layers[k] = L.layerGroup().addTo(map)));
    // name labels for areas, stores and storage sites: shown when zoomed in far enough to read them
    layers.labels = L.layerGroup();
    const toggleLabels = () => { if (map.getZoom() >= 12) layers.labels.addTo(map); else map.removeLayer(layers.labels); };
    map.on('zoomend', toggleLabels); toggleLabels();
    MAP.setTraffic(AA.config.tomtomKey);
    return map;
  };
  MAP.map = () => map;
  /** Field reports: a square marker coloured by damage (grey when already applied to the plan). */
  MAP.FIELD_COLORS = ['#16a34a', '#84cc16', '#f59e0b', '#ea580c', '#b91c1c'];
  MAP.drawField = (reports, applied = new Set()) => {
    const FR = AA.field; layers.field.clearLayers();
    (reports || []).forEach((r) => {
      const col = applied.has(r.id) ? '#6b7280' : MAP.FIELD_COLORS[Math.round(r.damage * 4)];
      const icon = L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: `<div class="field-pin" style="background:${col}">${r.photoUrl ? '▣' : '◎'}</div>` });
      const needs = r.needs.map((k) => FR.NEEDS.find(([x]) => x === k)?.[1]).filter(Boolean).join(', ');
      L.marker([r.lat, r.lon], { icon, zIndexOffset: 700 })
        .bindTooltip(`<b>Field report · ${esc(FR.damageLabel(r.damage))} damage</b><br>${esc(FR.ROAD[r.road])}${r.people.trapped ? ` · ${r.people.trapped} trapped` : ''}${needs ? `<br>Needs: ${esc(needs)}` : ''}<br>${esc(r.by || 'field team')} · ${esc(new Date(r.at).toLocaleString())}${r.note ? `<br>“${esc(r.note.slice(0, 140))}”` : ''}${r.photoUrl ? `<br><img src="${esc(r.photoUrl)}" alt="" style="max-width:180px;max-height:120px;margin-top:4px;border-radius:4px">` : ''}${applied.has(r.id) ? '<br><i>Applied to the plan</i>' : ''}<span class="m">Field app · ${r.trained ? 'trained assessor' : 'crowd report'}</span>`, { className: 'aa-tip' })
        .addTo(layers.field);
    });
  };
  MAP.clear = (...keys) => (keys.length ? keys : Object.keys(layers)).forEach((k) => layers[k] && layers[k].clearLayers());
  MAP.layer = (k) => layers[k];

  MAP.setTraffic = (key) => {
    if (trafficLayer) { map.removeLayer(trafficLayer); MAP.control.removeLayer(trafficLayer); trafficLayer = null; }
    if (!key) return;
    trafficLayer = L.tileLayer(`https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${encodeURIComponent(key)}`, { maxZoom: 22, opacity: 0.85, attribution: 'Traffic © TomTom' });
    trafficLayer.addTo(map); MAP.control.addOverlay(trafficLayer, 'Live traffic (TomTom)');
  };

  const dotIcon = (color, size = 12, label = '', ring = '#fff') => L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2], html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid ${ring};box-shadow:0 0 0 1px rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font:700 ${Math.max(8, size * 0.5)}px/1 'IBM Plex Sans',sans-serif">${label}</div>` });
  MAP.dotIcon = dotIcon;

  /** Live / history event markers (green). */
  MAP.drawEvents = (events, onClick, opts = {}) => {
    layers.events.clearLayers();
    events.forEach((e, k) => {
      const top = k < (opts.top ?? 5);
      const m = L.marker([e.lat, e.lon], { icon: dotIcon('#16a34a', top ? 18 : 9, top ? k + 1 : ''), zIndexOffset: top ? 500 : 0, keyboard: top });
      m.bindTooltip(`<b>${esc(e.name)}</b><br>${AA.HAZARDS[e.hazard]?.label || e.hazard} · ${esc(e.country || '')}${e.usi != null ? `<br>USI ${e.usi.toFixed(2)}` : ''}${e.from ? `<br>${new Date(e.from.endsWith('Z') || e.from.length < 12 ? e.from : e.from + 'Z').toUTCString().slice(5, 22)} UTC` : ''}`, { className: 'aa-tip' });
      m.on('click', () => onClick(e));
      m.addTo(layers.events);
    });
    if (events.length && opts.fit !== false) {
      const b = L.latLngBounds(events.slice(0, opts.top ?? 5).map((e) => [e.lat, e.lon]));
      map.fitBounds(b.pad(0.3), { maxZoom: opts.maxZoom || 6 });
    }
  };

  /** Address line for tooltips/popups: street address when known, else coordinates (always shown, so a team can navigate). */
  const addrLine = (p) => `<br><span class="addr">${p.address ? esc(p.address) : `${(+p.lat).toFixed(5)}, ${(+p.lon).toFixed(5)}${p.addressPending === false ? '' : ' · address loading…'}`}</span>`;
  MAP.addrLine = addrLine;
  /** Popup footer: address, coordinates and a Google Maps link for directions. */
  MAP.whereHtml = (p) => `<div class="where small">${p.address ? `<b>Address:</b> ${esc(p.address)}<br>` : ''}<span class="mono">${(+p.lat).toFixed(5)}, ${(+p.lon).toFixed(5)}</span> · <a href="${AA.data.mapsUrl(p)}" target="_blank" rel="noopener">Open in Google Maps</a></div>`;
  const label = (p, text, cls) => L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', html: `<div class="maplabel ${cls || ''}">${esc(text)}</div>`, iconSize: null, iconAnchor: [-12, 8] }), interactive: false, keyboard: false }).addTo(layers.labels);

  /** Draw the whole planning state (everything except routed legs). */
  MAP.drawPlan = (st, handlers) => {
    MAP.clear('impact', 'zones', 'depots', 'hosp', 'legs', 'cas', 'fleet', 'closures', 'labels');
    layers.events.clearLayers();
    const sit = st.sit, focus = sit.focus || sit;
    L.circle([focus.lat, focus.lon], { radius: sit.radiusKm * 1000, color: '#16a34a', weight: 1.5, dashArray: '6 6', fill: true, fillOpacity: 0.06, interactive: false }).addTo(layers.impact);
    const src = L.marker([sit.lat, sit.lon], { icon: L.divIcon({ className: '', html: '<div class="pulse"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 1000 });
    src.bindTooltip(`<b>${esc(sit.name || 'Affected area')}</b><br>${AA.HAZARDS[sit.hazard].label} · impact radius ${Math.round(sit.radiusKm)} km<span class="m">Affected-area centre · prediction model</span>`, { className: 'aa-tip' });
    src.addTo(layers.impact);
    if (sit.focus) L.polyline([[sit.lat, sit.lon], [focus.lat, focus.lon]], { color: '#16a34a', weight: 1, dashArray: '2 6' }).addTo(layers.impact);
    const maxNeed = Math.max(0.01, ...st.zones.map((z) => z.need || 0));
    st.zones.forEach((z, i) => {
      const s = 10 + 14 * ((z.need || 0) / maxNeed);
      const cov = coverage(st, i);
      const m = L.marker([z.lat, z.lon], { icon: dotIcon(z.served ? '#86efac' : '#16a34a', s, z.id.slice(1)), zIndexOffset: 400 });
      m.bindTooltip(`<b>${z.id} · ${esc(z.name)}</b><br>Need ${(z.need || 0).toFixed(2)} · severity ${(z.sevPost ?? z.sevMean).toFixed(2)}<br>Affected ${AA.fmt.k(z.fc.aff.p50)} (P10–P90 ${AA.fmt.k(z.fc.aff.p10)}–${AA.fmt.k(z.fc.aff.p90)})<br>Critical coverage this epoch ${Math.round(cov * 100)} %${z.covers?.length ? `<br>Also covers: ${esc(z.covers.slice(0, 6).join(', '))}${z.covers.length > 6 ? '…' : ''}` : ''}${addrLine(z)}<span class="m">Need score · fairness model</span>`, { className: 'aa-tip' });
      m.bindPopup(() => handlers.zonePopup(z));
      m.addTo(layers.zones);
      label(z, `${z.id} ${z.name}`, 'zone');
    });
    st.depots.forEach((d) => {
      const m = L.marker([d.lat, d.lon], { icon: dotIcon(d.open ? '#dc2626' : '#6b7280', 14, d.type === 'hospital' ? 'H' : ''), zIndexOffset: 300 });
      m.bindTooltip(`<b>${d.id} · ${esc(d.name)}</b><br>${d.typeLabel}${d.open ? '' : ' · <b>offline</b>'}${d.damaged ? ' · inside heavy-damage zone' : ''}${addrLine(d)}<span class="m">Supply store · stock ${d.prov === 'imported inventory' ? 'from your inventory' : d.type === 'staging' ? 'modelled' : 'assumed by type'}</span>`, { className: 'aa-tip' });
      m.bindPopup(() => handlers.depotPopup(d));
      m.addTo(layers.depots);
      label(d, `${d.id} ${d.name}`, 'store');
    });
    st.hospitals.forEach((h) => {
      if (st.depots.some((d) => M.haversine(d, h) < 0.05)) return;
      const m = L.marker([h.lat, h.lon], { icon: dotIcon('#dc2626', 12, 'H'), zIndexOffset: 250 });
      m.bindTooltip(`<b>${h.id} · ${esc(h.name)}</b><br>Receiving hospital · ${h.beds} free beds (${h.bedsProv})${addrLine(h)}<span class="m">Casualty transport LP</span>`, { className: 'aa-tip' });
      m.bindPopup(`<h4>${h.id} · ${esc(h.name)}</h4><div class="small">Receiving hospital · ${h.beds} free beds</div>${MAP.whereHtml(h)}`);
      m.addTo(layers.hosp);
      label(h, `${h.id} ${h.name}`, 'store');
    });
    st.closures.forEach((c) => L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', html: '<div class="closure-x">✕</div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }).bindTooltip('Road closed').addTo(layers.closures));
    // casualty flows
    const run = st.lastRun;
    if (run) run.casualty.flows.forEach((f) => {
      const z = st.zones[f.i], h = st.hospitals[f.h];
      L.polyline([[z.lat, z.lon], [h.lat, h.lon]], { color: '#db2777', weight: 2, dashArray: '4 6', opacity: 0.9 })
        .bindTooltip(`<b>Ambulance flow · ${z.id} → ${h.id}</b><br>${AA.fmt.n(f.n, 0)} patients · ${AA.fmt.min(f.tau)} · survival weight e<sup>−τ/τp</sup> = ${Math.exp(-f.tau).toFixed(2)}<span class="m">Model: casualty transport LP (survival-weighted)</span>`, { className: 'aa-tip', sticky: true })
        .addTo(layers.cas);
    });
    if (st.warehouses) MAP.drawSites(st);
  };

  const coverage = (st, i) => {
    const run = st.lastRun; if (!run) return 0;
    const z = st.zones[i]; let need = 0, got = 0;
    AA.config.commodities.filter((c) => c.critical).forEach((c) => { const d = z.d[c.key] || 0; need += d; got += d - (run.alloc.unmet[i][c.key] || 0); });
    return need > 0 ? got / need : 1;
  };
  MAP.coverage = coverage;

  MAP.fitPlan = (st) => {
    const pts = [...st.zones, ...st.depots, ...st.hospitals, st.sit].map((p) => [p.lat, p.lon]);
    map.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 12 });
  };

  /** One routed leg → polyline with model tooltip. */
  MAP.drawLeg = (st, leg) => {
    const veh = AA.config.vehicles[leg.cls];
    const run = st.lastRun;
    const cargo = {};
    leg.tours.forEach((ti) => { const t = run.cons.tours[ti]; const c = t.cargo.find((x) => x.i === leg.to.idx); if (c) Object.entries(c.cargo).forEach(([k, q]) => (cargo[k] = (cargo[k] || 0) + q)); });
    const cargoTxt = Object.entries(cargo).filter(([, q]) => q > 1e-3).map(([k, q]) => { const c = AA.config.commodities.find((x) => x.key === k); return `${AA.fmt.n(q, q < 10 ? 1 : 0)} ${c.unit} ${c.label.toLowerCase()}`; }).join(', ');
    const fromName = leg.from.kind === 'd' ? `${leg.a.id} ${leg.a.name}` : `${leg.a.id} ${leg.a.name}`;
    const kinds = [...new Set(leg.tours.map((ti) => run.cons.tours[ti].kind))].join(' / ');
    const nVeh = leg.tours.length;
    if (leg.airdrop) {
      const l = L.polyline([[leg.a.lat, leg.a.lon], [leg.b.lat, leg.b.lon]], { color: '#dc2626', weight: 2.5, dashArray: '1 7', lineCap: 'round' });
      l.bindTooltip(`<b>No road access · ${esc(fromName)} → ${leg.b.id}</b><br>Every road alternative and both detours cross a closure or a segment with damage θ ≥ ${AA.config.thetaMax}. Recommend air drop / helicopter. The allocation was re-solved without this arc.<span class="m">Model: OSRM alternatives + closure buffer ${AA.config.closureBufferKm * 1000} m + θ<sub>max</sub> rule</span>`, { className: 'aa-tip', sticky: true });
      l.addTo(layers.legs);
      L.marker([(leg.a.lat + leg.b.lat) / 2, (leg.a.lon + leg.b.lon) / 2], { icon: L.divIcon({ className: '', html: '<span class="airdrop-label">Air drop</span>', iconSize: [50, 14], iconAnchor: [25, 7] }) }).addTo(layers.legs);
      return;
    }
    const b = leg.best;
    const latlngs = b.coords.map((c) => [c[1], c[0]]);
    const line = L.polyline(latlngs, { color: veh.color, weight: Math.min(7, 2.5 + nVeh * 0.5), opacity: 0.92, dashArray: kinds.includes('milk-run') ? '10 6' : null });
    const alts = leg.candidates.length;
    line.bindTooltip(`<b>${veh.label}${nVeh > 1 ? ` ×${nVeh}` : ''} · ${esc(fromName)} → ${leg.b.id} ${esc(leg.b.name)}</b><br>${cargoTxt || 'empty return leg'}<br>${AA.fmt.n(b.km, 1)} km · ${AA.fmt.min(b.ev.adjH)} damage- & congestion-adjusted (free-flow ${AA.fmt.min(b.h)})<br>Road damage θ̄ ${b.ev.mean.toFixed(2)}, max ${b.ev.max.toFixed(2)} · ${kinds}${leg.detour ? ' · detour around closure' : ''} · chosen from ${alts} path${alts > 1 ? 's' : ''} by generalised cost $${AA.fmt.n(b.ev.gc, 0)}${leg.source === 'estimated' ? '<br><i>Estimated straight-line path (road router unavailable)</i>' : ''}<span class="m">Model: MILP allocation → Clarke–Wright VRP → OSRM shortest path (Contraction Hierarchies) → BPR congestion + damage-adjusted speed</span>`, { className: 'aa-tip', sticky: true });
    line.on('click', () => AA.explain.open('m-route'));
    line.addTo(layers.legs);
    leg._latlngs = latlngs; leg._n = Math.min(3, nVeh); leg._cargoTxt = cargoTxt;
  };

  /** Simulated fleet movement along routed legs. */
  let lastLegs = [];
  MAP.animate = (legs) => {
    if (legs) lastLegs = legs;
    if (anim) cancelAnimationFrame(anim); layers.fleet.clearLayers();
    if (!AA.config.showFleet) return;
    legs = lastLegs;
    const movers = [];
    legs.filter((l) => l._latlngs && l._latlngs.length > 1).forEach((l) => {
      const cum = [0]; for (let k = 1; k < l._latlngs.length; k++) cum.push(cum[k - 1] + map.distance(l._latlngs[k - 1], l._latlngs[k]));
      const total = cum[cum.length - 1]; if (!total) return;
      for (let n = 0; n < l._n; n++) {
        const v = AA.config.vehicles[l.cls];
        const mk = L.circleMarker(l._latlngs[0], { radius: 6, color: '#111', weight: 1.5, fillColor: v.color, fillOpacity: 1 }).addTo(layers.fleet);
        mk.bindTooltip(`<b>${v.label} in transit</b> (simulated position)<br>${esc(l.a.name)} → ${esc(l.b.name)}<br>${esc(l._cargoTxt || '')}<br>Trip takes about ${AA.fmt.min(l.best.ev.adjH)} on damaged roads<span class="m">Shows where a dispatched vehicle would be along its planned route. Not GPS tracking.</span>`, { className: 'aa-tip' });
        movers.push({ mk, l, cum, total, off: n / l._n, period: reduceMotion ? 1e12 : 12000 + Math.min(24000, l.best.ev.adjH * 12000) });
      }
    });
    const t0 = performance.now();
    const step = (t) => {
      movers.forEach((m) => {
        const f = (((t - t0) / m.period) + m.off) % 1, d = f * m.total;
        let k = 1; while (k < m.cum.length && m.cum[k] < d) k++;
        const a = m.l._latlngs[k - 1], b = m.l._latlngs[Math.min(k, m.l._latlngs.length - 1)];
        const seg = (m.cum[k] - m.cum[k - 1]) || 1, u = (d - m.cum[k - 1]) / seg;
        m.mk.setLatLng([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]);
      });
      anim = requestAnimationFrame(step);
    };
    if (movers.length) anim = requestAnimationFrame(step);
  };

  MAP.drawSites = (st) => {
    layers.sites.clearLayers();
    layers.labels.eachLayer((l) => { if (l.options.icon?.options?.html?.includes('maplabel site')) layers.labels.removeLayer(l); });
    const w = st.warehouses; if (!w) return;
    w.cand.forEach((c) => { if (!c.safe && c.kind === 'grid') L.circleMarker([c.lat, c.lon], { radius: 3, color: '#7c3aed', weight: 1, opacity: 0.5, fillOpacity: 0, interactive: false }).addTo(layers.sites); });
    w.sizes.forEach((s, k) => {
      const c = w.cand[s.j];
      const stock = AA.config.commodities.map((cm) => `${AA.fmt.n(s.stock[cm.key], s.stock[cm.key] < 10 ? 1 : 0)} ${cm.unit} ${cm.label.toLowerCase()}`).join('<br>');
      const where = c.address ? c.address.split(',').slice(0, 2).join(',') : '';
      L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', html: '<div class="site-diamond"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 600 })
        .bindTooltip(`<b>Recommended storage S${k + 1}</b>${c.name ? ` (existing: ${esc(c.name)})` : ''}${addrLine(c)}<br>Serves ${esc(s.zones.map((id) => st.zones.find((z) => z.id === id)?.name || id).join(', '))} within ${AA.config.coverageMinutes} min<br>Pre-position for 72 h at P90:<br>${stock}<br><i>Click for address and directions</i><span class="m">Model: hazard-safe MCLP (${esc(w.sol.method)}) + 72 h P90 sizing</span>`, { className: 'aa-tip' })
        .bindPopup(() => `<h4>Recommended storage S${k + 1}</h4><div class="small">${c.name ? `Existing facility: ${esc(c.name)}<br>` : 'Suggested location: look for a warehouse, school, hall or open ground at or near this point that is safe from the hazard.<br>'}Serves ${esc(s.zones.map((id) => st.zones.find((z) => z.id === id)?.name || id).join(', '))} within ${AA.config.coverageMinutes} min by road<br>Stock for 72 h at P90: ${stock.replace(/<br>/g, ', ')}</div>${MAP.whereHtml(c)}<div class="small"><a href="#m-mclp" class="x-mclp">How this site was chosen</a></div>`)
        .on('popupopen', (e) => { const a = e.popup.getElement()?.querySelector('.x-mclp'); if (a) a.onclick = (ev) => { ev.preventDefault(); AA.explain.open('m-mclp'); }; })
        .addTo(layers.sites);
      label(c, `S${k + 1} storage${where ? ` · ${where}` : ''}`, 'site');
    });
  };

  /** "Key actions now" box on the map (top-left). Pass null to remove. */
  let actionsCtl = null;
  MAP.drawActions = (acts, onReport) => {
    if (actionsCtl) { map.removeControl(actionsCtl); actionsCtl = null; }
    if (!acts || !acts.length) return;
    actionsCtl = L.control({ position: 'topleft' });
    actionsCtl.onAdd = () => {
      const el = L.DomUtil.create('div', 'actions-box');
      L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el);
      const collapsed = (() => { try { return localStorage.getItem('aa.actionsCollapsed') === '1'; } catch (e) { return false; } })();
      el.innerHTML = `<div class="ab-head"><b>Key actions now</b><button type="button" class="ab-tog">${collapsed ? 'show' : 'hide'}</button></div><ol ${collapsed ? 'hidden' : ''}>${acts.map((a, k) => `<li data-k="${k}" title="${esc(a.detail)}"><span class="ai">${a.icon}</span>${esc(a.text)}</li>`).join('')}</ol><button type="button" class="btn primary ab-rep" ${collapsed ? 'hidden' : ''}>Full action report</button>`;
      el.querySelectorAll('li').forEach((li) => li.addEventListener('click', () => { const a = acts[+li.dataset.k]; if (a.at) map.flyTo([a.at.lat, a.at.lon], Math.max(map.getZoom(), 11)); }));
      el.querySelector('.ab-rep').addEventListener('click', onReport);
      el.querySelector('.ab-tog').addEventListener('click', (e) => { const ol = el.querySelector('ol'), rb = el.querySelector('.ab-rep'); ol.hidden = !ol.hidden; rb.hidden = ol.hidden; e.target.textContent = ol.hidden ? 'show' : 'hide'; try { localStorage.setItem('aa.actionsCollapsed', ol.hidden ? '1' : '0'); } catch (er) {} });
      return el;
    };
    actionsCtl.addTo(map);
  };

  /** Risk grid heat map. */
  MAP.drawRisk = (cells, top, onClick) => {
    layers.risk.clearLayers();
    const maxR = Math.max(0.01, ...cells.map((c) => c.R));
    const ramp = (v) => { const t = M.clamp(v / maxR, 0, 1); const r = Math.round(255), g = Math.round(237 - 180 * t), b = Math.round(160 - 140 * t); return `rgb(${r},${g},${b})`; };
    cells.forEach((c) => {
      const dLat = c.sizeKm / 2 / 110.57, dLon = c.sizeKm / 2 / (111.32 * Math.cos(M.toRad(c.lat)));
      const isTop = top.includes(c);
      const rect = L.rectangle([[c.lat - dLat, c.lon - dLon], [c.lat + dLat, c.lon + dLon]], { color: isTop ? '#111' : '#fff', weight: isTop ? 2 : 0.5, fillColor: ramp(c.R), fillOpacity: 0.55 });
      rect.bindTooltip(`<b>${esc(c.name || c.id)}</b>${isTop ? ` · rank ${top.indexOf(c) + 1}` : ''}<br>Risk R = ${c.R.toFixed(3)} · dominant ${AA.HAZARDS[c.dominant]?.label}<br>H ${c.H.toFixed(2)} · E ${c.E.toFixed(2)} · V ${c.V.toFixed(2)} · LCC ${c.LCC.toFixed(2)}<span class="m">Model: INFORM geometric mean · Gutenberg–Richter · Gumbel</span>`, { className: 'aa-tip', sticky: true });
      rect.on('click', () => onClick(c));
      rect.addTo(layers.risk);
    });
    map.fitBounds(L.latLngBounds(cells.map((c) => [c.lat, c.lon])).pad(0.1));
  };

  AA.map = MAP;
})(window);

</script>
<script>/* js/ui/map3d.js */
/* 3D map: MapLibre GL — a globe for the world view, then satellite imagery, real terrain, 3D buildings and the plan drawn as 3D columns.
   Mirrors whatever the 2D (Leaflet) map shows — live events, a plan, risk cells — so every mode works in 3D.
   Tilt/rotate: right-drag or Ctrl+drag (two fingers on phones). Falls back to 2D when WebGL or the library is unavailable.
   Skill: skills/ui-sketch/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const V = { active: false, data: {} };
  const VER = '5.24.0';
  const LIB = `https://cdn.jsdelivr.net/npm/maplibre-gl@${VER}/dist/maplibre-gl.js`;
  const CSS = `https://cdn.jsdelivr.net/npm/maplibre-gl@${VER}/dist/maplibre-gl.css`;
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services';
  const DEM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  let ready = false, gl = null, m3 = null, el = null, hover = null, popup = null, syncing = false, renderTimer = null, loading = null;

  let probe = null;
  const glInfo = () => {
    if (probe) return probe;
    probe = { ok: false, software: false, renderer: '' };
    try {
      const c = document.createElement('canvas'), g = c.getContext('webgl2') || c.getContext('webgl');
      if (g) {
        const ext = g.getExtension('WEBGL_debug_renderer_info');
        probe.renderer = String(ext ? g.getParameter(ext.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER) || '');
        probe.ok = true;
        probe.software = /swiftshader|llvmpipe|softpipe|software|microsoft basic render/i.test(probe.renderer);
        g.getExtension('WEBGL_lose_context')?.loseContext();
      }
    } catch (e) { /* no WebGL */ }
    return probe;
  };
  V.supported = () => glInfo().ok;
  /** 3D by default only with a real graphics chip: software WebGL works but is too slow to be the default. */
  V.recommended = () => glInfo().ok && !glInfo().software;
  const loadLib = () => loading || (loading = new Promise((res, rej) => {
    if (root.maplibregl) return res(root.maplibregl);
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = CSS; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = LIB; s.async = true;
    const t = setTimeout(() => rej(new Error('3D library timed out')), 20000);
    s.onload = () => { clearTimeout(t); root.maplibregl ? res(root.maplibregl) : rej(new Error('3D library did not load')); };
    s.onerror = () => { clearTimeout(t); rej(new Error('3D library could not be downloaded')); };
    document.head.appendChild(s);
  }).catch((e) => { loading = null; throw e; }));

  const style = () => ({
    version: 8,
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: {
      sat: { type: 'raster', tiles: [`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`], tileSize: 256, maxzoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' },
      roads: { type: 'raster', tiles: [`${ESRI}/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}`], tileSize: 256, maxzoom: 19 },
      places: { type: 'raster', tiles: [`${ESRI}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`], tileSize: 256, maxzoom: 19 },
      dem: { type: 'raster-dem', tiles: [DEM], encoding: 'terrarium', tileSize: 256, maxzoom: 15, attribution: 'Terrain: Mapzen / AWS Open Data' },
      demhs: { type: 'raster-dem', tiles: [DEM], encoding: 'terrarium', tileSize: 256, maxzoom: 15 },
      ofm: { type: 'vector', url: 'https://tiles.openfreemap.org/planet', attribution: '© OpenFreeMap, OpenMapTiles, OpenStreetMap contributors' },
    },
    layers: [
      { id: 'sat', type: 'raster', source: 'sat' },
      { id: 'hillshade', type: 'hillshade', source: 'demhs', paint: { 'hillshade-exaggeration': 0.3, 'hillshade-shadow-color': '#2a2a2a' } },
      { id: 'roads', type: 'raster', source: 'roads', paint: { 'raster-opacity': 0.75 } },
      { id: 'places', type: 'raster', source: 'places', paint: { 'raster-opacity': 0.9 } },
      { id: 'buildings', type: 'fill-extrusion', source: 'ofm', 'source-layer': 'building', minzoom: 13.5,
        paint: { 'fill-extrusion-color': '#ece8df', 'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 9], 'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0], 'fill-extrusion-opacity': 0.82 } },
    ],
    terrain: { source: 'dem', exaggeration: 1.4 },
    // globe for the world view; flat (mercator) from zoom 5 so 3D columns stay clickable when you look at a region
    projection: { type: ['interpolate', ['linear'], ['zoom'], 4, 'vertical-perspective', 5, 'mercator'] },
    sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] },
  });
  /** Tilt that suits the zoom: a flat-on globe for the world view, a 3D tilt once you are looking at a region. */
  const pitchFor = (z) => (z < 4 ? 0 : z < 7 ? 35 : 55);

  const FC = (features) => ({ type: 'FeatureCollection', features });
  const pt = (p, props) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [+p.lon, +p.lat] }, properties: props });
  const poly = (ring, props) => ({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] }, properties: props });
  const line = (coords, props) => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: props });
  const SRC = ['aa-impact', 'aa-zones', 'aa-sites', 'aa-risk', 'aa-legs', 'aa-cas', 'aa-points', 'aa-labels'];

  const addOverlays = () => {
    SRC.forEach((id) => m3.addSource(id, { type: 'geojson', data: FC([]) }));
    const font = ['Noto Sans Regular'];
    m3.addLayer({ id: 'aa-risk', type: 'fill-extrusion', source: 'aa-risk', paint: { 'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': 0.72 } });
    m3.addLayer({ id: 'aa-impact-fill', type: 'fill', source: 'aa-impact', paint: { 'fill-color': '#16a34a', 'fill-opacity': 0.07 } });
    m3.addLayer({ id: 'aa-impact-line', type: 'line', source: 'aa-impact', paint: { 'line-color': '#16a34a', 'line-width': 1.5, 'line-dasharray': [3, 3] } });
    m3.addLayer({ id: 'aa-legs', type: 'line', source: 'aa-legs', filter: ['==', ['get', 'kind'], 'road'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'w'], 'line-opacity': 0.95 } });
    m3.addLayer({ id: 'aa-legs-milk', type: 'line', source: 'aa-legs', filter: ['==', ['get', 'kind'], 'milk'], paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'w'], 'line-dasharray': [2, 1.2] } });
    m3.addLayer({ id: 'aa-legs-air', type: 'line', source: 'aa-legs', filter: ['==', ['get', 'kind'], 'air'], layout: { 'line-cap': 'round' }, paint: { 'line-color': '#dc2626', 'line-width': 3, 'line-dasharray': [0.2, 2] } });
    m3.addLayer({ id: 'aa-cas', type: 'line', source: 'aa-cas', paint: { 'line-color': '#db2777', 'line-width': 2.5, 'line-dasharray': [2, 2] } });
    m3.addLayer({ id: 'aa-zones', type: 'fill-extrusion', source: 'aa-zones', paint: { 'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': 0.85 } });
    m3.addLayer({ id: 'aa-sites', type: 'fill-extrusion', source: 'aa-sites', paint: { 'fill-extrusion-color': '#7c3aed', 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': 0.9 } });
    m3.addLayer({ id: 'aa-points', type: 'circle', source: 'aa-points', paint: { 'circle-color': ['get', 'color'], 'circle-radius': ['get', 'r'], 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2, 'circle-pitch-alignment': 'viewport' } });
    m3.addLayer({ id: 'aa-points-tag', type: 'symbol', source: 'aa-points', filter: ['!=', ['get', 'tag'], ''], layout: { 'text-field': ['get', 'tag'], 'text-font': font, 'text-size': 11, 'text-allow-overlap': true }, paint: { 'text-color': '#ffffff' } });
    m3.addLayer({ id: 'aa-labels', type: 'symbol', source: 'aa-labels', minzoom: 9, layout: { 'text-field': ['get', 'label'], 'text-font': font, 'text-size': 12.5, 'text-offset': [0, -1.6], 'text-anchor': 'bottom', 'text-max-width': 14, 'text-optional': true }, paint: { 'text-color': '#111111', 'text-halo-color': '#ffffff', 'text-halo-width': 1.8 } });
  };

  // ---------------- data → GeoJSON ----------------
  const ramp = (t) => `rgb(255,${Math.round(237 - 180 * t)},${Math.round(160 - 140 * t)})`;
  const needColor = (t) => { const a = [187, 247, 208], b = [21, 128, 61]; return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`; };
  const build = () => {
    const d = V.data, out = Object.fromEntries(SRC.map((k) => [k, []]));
    // live events
    (d.events || []).forEach((e, k) => {
      const top = k < (d.eventsTop ?? 5);
      const lvl = e.episodealertlevel || e.alertlevel || (e.pager ? { green: 'Green', yellow: 'Orange', orange: 'Red', red: 'Red' }[e.pager] : '');
      out['aa-points'].push(pt(e, { kind: 'event', k, color: lvl === 'Red' ? '#dc2626' : lvl === 'Orange' ? '#ea580c' : '#16a34a', r: top ? 11 : 5, tag: top ? String(k + 1) : '' }));
      if (top) out['aa-labels'].push(pt(e, { label: e.name }));
    });
    // field reports
    (d.field || []).forEach((r, k) => out['aa-points'].push(pt(r, { kind: 'field', k, color: r.applied ? '#6b7280' : (AA.map.FIELD_COLORS || [])[Math.round(r.damage * 4)] || '#f59e0b', r: 7, tag: '' })));
    // risk grid
    if (d.risk) {
      const cells = d.risk.cells, maxR = Math.max(0.01, ...cells.map((c) => c.R));
      cells.forEach((c, k) => {
        const dLat = c.sizeKm / 2 / 110.57, dLon = c.sizeKm / 2 / (111.32 * Math.cos(M.toRad(c.lat)));
        const ring = [[c.lon - dLon, c.lat - dLat], [c.lon + dLon, c.lat - dLat], [c.lon + dLon, c.lat + dLat], [c.lon - dLon, c.lat + dLat], [c.lon - dLon, c.lat - dLat]];
        out['aa-risk'].push(poly(ring, { kind: 'risk', k, color: ramp(M.clamp(c.R / maxR, 0, 1)), h: 200 + (c.R / maxR) * c.sizeKm * 600 }));
        if (d.risk.top.includes(c)) out['aa-labels'].push(pt(c, { label: `${d.risk.top.indexOf(c) + 1}. ${c.name}` }));
      });
      (d.riskSites || []).forEach((s, k) => { out['aa-sites'].push(poly(M.circleRing(s, 1.2, 4), { kind: 'rsite', k, h: 2500 })); out['aa-labels'].push(pt(s, { label: `S${k + 1} storage` })); });
    }
    // plan
    const st = d.st;
    if (st && st.zones) {
      const sit = st.sit, f = sit.focus || sit;
      out['aa-impact'].push(poly(M.circleRing(f, sit.radiusKm, 64), {}));
      const rKm = M.clamp(sit.radiusKm / 40, 0.25, 2.5), H = M.clamp(sit.radiusKm * 120, 2000, 12000);
      const maxAff = Math.max(1, ...st.zones.map((z) => z.fc?.aff?.p50 || 0)), maxNeed = Math.max(0.01, ...st.zones.map((z) => z.need || 0));
      st.zones.forEach((z, i) => {
        out['aa-zones'].push(poly(M.circleRing(z, rKm, 28), { kind: 'zone', i, h: 150 + ((z.fc?.aff?.p50 || 0) / maxAff) * H, color: z.served ? '#86efac' : needColor((z.need || 0) / maxNeed) }));
        out['aa-labels'].push(pt(z, { label: `${z.id} ${z.name}` }));
      });
      st.depots.forEach((dp, j) => { out['aa-points'].push(pt(dp, { kind: 'depot', j, color: dp.open ? '#dc2626' : '#6b7280', r: 8, tag: dp.type === 'hospital' ? 'H' : '' })); out['aa-labels'].push(pt(dp, { label: `${dp.id} ${dp.name}` })); });
      st.hospitals.forEach((h, j) => { if (st.depots.some((dp) => M.haversine(dp, h) < 0.05)) return; out['aa-points'].push(pt(h, { kind: 'hosp', j, color: '#dc2626', r: 7, tag: 'H' })); out['aa-labels'].push(pt(h, { label: `${h.id} ${h.name}` })); });
      (st.closures || []).forEach((c) => out['aa-points'].push(pt(c, { kind: 'closure', color: '#111111', r: 7, tag: '×' })));
      if (st.warehouses) st.warehouses.sizes.forEach((s, k) => { const c = st.warehouses.cand[s.j]; out['aa-sites'].push(poly(M.circleRing(c, rKm * 0.7, 4), { kind: 'site', k, h: H * 0.45 })); out['aa-labels'].push(pt(c, { label: `S${k + 1} storage${c.address ? ` · ${c.address.split(',').slice(0, 2).join(',')}` : ''}` })); });
      const run = st.lastRun;
      if (run) {
        (run.legs || []).forEach((leg, n) => {
          if (leg.airdrop) { out['aa-legs'].push(line([[leg.a.lon, leg.a.lat], [leg.b.lon, leg.b.lat]], { kind: 'air', n })); return; }
          const veh = AA.config.vehicles[leg.cls], milk = leg.tours.some((ti) => run.cons.tours[ti]?.kind === 'milk-run');
          out['aa-legs'].push(line(leg.best.coords, { kind: milk ? 'milk' : 'road', n, color: veh.color, w: Math.min(7, 2.5 + leg.tours.length * 0.6) }));
        });
        (run.casualty?.flows || []).forEach((fl) => { const z = st.zones[fl.i], h = st.hospitals[fl.h]; if (z && h) out['aa-cas'].push(line([[z.lon, z.lat], [h.lon, h.lat]], {})); });
      }
    }
    return out;
  };
  V.render = () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => { if (!m3 || !ready) return; const g = build(); SRC.forEach((k) => m3.getSource(k)?.setData(FC(g[k]))); }, 120);
  };

  // ---------------- interaction ----------------
  const LAYERS = ['aa-points', 'aa-zones', 'aa-sites', 'aa-risk', 'aa-legs', 'aa-legs-milk', 'aa-legs-air', 'aa-cas'];
  const tipFor = (f) => {
    const p = f.properties, st = V.data.st;
    switch (p.kind) {
      case 'event': { const e = V.data.events[p.k]; return `<b>${esc(e.name)}</b><br>${AA.HAZARDS[e.hazard]?.label || e.hazard} · ${esc(e.country || '')}${e.usi != null ? `<br>USI ${e.usi.toFixed(2)}` : ''}<br><i>Click to open its plan</i>`; }
      case 'zone': { const z = st.zones[p.i]; return `<b>${z.id} · ${esc(z.name)}</b><br>Need ${(z.need || 0).toFixed(2)} · affected ${AA.fmt.k(z.fc.aff.p50)} (column height)${MAP().addrLine(z)}`; }
      case 'depot': { const d = st.depots[p.j]; return `<b>${d.id} · ${esc(d.name)}</b><br>${d.typeLabel}${d.open ? '' : ' · offline'}${MAP().addrLine(d)}`; }
      case 'hosp': { const h = st.hospitals[p.j]; return `<b>${h.id} · ${esc(h.name)}</b><br>Receiving hospital · ${h.beds} free beds${MAP().addrLine(h)}`; }
      case 'site': { const c = st.warehouses.cand[st.warehouses.sizes[p.k].j]; return `<b>Recommended storage S${p.k + 1}</b>${MAP().addrLine(c)}<br><i>Click for address and directions</i>`; }
      case 'rsite': { const s = V.data.riskSites[p.k]; return `<b>Recommended storage S${p.k + 1}</b>${MAP().addrLine(s)}`; }
      case 'risk': { const c = V.data.risk.cells[p.k]; return `<b>${esc(c.name || c.id)}</b><br>Risk ${c.R.toFixed(2)} (column height) · ${AA.HAZARDS[c.dominant]?.label || ''}`; }
      case 'closure': return 'Road closed';
      case 'field': { const r = V.data.field[p.k], FR = AA.field; return `<b>Field report · ${esc(FR.damageLabel(r.damage))} damage</b><br>${esc(FR.ROAD[r.road])}${r.people.trapped ? ` · ${r.people.trapped} trapped` : ''}<br>${esc(r.by || 'field team')}${r.note ? `<br>“${esc(r.note.slice(0, 120))}”` : ''}${r.photoUrl ? `<br><img src="${esc(r.photoUrl)}" alt="" style="max-width:160px;max-height:110px;margin-top:4px">` : ''}`; }
      default: return f.layer.id.startsWith('aa-legs') ? 'Aid route · click for how routes are chosen' : f.layer.id === 'aa-cas' ? 'Ambulance flow to hospital' : '';
    }
  };
  const MAP = () => AA.map;
  const onClick = (e) => {
    const f = m3.queryRenderedFeatures(e.point, { layers: LAYERS })[0];
    const ll = { lat: e.lngLat.lat, lng: e.lngLat.lng };
    if (!f || (AA.app && AA.app.picking && AA.app.picking())) { if (AA.app?.mapClick) AA.app.mapClick(ll); return; }
    const p = f.properties, st = V.data.st, h = V.data.handlers || {};
    const show = (content) => { popup?.remove(); popup = new gl.Popup({ maxWidth: '340px', closeButton: true, className: 'aa-pop3d' }).setLngLat(e.lngLat); typeof content === 'string' ? popup.setHTML(content) : popup.setDOMContent(content); popup.addTo(m3); };
    switch (p.kind) {
      case 'event': V.data.onEvent?.(V.data.events[p.k]); break;
      case 'zone': if (h.zonePopup) show(h.zonePopup(st.zones[p.i])); break;
      case 'depot': if (h.depotPopup) show(h.depotPopup(st.depots[p.j])); break;
      case 'hosp': { const x = st.hospitals[p.j]; show(`<h4>${x.id} · ${esc(x.name)}</h4><div class="small">Receiving hospital · ${x.beds} free beds</div>${MAP().whereHtml(x)}`); break; }
      case 'site': { const s = st.warehouses.sizes[p.k], c = st.warehouses.cand[s.j]; show(`<h4>Recommended storage S${p.k + 1}</h4><div class="small">Serves ${esc(s.zones.map((id) => st.zones.find((z) => z.id === id)?.name || id).join(', '))}</div>${MAP().whereHtml(c)}`); break; }
      case 'rsite': show(`<h4>Recommended storage S${p.k + 1}</h4>${MAP().whereHtml(V.data.riskSites[p.k])}`); break;
      case 'risk': V.data.onRisk?.(V.data.risk.cells[p.k]); break;
      default: if (f.layer.id.startsWith('aa-legs')) AA.explain.open('m-route');
    }
  };
  const onMove = (e) => {
    const f = m3.queryRenderedFeatures(e.point, { layers: LAYERS })[0];
    m3.getCanvas().style.cursor = AA.app?.picking?.() ? 'crosshair' : f ? 'pointer' : '';
    if (!f) { hover?.remove(); return; }
    const html = tipFor(f); if (!html) { hover?.remove(); return; }
    if (!hover) hover = new gl.Popup({ closeButton: false, closeOnClick: false, offset: 12, className: 'aa-tip3d', maxWidth: '300px' });
    hover.setLngLat(e.lngLat).setHTML(html).addTo(m3);
  };

  // ---------------- camera sync with the 2D map ----------------
  const fromLeaflet = (animate) => {
    const lm = MAP().map(); if (!lm || !m3) return;
    const c = lm.getCenter(), z = Math.max(0, lm.getZoom() - 1);
    syncing = true;
    const tilt = (z >= 4 && m3.getPitch() < 20) || z < 4 ? { pitch: pitchFor(z) } : {};
    (animate ? m3.easeTo.bind(m3) : m3.jumpTo.bind(m3))({ center: [c.lng, c.lat], zoom: z, ...tilt, ...(animate ? { duration: 900 } : {}) });
    setTimeout(() => (syncing = false), animate ? 950 : 0);
  };
  const toLeaflet = () => {
    if (syncing || !m3) return;
    const lm = MAP().map(), c = m3.getCenter();
    V.pushing = true; lm.setView([c.lat, c.lng], Math.round(m3.getZoom() + 1), { animate: false }); V.pushing = false;
  };

  // ---------------- public API ----------------
  V.enter = async () => {
    if (V.active) return true;
    if (!V.supported()) { AA.app?.toast('3D needs WebGL, which this browser does not offer. Showing 2D.', { err: true }); return false; }
    V.updateButton(true);
    try { gl = await loadLib(); } catch (e) { V.updateButton(false); AA.app?.toast(`3D map unavailable (${esc(e.message)}). Showing 2D.`, { err: true }); return false; }
    const wrap = document.querySelector('.mapwrap');
    if (!el) { el = document.createElement('div'); el.id = 'map3d'; el.setAttribute('aria-label', '3D map'); wrap.insertBefore(el, wrap.querySelector('.toast')); }
    el.hidden = false; document.getElementById('map').classList.add('is3d'); V.active = true;
    if (!m3) {
      const lm = MAP().map(), c = lm.getCenter();
      m3 = new gl.Map({ container: el, style: style(), center: [c.lng, c.lat], zoom: Math.max(0, lm.getZoom() - 1), pitch: pitchFor(lm.getZoom() - 1), bearing: lm.getZoom() - 1 < 4 ? 0 : -15, maxPitch: 80, attributionControl: { compact: true } });
      m3.addControl(new gl.NavigationControl({ visualizePitch: true, showCompass: true }), 'top-right');
      m3.addControl(new gl.ScaleControl({ unit: 'metric' }), 'bottom-left');
      // 'style.load' fires once the style is parsed, even if an optional source (buildings, terrain) is slow or down
      m3.on('style.load', () => { if (ready) return; addOverlays(); ready = true; V.render(); });
      m3.on('error', (e) => { if (/terrain|dem|elevation/i.test(String(e?.error?.message || e?.sourceId || ''))) console.warn('3D terrain tile error', e?.error?.message); });
      m3.on('click', onClick); m3.on('mousemove', onMove); m3.on('mouseout', () => hover?.remove());
      m3.on('moveend', toLeaflet);
      MAP().map().on('moveend', () => { if (V.active && !V.pushing) fromLeaflet(true); });
    } else { m3.resize(); fromLeaflet(false); V.render(); }
    try { AA.workspace?.set('view3d', true); } catch (e) { /* ignore */ }
    V.updateButton();
    return true;
  };
  V.exit = () => {
    if (!V.active) return;
    V.active = false; if (el) el.hidden = true; document.getElementById('map').classList.remove('is3d');
    hover?.remove(); popup?.remove();
    MAP().map().invalidateSize();
    try { AA.workspace?.set('view3d', false); } catch (e) { /* ignore */ }
    V.updateButton();
  };
  V.toggle = () => (V.active ? V.exit() : V.enter());
  V.updateButton = (busy) => {
    const t = document.getElementById('viewToggle'); if (!t) return;
    t.classList.toggle('busy', !!busy);
    t.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.view === '3d') === V.active)));
  };
  V.map = () => m3;
  V.ready = () => ready;
  V.flyTo = (p, zoom) => { if (m3 && V.active) m3.flyTo({ center: [p.lon ?? p.lng, p.lat], zoom: zoom ?? Math.max(m3.getZoom(), 12), pitch: 60 }); };

  /** Hook the 2D drawing calls so the 3D view always shows the same thing. */
  V.hook = () => {
    const MP = MAP();
    const wrap = (name, after) => { const orig = MP[name]; MP[name] = (...a) => { const r = orig.apply(MP, a); try { after(...a); } catch (e) { console.error(e); } return r; }; };
    wrap('drawEvents', (events, onClick, opts = {}) => { V.data.events = events; V.data.onEvent = onClick; V.data.eventsTop = opts.top ?? 5; V.render(); });
    wrap('drawPlan', (st, handlers) => { V.data.st = st; V.data.handlers = handlers; V.data.events = []; V.render(); });
    wrap('drawLeg', () => V.render());
    wrap('drawSites', (st) => { V.data.st = st; V.render(); });
    wrap('drawField', (reports, applied) => { V.data.field = (reports || []).map((r) => ({ ...r, applied: applied?.has(r.id) })); V.render(); });
    wrap('drawRisk', (cells, top, onClick) => { V.data.risk = { cells, top }; V.data.onRisk = onClick; V.data.riskSites = null; V.render(); });
    wrap('clear', (...keys) => {
      const all = !keys.length, has = (k) => all || keys.includes(k);
      if (has('events')) V.data.events = [];
      if (has('zones') || has('impact')) V.data.st = null;
      if (has('field')) V.data.field = [];
      if (has('risk')) { V.data.risk = null; V.data.riskSites = null; }
      if (has('sites') && !V.data.st) V.data.riskSites = null;
      V.render();
    });
  };
  V.setRiskSites = (sites) => { V.data.riskSites = sites; V.render(); };

  AA.map3d = V;
})(window);

</script>
<script>/* js/ui/explain.js */
/* Model explainer drawer: formulas + the applied numbers of the current run. Skill: ui-sketch */
(function (root) {
  const AA = root.AA, M = AA.math, f = AA.fmt;
  const X = {};
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tex = (t) => `<div class="tex" data-tex="${esc(t)}"></div>`;
  const table = (head, rows) => `<div class="tablewrap"><table class="t"><thead><tr>${head.map((h) => `<th class="${h.n ? 'num' : ''}">${h.t ?? h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, k) => `<td class="${head[k].n ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const H = (t, n) => ({ t, n });
  const applied = (title, html) => `<div class="applied"><h5>Applied to this run · ${title}</h5>${html}</div>`;
  const none = '<p class="muted small">Open a disaster or planning scenario to see this calculation applied with real numbers.</p>';

  X.SECTIONS = [
    ['m-loop', 'Adaptive loop'], ['m-usi', 'Live ranking'], ['m-pred', 'Forecast'], ['m-bayes', 'Bayesian update'], ['m-need', 'Need score'],
    ['m-demand', 'Demand'], ['m-milp', 'Allocation MILP'], ['m-bpr', 'Congestion'], ['m-vrp', 'Consolidation'], ['m-route', 'Routing'],
    ['m-cas', 'Casualties'], ['m-mclp', 'Storage sites'], ['m-risk', 'Risk'], ['m-save', 'Savings'], ['m-ready', 'Readiness'],
  ];

  X.render = () => {
    const st = AA.engine.state, run = st?.lastRun, sit = st?.sit;
    const K = AA.config.commodities;
    const s = [];
    s.push(`<nav>${X.SECTIONS.map(([id, t]) => `<a href="#${id}" data-go="${id}">${t}</a>`).join('')}</nav>`);

    // loop
    s.push(`<section id="m-loop"><h3>Adaptive loop</h3><p>Every epoch (Δt = ${AA.config.epochHours} h) the system observes the state, updates the forecast, scores need, solves the allocation, routes it, and executes only the first epoch's decisions (rolling horizon). Any event — a closed road, a depot going offline, new supplies, a surge, spread — triggers the same loop immediately.</p>
      ${tex('\\text{Predict}\\rightarrow\\text{Need}\\rightarrow\\text{Allocate (MILP)}\\rightarrow\\text{Route}\\rightarrow\\text{Dispatch}_{t}\\rightarrow\\text{Observe}_{t+1}\\rightarrow\\cdots')}
      ${tex('recv_{ik}^{t+1}=recv_{ik}^{t}+\\textstyle\\sum_j x_{jik}^{t},\\qquad I_{jk}^{t+1}=I_{jk}^{t}-\\textstyle\\sum_i x_{jik}^{t}+b_{jk}')}
      ${st ? applied(`epoch ${st.epoch} (T+${st.epoch * AA.config.epochHours} h)`, `<div class="log">${st.log.slice(0, 8).map((e) => `<div class="e"><b>T+${e.epoch * AA.config.epochHours} h</b> · ${esc(e.reason)} <span class="d">cost ${f.usd(e.cost)} · ${esc(e.method)}</span></div>`).join('')}</div>`) : none}</section>`);

    // USI
    const ev = sit?.event;
    s.push(`<section id="m-usi"><h3>Unified Severity Index</h3><p>Live events from GDACS, USGS and NASA EONET are put on one scale so earthquakes, cyclones, floods, fires, droughts and eruptions can be ranked together. A is the agency alert (GDACS Green/Orange/Red, or USGS PAGER), m the magnitude normalised per hazard, h a lethality prior from disaster-loss records.</p>
      ${tex('USI = 0.50\\,A + 0.35\\,m + 0.15\\,h,\\quad A=0.3\\,\\tfrac{alert_{event}-1}{2}+0.7\\,\\tfrac{alert_{episode}-1}{2},\\; m_{EQ}=\\tfrac{M-4}{5},\\; m_{TC}=\\tfrac{V}{300},\\; m_{WF}=\\tfrac{\\log_{10}ha}{6},\\; m_{DR}=\\tfrac{\\log_{10}km^2}{6.5}')}
      ${ev && ev.usi != null ? applied(esc(ev.name), tex(`USI = 0.50\\times${ev.A.toFixed(2)} + 0.35\\times${ev.m.toFixed(2)} + 0.15\\times${ev.h.toFixed(2)} = ${ev.usi.toFixed(3)}`) + `<p class="src">Source: ${esc(ev.src)}${ev.url ? ` · <a href="${esc(ev.url)}" target="_blank" rel="noopener">report</a>` : ''}</p>`) : none}</section>`);

    // prediction
    let predApplied = none;
    if (st) {
      const mag = sit.hazard === 'EQ' ? `M_w ${sit.magnitude.toFixed(1)}, depth ${sit.depth} km, a = ${(sit.mmiA ?? 2.5).toFixed(2)}${sit.mmiA != null ? ' (calibrated to USGS observed MMI)' : ''}` : sit.hazard === 'TC' ? `V_max ${Math.round(sit.magnitude)} km/h, R_max 30 km` : `hazard score s₀ = ${sit.magnitude.toFixed(2)}`;
      const sm = st.fcast.summary;
      predApplied = applied(`${AA.HAZARDS[sit.hazard].label}`, `<p class="small">${mag} · impact radius ${Math.round(sit.radiusKm)} km · country vulnerability V = ${sit.countryVul.toFixed(2)} (${esc(sit.countryIdx?.prov)}) · ${st.fcast.draws} Monte-Carlo draws, seed ${st.fcast.seed}</p>
        ${table([H('Total'), H('P10', 1), H('P50', 1), H('P90', 1)], ['aff', 'dis', 'inj', 'fat'].map((k) => [({ aff: 'Affected', dis: 'Displaced', inj: 'Injured', fat: 'Fatalities' })[k], f.n(sm[k].p10), f.n(sm[k].p50), f.n(sm[k].p90)]))}
        <p></p>${table([H('Zone'), H('r km', 1), H(sit.hazard === 'EQ' ? 'MMI' : sit.hazard === 'TC' ? 'km/h' : 's', 1), H('Pop', 1), H('Aff P50', 1), H('Disp P50', 1), H('Inj P50', 1), H('sev', 1)],
          st.zones.map((z) => [`${z.id} ${esc(z.name)} <span class="prov">${z.popProv}</span>`, f.n(z.distKm, 1), f.n(z.I, sit.hazard === 'TC' ? 0 : 2), f.k(z.pop), f.k(z.fc.aff.p50), f.k(z.fc.dis.p50), f.n(z.fc.inj.p50), (z.sevPost ?? z.sevMean).toFixed(2)]))}`);
    }
    s.push(`<section id="m-pred"><h3>Forecast: intensity, damage, people</h3><p>Hazard intensity falls with distance from the source; fragility curves turn intensity into the share of people affected, displaced, injured or killed. Every parameter is perturbed in a seeded Monte-Carlo run, giving P10/P50/P90 per zone. Scenarios low/base/high take Swanson–Megill weights 0.3/0.4/0.3. These are estimates: stock is planned on the expected value and pre-positioned for P90.</p>
      ${tex('I_{EQ}(r)=a+1.5M-4.0\\log_{10}\\sqrt{r_{eff}^2+h^2},\\; r_{eff}=\\max(0,r-L/4),\\; \\log_{10}L=-2.44+0.59M,\\qquad V_{TC}(r)=V_{max}\\,(R_{max}/r)^{0.7}')}
      ${tex('f_{aff}=\\Phi\\!\\left(\\tfrac{I-6.5}{0.8}\\right),\\; f_{dis}=0.4\\,\\Phi\\!\\left(\\tfrac{I-8.2+1.2(V-0.5)}{0.8}\\right),\\; sev=\\Phi\\!\\left(\\tfrac{I-8.5}{0.8}\\right),\\; \\nu=\\Phi\\!\\left(\\tfrac{\\ln(I/\\theta)}{0.17}\\right),\\; \\theta=13.5+2.5(1-V)')}
      ${tex('M\\sim\\mathcal N(M_0,0.2^2),\\; pop\\sim pop_0\\,\\mathrm{LN}(0,0.2^2),\\; \\Delta\\theta\\sim\\mathcal N(0,0.3^2);\\quad d_{ik}=\\textstyle\\sum_s p_s D_{iks},\\; p=(0.3,0.4,0.3)')}
      <h4>Floods: flash vs river</h4><p>Flash floods (steep terrain with relief ≥ 800 m within 20 km, or named glacial-lake outburst, cloudburst or dam failure) kill about 1 in 100 people in the flood zone; river floods about 1 in 10,000. Calibrated on Nepal Aug 2026 (955 deaths / ~93,000 impacted) and Pakistan 2022 (1,739 / 33 M), with the world 1980–2009 average (0.019 %) as a check.</p>
      ${tex('f_{fat}^{flash}=0.01\,f_{aff},\; f_{dis}^{flash}=0.04\,f_{aff};\qquad f_{fat}^{river}=10^{-4}\,f_{aff},\; f_{dis}^{river}=0.2\,f_{aff}')}
      <h4>Agency evidence overrides the model</h4><p>Counts reported by agencies (GDACS Sendai impact reports) are confirmed minimums, so every forecast quantile is raised to at least the reported count; missing people are added to the fatality P90. For floods, reported deaths ÷ the calibrated death rate gives the implied number affected. For USGS earthquakes the fatality P50 is kept inside the PAGER alert band (green &lt; 1, yellow 1–99, orange 100–999, red ≥ 1,000).</p>
      ${tex('\hat X_{q}=\max\big(X_{q}\cdot \tfrac{\max(R,X_{50})}{X_{50}},\,R\big),\quad \hat F_{90}\ge R_{dead}+R_{missing},\quad \hat A\ge R_{dead}/f_{fat}')}
      ${predApplied}<p class="src">Fragility forms follow USGS PAGER (lognormal fatality model) and HAZUS-style damage curves; parameters are representative global values, not country-calibrated.</p></section>`);

    // bayes
    const bz = st ? st.zones.filter((z) => z.bayes) : [];
    s.push(`<section id="m-bayes"><h3>Bayesian update</h3><p>When a field report or a revised feed value arrives, zone severity is updated as a Gaussian conjugate pair, so trusted assessors move the estimate more than crowd reports.</p>
      ${tex('\\mu_1=\\frac{\\mu_0/\\sigma_0^2+y/\\sigma_y^2}{1/\\sigma_0^2+1/\\sigma_y^2},\\qquad \\sigma_1^2=\\frac{1}{1/\\sigma_0^2+1/\\sigma_y^2}')}
      ${bz.length ? applied('field reports', table([H('Zone'), H('μ₀', 1), H('σ₀', 1), H('y', 1), H('σy', 1), H('μ₁', 1), H('σ₁', 1)], bz.map((z) => [z.id, z.bayes.prior.mu.toFixed(3), z.bayes.prior.sd.toFixed(3), z.bayes.obs.y.toFixed(2), z.bayes.obs.sd.toFixed(2), z.bayes.post.mu.toFixed(3), z.bayes.post.sd.toFixed(3)]))) : `<p class="muted small">No field reports yet. Open a zone on the map and choose “Field report”.</p>`}</section>`);

    // need
    const w = AA.config.needWeights;
    s.push(`<section id="m-need"><h3>Need score (fairness)</h3><p>Need compares severity, people at risk, vulnerability, how hard the zone is to reach and what it has already received. Population carries less weight than severity because absolute demand already scales with people.</p>
      ${tex(`N_i = ${w.sev}\\,\\widetilde{sev}_i + ${w.pop}\\,\\widetilde{pop}_i + ${w.vul}\\,vul_i + ${w.acc}\\,acc_i - ${w.recv}\\,\\widetilde{recv}_i,\\qquad \\tilde x=\\frac{x-\\min x}{\\max x-\\min x+\\epsilon}`)}
      ${st ? applied('per zone', table([H('Zone'), H('sev', 1), H('s̃ev', 1), H('pop at risk', 1), H('p̃op', 1), H('vul', 1), H('acc', 1), H('r̃ecv', 1), H('N', 1)], st.zones.map((z) => { const p = z.needParts; return [`${z.id} ${esc(z.name)}`, p.sev.toFixed(2), p.sevN.toFixed(2), f.k(p.pop), p.popN.toFixed(2), p.vul.toFixed(2), p.acc.toFixed(2), p.recvN.toFixed(2), `<b>${z.need.toFixed(3)}</b>`]; }))) : none}</section>`);

    // demand
    s.push(`<section id="m-demand"><h3>Demand (Sphere standards)</h3><p>Per-person minimums from the Sphere Handbook drive water, food and shelter; medical modules and personnel use labelled planning ratios. Flow items accumulate per day; stock items are one-off targets. Demand is netted against deliveries already received so no zone is supplied twice.</p>
      ${tex('D^{water}=\\tfrac{15\\,dis+3\\,(aff-dis)}{1000}\\,\\tfrac{kL}{day},\\; D^{food}=\\tfrac{0.6\\,dis+0.3\\,(aff-dis)}{1000}\\,\\tfrac{t}{day},\\; D^{shelter}=\\tfrac{dis}{5},\\; D^{med}=\\tfrac{inj}{50}+\\tfrac{aff}{1000},\\; D^{staff}=\\tfrac{inj}{20}+\\tfrac{dis}{500}')}
      ${tex('d_{ik}=\\max\\!\\left(0,\\; \\textstyle\\sum_s p_s D_{iks}\\cdot ramp(t)\\cdot surge_i - recv_{ik}\\right)')}
      ${st ? applied(`net demand this epoch`, table([H('Zone'), ...K.map((k) => H(`${k.label} (${k.unit})`, 1))], st.zones.map((z) => [z.id, ...K.map((k) => f.n(z.d[k.key], z.d[k.key] < 10 ? 1 : 0))]))) : none}</section>`);

    // MILP
    let milp = none;
    if (run) {
      const a = run.alloc;
      const ships = a.ship.slice().sort((p, q) => q.qty * K.find((k) => k.key === q.k).kg - p.qty * K.find((k) => k.key === p.k).kg).slice(0, 30);
      milp = applied(`${esc(a.method)} · ${a.nVars} variables, ${a.nCons} constraints, ${a.nInts} integer · ${a.ms} ms`, `<p class="small">C₀ (naive nearest-depot cost) = ${f.usd(a.C0)} · transport ${f.usd(a.cost.transport)} + handling ${f.usd(a.cost.handling)} + congestion ${f.usd(a.cost.congestion)} = <b>${f.usd(a.cost.total)}</b> · objective ${a.objective?.toFixed(4)}</p>
        ${table([H('Commodity'), H('Demand', 1), H('Shipped', 1), H('Unmet', 1), H('M_k', 1), H('Gini', 1)], K.map((k) => { const d = M.sum(st.zones.map((z) => z.d[k.key] || 0)), u = M.sum(a.unmet.map((x) => x[k.key] || 0)); return [`${k.label} (${k.unit})`, f.n(d, 1), f.n(d - u, 1), f.n(u, 1), (a.Mk[k.key] || 0).toFixed(3), a.giniByK[k.key] != null ? a.giniByK[k.key].toFixed(3) : '–']; }))}
        <p></p>${table([H('Depot → Zone'), H('Commodity'), H('x', 1), H('Trips', 1), H('τ h', 1)], ships.map((sp) => { const k = K.find((c) => c.key === sp.k); const tr = a.trips.find((t) => t.j === sp.j && t.i === sp.i && t.cls === k.cls); return [`${st.depots[sp.j].id} → ${st.zones[sp.i].id}`, k.label, `${f.n(sp.qty, sp.qty < 10 ? 2 : 0)} ${k.unit}`, tr ? tr.n : '–', run.pb.tau[sp.j][sp.i].toFixed(2)]; }))}<p class="src">Showing the ${ships.length} largest of ${a.ship.length} shipments.</p>`);
    }
    const ob = { ...AA.config.objective, ...(st?.objective || {}) };
    s.push(`<section id="m-milp"><h3>Allocation MILP</h3><p>A multi-commodity, capacity- and fleet-constrained program decides how much of each resource moves from each supply store to each zone, and how many vehicle trips that takes. Cost (fuel, crew time, dispatch, handling, congestion) is traded against need-weighted shortages, a per-commodity minimax that equalises shortage ratios, a linearised Gini, and a service floor for water and medical supplies.</p>
      ${tex(`\\min\\; ${ob.alpha === 1 ? '' : ob.alpha + '\\,'}\\frac{\\sum\\kappa_{jic}n_{jic}+\\sum c^L w_k x_{jik}+\\sum\\psi_{is}f_{is}}{C_0}+\\sum_{ik}\\pi_k(0.5+N_i)\\frac{u_{ik}}{D_k}+\\frac{${ob.delta}}{3}\\sum_k\\pi_k M_k+${ob.beta}\\frac{\\sum g_{ii'k}}{|I|^2}+${ob.mu}\\sum\\frac{\\sigma_{ik}}{D_k}`)}
      ${tex('\\begin{aligned}&\\textstyle\\sum_j x_{jik}+u_{ik}=d_{ik} && \\text{demand balance}\\\\ &\\textstyle\\sum_i x_{jik}\\le S_{jk} && \\text{supply}\\\\ &\\textstyle\\sum_{k\\in K_c} w_k x_{jik}\\le Q_c\\,n_{jic} && \\text{capacity + compatibility}\\\\ &\\textstyle\\sum_i (2\\tau_{ji}+t_s)\\,n_{jic}\\le F_{jc}\\,\\Delta t && \\text{fleet hours}\\\\ &(0.5+N_i)\\,u_{ik}/d_{ik}\\le M_k && \\text{need-weighted minimax}\\\\ &g_{ii\'k}\\ge \\pm(q_{ik}-q_{i\'k}) && \\text{linear Gini}\\\\ &\\textstyle\\sum_j x_{jik}\\ge \\phi\\, d_{ik}-\\sigma_{ik},\\;k\\in K^c && \\text{service floor }\\phi=' + ob.phi + '\\\\ & n_{jic}\\in\\mathbb Z_{\\ge 0} \\end{aligned}')}
      ${tex('\\kappa_{jic}=2\\,\\delta_{ji}\\,c^D_c+2\\,\\tau_{ji}\\,c^T_c+c^F_c')}
      ${milp}<p class="src">Solver: javascript-lp-solver (simplex + branch & bound) in your browser. Unit costs: truck $${AA.config.vehicles.truck.cD}/km, $${AA.config.vehicles.truck.cT}/h, $${AA.config.vehicles.truck.cF}/trip, 8 t; bus $${AA.config.vehicles.bus.cD}/km, 30 seats. Handling $${AA.config.loadCostPerKg}/kg.</p></section>`);

    // BPR
    s.push(`<section id="m-bpr"><h3>Congestion (BPR)</h3><p>Sending many vehicles into one zone slows them all. The Bureau of Public Roads function is linearised into three convex segments so the solver spreads convoys across access routes and time.</p>
      ${tex('\\tau(v)=\\tau_0\\left(1+0.15\\left(\\tfrac{v}{\\kappa}\\right)^4\\right),\\qquad \\tfrac{d}{dv}\\big[v\\,\\tau(v)\\big]=\\tau_0\\left(1+0.75\\left(\\tfrac{v}{\\kappa}\\right)^4\\right)\\Rightarrow \\text{slopes } 1.003,\\,1.24,\\,4.80')}
      ${run ? applied('zone access', table([H('Zone'), H('κ veh/epoch', 1), H('Trips in', 1), H('τ̄ h', 1), H('BPR factor', 1)], st.zones.map((z, i) => { const v = M.sum(run.alloc.trips.filter((t) => t.i === i).map((t) => t.n)); return [z.id, run.alloc.kap[i].toFixed(1), v, run.alloc.tbar[i].toFixed(2), (1 + 0.15 * (v / run.alloc.kap[i]) ** 4).toFixed(2)]; }))) : none}</section>`);

    // VRP
    s.push(`<section id="m-vrp"><h3>Load consolidation (Clarke–Wright)</h3><p>Full truckloads go direct. Part-loads from the same depot are merged into multi-stop milk runs when the combined load fits the vehicle and the tour fits in the epoch, removing vehicles from the road.</p>
      ${tex('s_{ab}=\\tau_{ja}+\\tau_{jb}-\\tau_{ab},\\quad \\text{merge in decreasing } s_{ab}\\text{ while } \\textstyle\\sum load\\le Q,\\; T_{tour}\\le\\Delta t')}
      ${run ? applied('this epoch', `<p class="small">Vehicle trips ${run.cons.tripsBefore} → ${run.cons.tripsAfter} (${run.cons.saved} saved) · ${run.cons.tours.filter((t) => t.kind === 'milk-run').length} milk runs</p>` + (run.cons.tours.filter((t) => t.kind === 'milk-run').length ? table([H('Depot'), H('Stops'), H('Load', 1), H('Tour h', 1)], run.cons.tours.filter((t) => t.kind === 'milk-run').map((t) => [st.depots[t.j].id, t.stops.map((i) => st.zones[i].id).join(' → '), `${f.n(t.loadKg, 0)} ${t.cls === 'bus' ? 'seats' : 'kg'}`, t.hours.toFixed(2)])) : '')) : none}</section>`);

    // routing
    s.push(`<section id="m-route"><h3>Routing on damaged roads</h3><p>Each leg asks OSRM for the shortest road paths (Contraction Hierarchies, an exact accelerated Dijkstra) and alternatives. Paths are scored by generalised cost with speed reduced by road damage; any path within ${AA.config.closureBufferKm * 1000} m of a closure or crossing damage θ ≥ ${AA.config.thetaMax} is rejected, detours are tried, and isolated zones are flagged for air drop and removed from the next solve.</p>
      ${tex('GC_r=c^D\\,dist_r+c^T\\,\\frac{t_r\\,\\gamma}{1-\\alpha\\,\\bar\\theta_r},\\quad \\alpha=' + AA.config.roadAlpha + ',\\; \\gamma=\\text{congestion factor}')}
      ${tex('\\theta_{t+1}=\\max\\{0,\\;\\theta_t(1-\\rho)+\\eta_t\\},\\quad \\rho=' + AA.config.roadRecovery + '\\;\\text{per epoch},\\quad \\theta^{EQ}_0=\\Phi\\!\\left(\\tfrac{I-9.0}{1.0}\\right)')}
      ${run && run.legs.length ? applied(`${run.legs.length} legs · ${run.routing === 'done' ? 'complete' : 'routing…'}`, table([H('Leg'), H('km', 1), H('free h', 1), H('adj h', 1), H('θ̄', 1), H('θmax', 1), H('paths', 1), H('status')], run.legs.map((l) => { const b = l.best; return [`${l.a.id} → ${l.b.id} (${l.cls})`, b ? f.n(b.km, 1) : '–', b ? b.h.toFixed(2) : '–', b ? b.ev.adjH.toFixed(2) : '–', b ? b.ev.mean.toFixed(2) : '–', b ? b.ev.max.toFixed(2) : '–', l.candidates.length, l.airdrop ? '<b>air drop</b>' : l.detour ? 'detour' : l.source]; }))) : none}<p class="src">Road network and travel times: ${esc(st?.tableProv || 'OSRM')} (OpenStreetMap data).</p></section>`);

    // casualties
    s.push(`<section id="m-cas"><h3>Casualty transport</h3><p>Hospital-level casualties (25 % of injured) are sent to hospitals outside the heavy-damage zone. The LP maximises expected survivors, with survival decaying with transport time, within free beds and the ambulance time budget.</p>
      ${tex('\\max\\sum_{ih}e^{-\\tau_{ih}/\\tau_p}\\,p_{ih}-2\\sum_i u^c_i\\;\\; \\text{s.t.}\\; \\sum_h p_{ih}+u^c_i=cas_i,\\; \\sum_i p_{ih}\\le beds_h,\\; \\sum_{ih}\\tfrac{2\\tau_{ih}}{Q^c}p_{ih}\\le A\\,\\Delta t')}
      ${run ? applied(`${run.ambulances} ambulances, τ_p = 1 h`, run.casualty.flows.length ? table([H('Zone → Hospital'), H('Patients', 1), H('τ h', 1), H('e^{−τ}', 1)], run.casualty.flows.map((x) => [`${st.zones[x.i].id} → ${st.hospitals[x.h].id} ${esc(st.hospitals[x.h].name)}`, f.n(x.n, 0), x.tau.toFixed(2), Math.exp(-x.tau).toFixed(2)])) + `<p class="small">Expected survivors weight ${f.n(run.casualty.survivors, 0)} · unserved ${f.n(M.sum(run.casualty.unserved), 0)}</p>` : '<p class="small">No hospitals reachable or no casualties this epoch.</p>') : none}</section>`);

    // MCLP
    const wh = st?.warehouses;
    s.push(`<section id="m-mclp"><h3>Where to pre-position storage</h3><p>Candidate sites on a grid around the area (snapped to roads) plus existing facilities; any site where predicted heavy damage exceeds 0.3 is excluded. The Maximal Covering Location Problem picks P sites that cover the most need within ${AA.config.coverageMinutes} minutes, with a p-median tie-break on travel time. Each site is sized for 72 hours of P90 demand.</p>
      ${tex('\\max\\sum_i N_i A_i z_i-\\varepsilon\\sum_{ij}\\tau_{ij}a_{ij}\\;\\;\\text{s.t.}\\; z_i\\le\\sum_{j:\\tau_{ij}\\le T_c}y_j,\\; \\sum_j y_j=P,\\; y_j=0\\text{ if }sev_j>0.3')}
      ${wh ? applied(esc(wh.sol.method), `<p class="small">Covered need ${f.n((100 * wh.sol.covered) / Math.max(1e-9, wh.sol.total), 1)} % with P = ${wh.sol.sites.length} · ${wh.cand.filter((c) => !c.safe).length} of ${wh.cand.length} candidates excluded as hazard-unsafe</p>` + table([H('Site'), H('Zones'), ...K.map((k) => H(k.unit, 1))], wh.sizes.map((x, k) => [`S${k + 1}`, x.zones.join(', '), ...K.map((c) => f.n(x.stock[c.key], x.stock[c.key] < 10 ? 1 : 0))]))) : '<p class="muted small">Storage sites are computed in Plan, History and Risk modes.</p>'}</section>`);

    // risk
    const rk = AA.app?.riskResult;
    s.push(`<section id="m-risk"><h3>Risk index (INFORM)</h3><p>Hazard probabilities come from catalogues and river discharge; exposure from population; vulnerability and lack of coping capacity from rurality, hospital access and national indicators. Dimensions combine geometrically so a zero in one cannot be hidden by another.</p>
      ${tex('b=\\frac{\\log_{10}e}{\\bar M-(M_c-\\Delta M/2)},\\quad a=\\log_{10}\\tfrac{N}{T}+bM_c,\\quad \\lambda(M\\ge6)=10^{a-6b},\\quad P_{10y}=1-e^{-10\\lambda}')}
      ${tex('Q_T=\\mu-\\beta\\ln\\!\\left(-\\ln\\left(1-\\tfrac1T\\right)\\right),\\; \\beta=\\tfrac{s\\sqrt6}{\\pi},\\; \\mu=\\bar x-0.5772\\beta;\\qquad H=1-\\prod_h(1-P_h)')}
      ${tex('R=\\sqrt{H\\cdot E}^{\\,1/3}\\;V^{1/3}\\;LCC^{1/3}')}
      ${rk ? applied(esc(rk.place), `<p class="small">Gutenberg–Richter: n = ${rk.gr.n}, b = ${rk.gr.b.toFixed(2)}${rk.gr.a != null ? `, a = ${rk.gr.a.toFixed(2)}` : ''}, λ(M≥6) = ${rk.gr.lambda6.toExponential(2)}/yr · events used: ${rk.counts}</p>` + table([H('Area'), H('Dominant'), H('H', 1), H('E', 1), H('V', 1), H('LCC', 1), H('R', 1)], rk.top.map((c) => [esc(c.name), AA.HAZARDS[c.dominant]?.label, c.H.toFixed(2), c.E.toFixed(2), c.V.toFixed(2), c.LCC.toFixed(2), `<b>${c.R.toFixed(3)}</b>`]))) : '<p class="muted small">Run Risk mode for a place to see this applied.</p>'}</section>`);

    // savings vs nearest store
    const sv = st && AA.savings ? AA.savings.compare(st) : null;
    s.push(`<section id="m-save"><h3>Savings vs the nearest-store rule</h3><p>The baseline is what a control room usually does by hand: each area is supplied from its nearest open store (the next-nearest when that store runs out of an item or of vehicle hours), the most-affected area first, with direct trips only. It uses exactly the same demand d<sub>ik</sub>, stock, fleet-hour budgets and road times τ<sub>ji</sub> as the optimised plan, so any difference comes from the decision rule alone.</p>
      ${tex('C=\\sum_{trips}\\big(2\\,km\\,c_D+2\\,h\\,c_T+c_F\\big)+\\sum_{truck\\ goods} kg\\cdot c_{load},\\qquad VH=\\sum_{trips} n\\,(2\\tau_{ji}+t_s)')}
      ${tex('\\text{critical coverage}=\\frac{\\sum_{k\\in\\{water,medical\\}}\\min(\\text{delivered}_k,d_k)\\,kg_k}{\\sum_k d_k\\,kg_k}')}
      <p class="small">The optimised cost counts trips before multi-stop consolidation (a conservative figure); its vehicle-hours use the consolidated runs.</p>
      ${sv ? applied(`T+${st.epoch * AA.config.epochHours} h`, table([H('Measure'), H('Nearest store', 1), H('AidAtlas', 1)], [['Cost', f.usd(sv.baseline.cost), f.usd(sv.optimised.cost)], ['Vehicle-hours', f.n(sv.baseline.vehHours, 1), f.n(sv.optimised.vehHours, 1)], ['Trips', sv.baseline.trips, sv.optimised.trips], ['Critical coverage', `${Math.round(sv.baseline.critCoverage * 100)} %`, `${Math.round(sv.optimised.critCoverage * 100)} %`], ['Gini (water shortage)', sv.baseline.gini.water?.toFixed(3) ?? '–', sv.optimised.gini.water?.toFixed(3) ?? '–'], ['Mean drive time of supplies', f.min(sv.baseline.avgHours), f.min(sv.optimised.avgHours)]])) : none}</section>`);

    // readiness
    const rd = AA.app?.riskResult?.readiness, RD = AA.readiness;
    s.push(`<section id="m-ready"><h3>Pre-season readiness score</h3><p>For each of the five highest-risk areas a design disaster is forecast (its dominant hazard; earthquakes at the 1-in-475-year magnitude from Gutenberg–Richter). Its P90 people affected, displaced and injured give ${RD.DAYS}-day needs N<sub>k</sub> with the Sphere rates. Stock S<sub>k</sub> counts from stores within ${RD.REACH_HOURS} h by road that are not badly damaged (severity &lt; 0.6) in that scenario.</p>
      ${tex('r_k=\\min\\!\\left(1,\\tfrac{S_k}{N_k}\\right),\\quad r_{veh}=\\min\\!\\left(1,\\tfrac{\\sum_j n_j\\lfloor 72/(2\\tau_j+t_s)\\rfloor Q}{\\sum_k N_k\\,kg_k}\\right)')}
      ${tex(`\\text{score}_a=100\\,\\frac{\\sum_k \\pi_k r_k+${RD.TRANSPORT_WEIGHT}\\,r_{veh}}{\\sum_k\\pi_k+${RD.TRANSPORT_WEIGHT}},\\qquad \\text{district}=\\frac{\\sum_a P90_a\\,\\text{score}_a}{\\sum_a P90_a}`)}
      <p class="small">Grades: 80+ ready, 50–79 partly ready, below 50 not ready. “Add before the season” is the largest shortfall of each item over the five areas, so stock is enough for any one of them.</p>
      ${rd ? applied(esc(rd.place), table([H('Area'), H('P90 affected', 1), H('Score', 1), H('Water', 1), H('Medical', 1), H('Vehicles', 1)], rd.areas.map((a) => [esc(a.area.name), f.k(a.area.affP90), Math.round(a.score), `${Math.round(a.items.find((x) => x.key === 'water').r * 100)} %`, `${Math.round(a.items.find((x) => x.key === 'medical').r * 100)} %`, `${Math.round(a.transport.r * 100)} %`]))) : '<p class="muted small">Run Risk mode for a place and press “Readiness score” to see this applied.</p>'}</section>`);

    if (st?.notes?.length) s.push(`<section><h3>Data notes</h3>${st.notes.map((n) => `<p class="note warn">${esc(n)}</p>`).join('')}</section>`);
    return s.join('');
  };

  X.open = (id) => {
    const d = document.getElementById('drawer'), body = document.getElementById('drawerBody');
    body.innerHTML = X.render();
    if (root.katex) body.querySelectorAll('[data-tex]').forEach((el) => { try { root.katex.render(el.dataset.tex, el, { displayMode: true, throwOnError: false }); } catch (e) { el.textContent = el.dataset.tex; } });
    else body.querySelectorAll('[data-tex]').forEach((el) => (el.textContent = el.dataset.tex));
    body.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); X.scrollTo(a.dataset.go); }));
    d.classList.add('open');
    if (id) setTimeout(() => X.scrollTo(id), 30);
  };
  X.scrollTo = (id) => {
    const el = document.getElementById(id); if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
  };
  X.close = () => document.getElementById('drawer').classList.remove('open');
  X.refreshIfOpen = () => { if (document.getElementById('drawer').classList.contains('open')) { const b = document.getElementById('drawerBody'); const top = b.scrollTop; X.open(); b.scrollTop = top; } };

  AA.explain = X;
})(window);

</script>
<script>/* js/ui/report.js */
/* Plain-English action reports for authorities (Met department, disaster management, district
   administration). Built only from the model outputs on screen; no text is invented by an AI.
   Skill: modes (reports) */
(function (root) {
  const AA = root.AA, M = AA.math, f = AA.fmt;
  const R = {};
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- plain-language helpers ----------
  const about = (n) => {
    if (!isFinite(n) || n <= 0) return 'none';
    if (n < 10) return String(Math.round(n * 10) / 10);
    const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(n)) - 1));
    return (Math.round(n / p) * p).toLocaleString('en-US');
  };
  const people = (n) => (n < 1 ? 'almost nobody' : `about ${about(n)} people`);
  const mins = (h) => { if (h < 1) return `${Math.max(5, Math.round(h * 60 / 5) * 5)} minutes`; const v = Math.round(h * 2) / 2; return `${v} hour${v === 1 ? '' : 's'}`; };
  const plural = (n, w, pl) => `${n} ${n === 1 ? w : (pl || w + 's')}`;
  const an = (w) => (/^[aeiou]/i.test(w) ? `an ${w}` : `a ${w}`);
  const list = (arr) => (arr.length <= 1 ? arr.join('') : `${arr.slice(0, -1).join(', ')} and ${arr[arr.length - 1]}`);
  const qty = (k, q) => {
    const c = AA.config.commodities.find((x) => x.key === k);
