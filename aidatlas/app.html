<script>/* js/data.js */
/* Data ingestion. Skill: skills/data-ingestion/SKILL.md
   All endpoints are free, keyless and CORS-enabled (verified 2026-10-01). */
(function (root) {
  const AA = root.AA, M = AA.math;
  const D = {};
  const cache = new Map();

  D.fetchJSON = async (url, { timeout = 15000, cacheTtl = 5 * 60e3, ...init } = {}) => {
    const key = url + (init.body || '');
    const hit = cache.get(key);
    if (hit && Date.now() - hit.t < cacheTtl) return hit.v;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(url, { ...init, signal: ctl.signal });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText} from ${new URL(url).host}`);
      if (r.headers && r.headers.get && r.headers.get('X-AidAtlas-Offline-Copy')) D.offlineCopy = true; // served by the service worker while offline
      const v = await r.json();
      cache.set(key, { t: Date.now(), v });
      return v;
    } finally { clearTimeout(timer); }
  };

  // ---------------- live hazards ----------------
  const GDACS = 'https://www.gdacs.org/gdacsapi/api/events/geteventlist';
  D.gdacsLive = async () => {
    const j = await D.fetchJSON(`${GDACS}/EVENTS4APP`, { cacheTtl: 60e3 });
    return (j.features || []).map((f) => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      return {
        src: 'GDACS', prov: 'live', id: `${p.eventtype}-${p.eventid}`, hazard: p.eventtype, lat, lon,
        name: p.name, country: p.country || (p.affectedcountries || []).map((c) => c.countryname).join(', ') || 'Offshore',
        iso2: (p.affectedcountries || [])[0]?.iso2 || '', alertscore: p.alertscore, alertlevel: p.alertlevel, episodealertscore: p.episodealertscore, episodealertlevel: p.episodealertlevel,
        severity: p.severitydata?.severity, severityUnit: p.severitydata?.severityunit, severityText: p.severitydata?.severitytext,
        from: p.fromdate, to: p.todate, current: p.iscurrent === 'true' || p.iscurrent === true,
        url: p.url?.report, eventid: p.eventid, episodeid: p.episodeid,
      };
    });
  };
  D.usgsLive = async () => {
    const j = await D.fetchJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson', { cacheTtl: 60e3 });
    return (j.features || []).map((f) => {
      const p = f.properties, [lon, lat, depth] = f.geometry.coordinates;
      return { src: 'USGS', prov: 'live', id: f.id, hazard: 'EQ', lat, lon, depth, magnitude: p.mag, mmi: p.mmi, pager: p.alert, tsunami: p.tsunami, name: p.title, country: (p.place || '').split(', ').pop(), from: new Date(p.time).toISOString(), to: new Date(p.time).toISOString(), current: true, url: p.url };
    });
  };
  const EONET_MAP = { severeStorms: 'TC', wildfires: 'WF', volcanoes: 'VO', floods: 'FL', earthquakes: 'EQ', drought: 'DR' };
  D.eonetLive = async () => {
    const j = await D.fetchJSON('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=20', { cacheTtl: 60e3 });
    return (j.events || []).map((e) => {
      const hz = EONET_MAP[e.categories?.[0]?.id]; if (!hz) return null;
      const g = e.geometry[e.geometry.length - 1];
      const c = g.type === 'Point' ? g.coordinates : g.coordinates[0][0];
      if (hz === 'WF' && /prescribed|\bRX\b/i.test(e.title)) return null; // planned burns are not disasters
      let sev = g.magnitudeValue, unit = g.magnitudeUnit;
      if (hz === 'TC' && unit === 'kts') { sev = sev * 1.852; unit = 'km/h'; }
      if (hz === 'WF' && /acre/i.test(unit || '')) { sev = sev * 0.4047; unit = 'ha'; }
      return { src: 'NASA EONET', prov: 'live', id: e.id, hazard: hz, lat: c[1], lon: c[0], name: e.title, country: '', severity: sev, severityUnit: unit, from: e.geometry[0].date, to: g.date, current: true, url: e.sources?.[0]?.url, alertscore: null };
    }).filter(Boolean);
  };

  /** Unified Severity Index (skill: modes). */
  D.usi = (e) => {
    const PAGER = { green: 0, yellow: 0.33, orange: 0.67, red: 1 };
    // agency alert: GDACS blends the event alert with the current episode (a decayed storm keeps its old Red),
    // USGS PAGER (absent = below alert threshold), EONET has no alert → small prior
    let A;
    if (e.alertscore != null) {
      const ev = M.clamp((e.alertscore - 1) / 2, 0, 1), ep = e.episodealertscore != null ? M.clamp((e.episodealertscore - 1) / 2, 0, 1) : ev;
      A = 0.3 * ev + 0.7 * ep;
    } else if (e.src === 'USGS') A = e.pager ? PAGER[e.pager] : 0;
    else A = 0.1;
    let m = 0;
    const s = e.severity;
    if (e.hazard === 'EQ') m = M.clamp(((e.magnitude ?? s) - 4) / 5, 0, 1);
    else if (e.hazard === 'TC') m = M.clamp((s || 0) / 300, 0, 1);
    else if (e.hazard === 'WF') m = M.clamp(Math.log10(Math.max(1, s || 1)) / 6, 0, 1);
    else if (e.hazard === 'DR') m = M.clamp(Math.log10(Math.max(1, s || 1)) / 6.5, 0, 1);
    else m = A;
    const h = AA.HAZARDS[e.hazard]?.lethal ?? 0.5;
    const usi = 0.5 * A + 0.35 * m + 0.15 * h;
    return { usi, A, m, h };
  };

  D.liveEvents = async () => {
    const [g, u, n] = await Promise.allSettled([D.gdacsLive(), D.usgsLive(), D.eonetLive()]);
    const gd = g.status === 'fulfilled' ? g.value : [];
    const us = u.status === 'fulfilled' ? u.value : [];
    const eo = n.status === 'fulfilled' ? n.value : [];
    const errors = [g, u, n].map((x, k) => (x.status === 'rejected' ? ['GDACS', 'USGS', 'EONET'][k] + ': ' + x.reason.message : null)).filter(Boolean);
    const now = Date.now();
    const age = (e) => (e.to ? now - new Date(e.to.endsWith('Z') ? e.to : e.to + 'Z').getTime() : 0);
    const recent = (e) => (e.current && age(e) < 14 * 864e5) || age(e) < 7 * 864e5; // GDACS marks long droughts not-current while still updating them
    let all = gd.filter(recent).map((e) => ({ ...e, magnitude: e.hazard === 'EQ' ? parseFloat(e.severity) : undefined }));
    us.forEach((q) => { // merge USGS detail into GDACS EQ, or add
      const twin = all.find((e) => e.hazard === 'EQ' && M.haversine(e, q) < 100 && Math.abs(new Date(e.from + (e.from.endsWith('Z') ? '' : 'Z')) - new Date(q.from)) < 2 * 36e5);
      if (twin) Object.assign(twin, { magnitude: q.magnitude, depth: q.depth, mmi: q.mmi, pager: q.pager, usgsUrl: q.url, src: 'GDACS + USGS' });
      else all.push(q);
    });
    eo.forEach((e) => { if (!all.some((x) => x.hazard === e.hazard && M.haversine(x, e) < 150)) all.push(e); });
    all.forEach((e) => Object.assign(e, D.usi(e)));
    all.sort((a, b) => b.usi - a.usi || new Date(b.to) - new Date(a.to));
    return { events: all, errors, counts: { gdacs: gd.length, usgs: us.length, eonet: eo.length } };
  };

  /** Agency-reported human impact for a GDACS event (Sendai-framework entries in geteventdata).
   *  Each entry is a running total for one place and one kind, so take the maximum per (kind, place, wording)
   *  and add across places. "Out of contact" / "missing" count as missing; "evacuated" as displaced. */
  D.parseSendai = (list) => {
    const best = new Map();
    (list || []).forEach((x) => {
      const v = parseFloat(String(x.sendaivalue).replace(/[^0-9.]/g, '')); if (!(v > 0)) return;
      const name = (x.sendainame || '').toLowerCase(), desc = (x.description || '').toLowerCase();
      if (!/\[people\]|people|persons/.test(desc) && !/death|injur|missing|displac|affect|evacu/.test(name)) return;
      let kind = null;
      if (/death|dead|fatalit|killed/.test(name + ' ' + desc)) kind = 'deaths';
      else if (/missing|out of contact/.test(name + ' ' + desc)) kind = 'missing';
      else if (/injur/.test(name)) kind = 'injured';
      else if (/displac|evacu|homeless|shelter/.test(name + ' ' + desc)) kind = 'displaced';
      else if (/affect/.test(name)) kind = 'affected';
      if (!kind) return;
      const wording = desc.replace(/^[\d,.\s]+/, '').replace(/\s+in\s+.*$/, '');
      const key = [kind, x.country, x.region, wording].join('|');
      best.set(key, Math.max(best.get(key) || 0, v));
    });
    const out = { deaths: 0, missing: 0, injured: 0, displaced: 0, affected: 0 };
    best.forEach((v, key) => (out[key.split('|')[0]] += v));
    const dates = (list || []).map((x) => x.dateinsert).filter(Boolean).sort();
    out.asOf = dates.length ? dates[dates.length - 1].slice(0, 10) : null;
    return out.deaths + out.missing + out.injured + out.displaced + out.affected > 0 ? out : null;
  };
  D.gdacsImpacts = async (type, id) => {
    const j = await D.fetchJSON(`https://www.gdacs.org/gdacsapi/api/events/geteventdata?eventtype=${type}&eventid=${id}`, { timeout: 15000, cacheTtl: 30 * 60e3 });
    const r = D.parseSendai(j?.properties?.sendai);
    if (r) { r.source = 'GDACS (Sendai impact reports)'; r.url = j?.properties?.url?.report; }
    return r;
  };
  /** Terrain relief (m) within ~20 km: max − min of a 5×5 elevation grid (Open-Meteo, Copernicus DEM). */
  D.relief = async (c) => {
    const la = [], lo = [];
    for (let i = -2; i <= 2; i++) for (let k = -2; k <= 2; k++) { la.push((c.lat + i * 0.09).toFixed(3)); lo.push((c.lon + k * 0.1).toFixed(3)); }
    const j = await D.elevation(la, lo);
    const e = (j.elevation || []).filter((x) => x != null && x > -100);
    return e.length ? Math.max(...e) - Math.min(...e) : null;
  };

  /** GDACS event outline (MultiPolygon/Polygon features only) → array of polygons in GeoJSON order. */
  D.gdacsGeometry = async (type, id, episode = 1) => {
    const j = await D.fetchJSON(`https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=${type}&eventid=${id}&episodeid=${episode || 1}`, { timeout: 20000, cacheTtl: 30 * 60e3 });
    const polys = [];
    (j.features || []).forEach((f) => {
      const g = f.geometry || {};
      if (g.type === 'Polygon') polys.push(g.coordinates);
      else if (g.type === 'MultiPolygon') g.coordinates.forEach((p) => polys.push(p));
    });
    return polys.length ? polys : null;
  };

  /** River-flow ratio at many points (GloFAS via Open-Meteo): max daily discharge in the last 7 days + next 7 days
   *  ÷ median daily discharge over the previous 365 days. ratio ≥ 2 ≈ out-of-bank flow. */
  D.flowRatios = async (pts) => {
    if (!pts.length) return [];
    const day = (d) => d.toISOString().slice(0, 10), now = new Date();
    const start = day(new Date(now - 372 * 864e5)), end = day(new Date(+now + 7 * 864e5));
    const j = await D.fetchJSON(`https://flood-api.open-meteo.com/v1/flood?latitude=${pts.map((p) => p.lat.toFixed(3)).join(',')}&longitude=${pts.map((p) => p.lon.toFixed(3)).join(',')}&daily=river_discharge&start_date=${start}&end_date=${end}`, { timeout: 40000, cacheTtl: 30 * 60e3 });
    const arr = Array.isArray(j) ? j : [j];
    return arr.map((loc) => D.flowRatio(loc?.daily?.time || [], loc?.daily?.river_discharge || [], day(new Date(now - 7 * 864e5))));
  };
  D.flowRatio = (time, q, recentFrom) => {
    const past = [], recent = [];
    time.forEach((t, i) => { const v = q[i]; if (v == null || !(v >= 0)) return; (t >= recentFrom ? recent : past).push(v); });
    if (past.length < 60 || !recent.length) return null;
    const med = M.quantile(past, 0.5);
    if (!(med > 0.5)) return null; // dry channel or no river at this cell: ratio meaningless
    return { ratio: Math.max(...recent) / med, median: med, peak: Math.max(...recent) };
  };

  /** WorldPop 2020 population inside a polygon ring (sync call; falls back to polling the task). */
  D.worldpop = async (ring, year = 2020) => {
    const gj = JSON.stringify({ type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [ring] } }] });
    const base = 'https://api.worldpop.org/v1';
    let j = await D.fetchJSON(`${base}/services/stats?dataset=wpgppop&year=${year}&geojson=${encodeURIComponent(gj)}&runasync=false`, { timeout: 35000, cacheTtl: 864e5 });
    for (let k = 0; k < 6 && j && j.status !== 'finished' && j.taskid; k++) {
      await new Promise((r) => setTimeout(r, 2500));
      j = await D.fetchJSON(`${base}/tasks/${j.taskid}`, { timeout: 15000, cacheTtl: 0 });
    }
    const v = j?.data?.total_population;
    if (!(v >= 0)) throw new Error('WorldPop: no result');
    return v;
  };

  /** USGS PAGER loss estimate for an earthquake: fatality probability bins, median fatalities, population exposure by MMI. */
  D.pagerLosses = async (usgsId) => {
    const det = await D.fetchJSON(`https://earthquake.usgs.gov/earthquakes/feed/v1.0/detail/${usgsId}.geojson`, { timeout: 20000, cacheTtl: 30 * 60e3 });
    const pr = det?.properties?.products?.losspager?.[0];
    const c = pr?.contents || {};
    const url = (k) => c[k]?.url;
    if (!url('json/alerts.json')) return null;
    const [al, lo, ex] = await Promise.allSettled([D.fetchJSON(url('json/alerts.json'), { timeout: 20000 }), url('json/losses.json') ? D.fetchJSON(url('json/losses.json'), { timeout: 20000 }) : null, url('json/exposures.json') ? D.fetchJSON(url('json/exposures.json'), { timeout: 20000 }) : null]);
    const fat = al.status === 'fulfilled' ? al.value?.fatality : null;
    if (!fat?.bins) return null;
    const out = { level: fat.level, bins: fat.bins.map((b) => ({ min: +b.min, max: +b.max, p: +b.probability })), source: 'USGS PAGER', url: det?.properties?.url ? det.properties.url + '/pager' : null };
    if (lo.status === 'fulfilled' && lo.value?.empirical_fatality) out.median = +lo.value.empirical_fatality.total_fatalities;
    const pe = ex.status === 'fulfilled' ? ex.value?.population_exposure : null;
    if (pe?.mmi && pe?.aggregated_exposure) out.exposure = pe.mmi.map((m, i) => ({ mmi: +m, pop: +pe.aggregated_exposure[i] || 0 }));
    return out;
  };
  /** USGS event id from a USGS event page URL or id. */
  D.usgsIdOf = (e) => (e?.src === 'USGS' && e.id) || (/eventpage\/([a-z0-9]+)/i.exec(e?.usgsUrl || e?.url || '') || [])[1] || null;

  /** Text fetch (CSV inventories, published Google Sheets). */
  D.fetchText = async (url, timeout = 20000) => {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
    try { const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); if (!r.ok) throw new Error(`${r.status} from ${new URL(url).host}`); return await r.text(); }
    finally { clearTimeout(t); }
  };
  /** Turn a Google Sheets link into its CSV export link (sheet must be shared "anyone with the link" or published). */
  D.sheetCsvUrl = (u) => {
    const m = /docs\.google\.com\/spreadsheets\/d\/(e\/)?([\w-]+)/.exec(u || ''); if (!m) return u;
    if (m[1]) return /output=csv/.test(u) ? u : `https://docs.google.com/spreadsheets/d/e/${m[2]}/pub?output=csv`;
    const gid = (/[#&?]gid=(\d+)/.exec(u) || [])[1];
    return `https://docs.google.com/spreadsheets/d/${m[2]}/export?format=csv${gid ? `&gid=${gid}` : ''}`;
  };

  // ---------------- history ----------------
  D.usgsHistory = async (lat, lon, radiusKm = 300, minMag = 5.5, start = '1900-01-01') => {
    const j = await D.fetchJSON(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=${lat}&longitude=${lon}&maxradiuskm=${radiusKm}&minmagnitude=${minMag}&starttime=${start}&orderby=time&limit=200`, { timeout: 25000 });
    return (j.features || []).map((f) => ({ src: 'USGS', prov: 'historical', id: f.id, hazard: 'EQ', lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], depth: f.geometry.coordinates[2], magnitude: f.properties.mag, mmi: f.properties.mmi, pager: f.properties.alert, name: f.properties.title, from: new Date(f.properties.time).toISOString(), url: f.properties.url }));
  };
  D.gdacsHistory = async (country, from = '2000-01-01') => {
    const to = new Date().toISOString().slice(0, 10);
    const j = await D.fetchJSON(`${GDACS}/SEARCH?eventlist=EQ;TC;FL;VO;DR;WF&fromDate=${from}&toDate=${to}&alertlevel=Orange;Red&country=${encodeURIComponent(country)}`, { timeout: 25000 });
    return (j.features || []).map((f) => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      return { src: 'GDACS', prov: 'historical', id: `${p.eventtype}-${p.eventid}`, hazard: p.eventtype, lat, lon, name: p.name, country: p.country, alertscore: p.alertscore, alertlevel: p.alertlevel, severity: p.severitydata?.severity, severityUnit: p.severitydata?.severityunit, from: p.fromdate, to: p.todate, url: p.url?.report, magnitude: p.eventtype === 'EQ' ? p.severitydata?.severity : undefined };
    });
  };
  D.eonetHistory = async (bbox, start = '2000-01-01') => {
    const [w, s, e, n] = bbox; // minLon,minLat,maxLon,maxLat
    const j = await D.fetchJSON(`https://eonet.gsfc.nasa.gov/api/v3/events?status=all&bbox=${w},${n},${e},${s}&start=${start}&limit=300`, { timeout: 30000 });
    return (j.events || []).map((ev) => {
      const hz = EONET_MAP[ev.categories?.[0]?.id]; if (!hz) return null;
      const g = ev.geometry[0]; const c = g.type === 'Point' ? g.coordinates : g.coordinates[0][0];
      let sev = g.magnitudeValue; if (hz === 'TC' && g.magnitudeUnit === 'kts') sev *= 1.852;
      return { src: 'NASA EONET', prov: 'historical', id: ev.id, hazard: hz, lat: c[1], lon: c[0], name: ev.title, severity: sev, severityUnit: g.magnitudeUnit, from: g.date, url: ev.sources?.[0]?.url };
    }).filter(Boolean);
  };

  // ---------------- geocoding (Nominatim, ≤ 1 req/s) ----------------
  let lastNom = 0;
  const nomThrottle = async () => { const w = 1100 - (Date.now() - lastNom); if (w > 0) await new Promise((r) => setTimeout(r, w)); lastNom = Date.now(); };
  D.geocode = async (q) => {
    await nomThrottle();
    const j = await D.fetchJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1`, { cacheTtl: 36e5 });
    return j.map((r) => ({ name: r.display_name, short: r.name || r.display_name.split(',')[0], lat: +r.lat, lon: +r.lon, country: r.address?.country, iso2: (r.address?.country_code || '').toUpperCase(), bbox: r.boundingbox?.map(Number) }));
  };
  D.reverse = async (lat, lon) => {
    await nomThrottle();
    const r = await D.fetchJSON(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=10&addressdetails=1`, { cacheTtl: 36e5 });
    return { name: r.display_name || `${lat.toFixed(3)}, ${lon.toFixed(3)}`, short: r.address?.city || r.address?.town || r.address?.county || r.address?.state || r.name || 'Selected point', country: r.address?.country || '', iso2: (r.address?.country_code || '').toUpperCase() };
  };

  /** Street-level reverse geocode (Nominatim, throttled to 1 request/s, cached).
   *  Returns { locality, area, road, city, address } — locality = the neighbourhood/sector/village name. */
  D.reverseDetail = async (lat, lon, zoom = 18) => {
    await nomThrottle();
    const r = await D.fetchJSON(`https://nominatim.openstreetmap.org/reverse?lat=${(+lat).toFixed(5)}&lon=${(+lon).toFixed(5)}&format=json&zoom=${zoom}&addressdetails=1&accept-language=en`, { cacheTtl: 864e5, timeout: 12000 });
    return D.parseReverse(r);
  };
  D.parseReverse = (r) => {
    const a = r?.address || {};
    const locality = a.neighbourhood || a.quarter || a.suburb || a.residential || a.village || a.hamlet || a.city_district || a.town || a.city || '';
    const area = a.suburb && a.suburb !== locality ? a.suburb : a.city_district && a.city_district !== locality ? a.city_district : '';
    const city = a.city || a.town || a.county || a.state_district || '';
    const road = [a.house_number, a.road || a.pedestrian || a.footway].filter(Boolean).join(' ');
    const named = a.amenity || a.building || a.shop || a.office || '';
    const address = [named, road, locality, area, city !== locality ? city : '', a.postcode].filter(Boolean).filter((x, i, arr) => arr.indexOf(x) === i).join(', ');
    return { locality, area, road, city, postcode: a.postcode || '', address: address || r?.display_name || '' };
  };

  // ---------------- OSM Overpass (raced mirrors) ----------------
  const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
  D.overpass = async (ql, timeout = 30000) => {
    const key = 'ovp:' + ql; const hit = cache.get(key); if (hit) return hit.v;
    const body = 'data=' + encodeURIComponent(ql);
    const v = await Promise.any(OVERPASS.map((u) => D.fetchJSON(u, { method: 'POST', body, headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, timeout, cacheTtl: 0 }).then((j) => { if (!j.elements) throw new Error('bad'); return j; })));
    cache.set(key, { t: Date.now(), v }); return v;
  };
  const bboxOf = (c, km) => { const dLat = km / 110.57, dLon = km / (111.32 * Math.cos(M.toRad(c.lat))); return [c.lat - dLat, c.lon - dLon, c.lat + dLat, c.lon + dLon]; };
  D.bboxOf = bboxOf;
  /** Populated places: cities and towns across the whole impact radius, plus the named sectors, suburbs,
   *  neighbourhoods and villages in the core (≤ 35 km), so a city is planned by its real localities
   *  (e.g. "Sector 29", "DLF Phase 3") instead of anonymous compass sectors. */
  D.places = async (c, km) => {
    const b = bboxOf(c, km).join(','), core = bboxOf(c, Math.min(km, 35)).join(',');
    const j = await D.overpass(`[out:json][timeout:25];(node["place"~"^(city|town)$"](${b});node["place"~"^(suburb|quarter|neighbourhood|village)$"](${core}););out 600;`);
    return j.elements.filter((e) => e.tags && (e.tags.name || e.tags['name:en'])).map((e) => ({
      name: D.placeName(e.tags), lat: e.lat, lon: e.lon, type: e.tags.place,
      population: parseInt(String(e.tags.population || '').replace(/[^0-9]/g, ''), 10) || 0,
      parent: e.tags['is_in:city'] || e.tags['addr:city'] || '', src: 'OSM',
    }));
  };
  /** English name where OSM has one (Devanagari-only names are hard to act on for many responders). */
  D.placeName = (t) => {
    const n = t.name || '', en = t['name:en'] || '';
    return en && /[^\u0000-\u024f]/.test(n) ? `${en} (${n})` : n || en || 'Unnamed';
  };
  /** Postal-style address from OSM addr:* tags, or '' when the object has none. */
  D.addressOf = (t = {}) => {
    if (t['addr:full']) return t['addr:full'];
    const street = [t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' ');
    const parts = [street || t['addr:place'], t['addr:suburb'] || t['addr:neighbourhood'], t['addr:city'] || t['addr:district'], t['addr:postcode']].filter(Boolean);
    return parts.length >= 2 ? parts.join(', ') : '';
  };
  /** Google Maps link for a point (opens directions on phones). */
  D.mapsUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${(+p.lat).toFixed(6)},${(+p.lon).toFixed(6)}`;
  /** Fallback facility search via Nominatim (bounded viewbox), used when Overpass is slow or down. */
  D.facilitiesNominatim = async (c, km) => {
    const [s, w, n, e] = bboxOf(c, km);
    const kinds = [['hospital', 'hospital'], ['fire station', 'fire_station'], ['police', 'police'], ['warehouse', 'warehouse']];
    const out = [];
    for (const [q, type] of kinds) {
      await nomThrottle();
      try {
        const j = await D.fetchJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=25&bounded=1&viewbox=${w},${n},${e},${s}`, { cacheTtl: 36e5, timeout: 12000 });
        j.forEach((r) => out.push({ name: r.name || r.display_name.split(',')[0], type, lat: +r.lat, lon: +r.lon, beds: 0, address: r.display_name.split(',').slice(1, 5).join(',').trim(), src: 'OSM (Nominatim)', osm: `${r.osm_type}/${r.osm_id}` }));
      } catch (err) { /* keep what we have */ }
    }
    return out;
  };
  D.facilitiesAny = async (c, km) => {
    try { const f = await D.facilities(c, km, 20000); if (f.length) return f; } catch (e) { /* fall through */ }
    return D.facilitiesNominatim(c, km);
  };
  D.facilities = async (c, km, timeout = 30000) => {
    const b = bboxOf(c, km).join(',');
    const q = `[out:json][timeout:25];(nwr["amenity"~"^(hospital|fire_station|police)$"](${b});nwr["building"="warehouse"]["name"](${b});nwr["industrial"="warehouse"](${b});nwr["shop"="wholesale"](${b}););out center 300;`;
    const j = await D.overpass(q, timeout);
    return j.elements.map((e) => {
      const lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon; if (lat == null) return null;
      const t = e.tags || {};
      const type = t.amenity === 'hospital' ? 'hospital' : t.amenity === 'fire_station' ? 'fire_station' : t.amenity === 'police' ? 'police' : 'warehouse';
      return { name: (t.name || t['name:en']) ? D.placeName(t) : '', type, lat, lon, beds: parseInt(t.beds, 10) || 0, address: D.addressOf(t), src: 'OSM', osm: `${e.type}/${e.id}` };
    }).filter(Boolean);
  };

  // ---------------- OSRM ----------------
  const OSRM = 'https://router.project-osrm.org';
  const pts = (ps) => ps.map((p) => `${p.lon.toFixed(5)},${p.lat.toFixed(5)}`).join(';');
  D.osrmTable = async (points) => {
    const j = await D.fetchJSON(`${OSRM}/table/v1/driving/${pts(points)}?annotations=duration,distance`, { timeout: 20000, cacheTtl: 10 * 60e3 });
    if (j.code !== 'Ok') throw new Error('OSRM table: ' + j.code);
    return { dur: j.durations, dist: j.distances, snapped: j.sources.map((s) => ({ lat: s.location[1], lon: s.location[0], offKm: s.distance / 1000 })) };
  };
  let osrmQueue = Promise.resolve();
  D.osrmRoute = (points) => { // serialised, ≥ 250 ms apart, to respect the public demo server
    const run = async () => {
      const alt = points.length === 2 ? '&alternatives=2' : '';
      const j = await D.fetchJSON(`${OSRM}/route/v1/driving/${pts(points)}?overview=full&geometries=geojson${alt}`, { timeout: 20000, cacheTtl: 10 * 60e3 });
      if (j.code !== 'Ok') throw new Error('OSRM route: ' + j.code);
      return j.routes;
    };
    const p = osrmQueue.then(() => new Promise((r) => setTimeout(r, 250))).then(run);
    osrmQueue = p.catch(() => {});
    return p;
  };
  D.osrmNearest = async (p) => {
    const j = await D.fetchJSON(`${OSRM}/nearest/v1/driving/${p.lon.toFixed(5)},${p.lat.toFixed(5)}?number=1`, { timeout: 10000, cacheTtl: 36e5 });
    const w = j.waypoints?.[0]; if (!w) return null;
    return { lat: w.location[1], lon: w.location[0], offKm: w.distance / 1000 };
  };

  // ---------------- weather, floods, elevation ----------------
  D.forecast = (lat, lon) => D.fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum,wind_gusts_10m_max&forecast_days=7&timezone=auto`, { cacheTtl: 30 * 60e3 });
  D.floodSeries = (lats, lons, start, end) => D.fetchJSON(`https://flood-api.open-meteo.com/v1/flood?latitude=${lats.join(',')}&longitude=${lons.join(',')}&daily=river_discharge&start_date=${start}&end_date=${end}`, { timeout: 40000, cacheTtl: 36e5 });
  D.floodNow = (lat, lon) => D.fetchJSON(`https://flood-api.open-meteo.com/v1/flood?latitude=${lat}&longitude=${lon}&daily=river_discharge,river_discharge_median,river_discharge_max&past_days=3&forecast_days=7`, { cacheTtl: 30 * 60e3 });
  D.elevation = (lats, lons) => D.fetchJSON(`https://api.open-meteo.com/v1/elevation?latitude=${lats.join(',')}&longitude=${lons.join(',')}`, { cacheTtl: 36e5 });

  // ---------------- socio-economic (World Bank) ----------------
  D.countryIndex = async (iso2) => {
    const out = { beds: null, gdppc: null, vul: 0.5, lcc: 0.5, prov: 'assumed' };
    if (!iso2) return out;
    try {
      const get = async (ind) => { const j = await D.fetchJSON(`https://api.worldbank.org/v2/country/${iso2}/indicator/${ind}?format=json&mrnev=1`, { cacheTtl: 864e5 }); return j?.[1]?.[0]?.value ?? null; };
      const [beds, gdppc] = await Promise.all([get('SH.MED.BEDS.ZS'), get('NY.GDP.PCAP.CD')]);
      out.beds = beds; out.gdppc = gdppc;
      const gN = gdppc ? M.clamp((Math.log10(gdppc) - 2.6) / 2.4, 0, 1) : 0.5;
      const bN = beds != null ? M.clamp(beds / 8, 0, 1) : 0.5;
      out.vul = M.clamp(0.5 * (1 - gN) + 0.5 * (1 - bN), 0.05, 0.95);
      out.lcc = M.clamp(1 - bN, 0.05, 0.95);
      out.prov = 'World Bank';
    } catch (e) { /* keep defaults */ }
    return out;
  };

  AA.data = D;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/workspace.js */
/* Workspace: people, roles, saved plans, watch areas, inventory sources. Skill: skills/workspace/SKILL.md
   Works fully in the browser (localStorage). When a Supabase project is configured in Settings, the same calls
   go to the shared team database instead (js/cloud.js), where row-level security enforces the roles. */
(function (root) {
  const AA = root.AA, M = AA.math;
  const W = {};
  const LS = (() => { try { const k = '__aa'; root.localStorage.setItem(k, '1'); root.localStorage.removeItem(k); return root.localStorage; } catch (e) { const m = new Map(); return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; } })();
  W._ls = LS;
  const get = (k, d) => { try { const v = LS.getItem('aa.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const set = (k, v) => { try { LS.setItem('aa.' + k, JSON.stringify(v)); } catch (e) { /* quota: ignore */ } };
  W.get = get; W.set = set;

  // ---------------- roles ----------------
  /** viewer: read plans and reports · planner: also change and save plans, manage watch areas · admin: also team and settings
   *  field: field-app teams, send field reports (and read plans) */
  W.ROLES = {
    viewer: { label: 'Viewer', can: ['view', 'report'] },
    planner: { label: 'Planner', can: ['view', 'report', 'edit', 'save', 'watch', 'inventory', 'field'] },
    admin: { label: 'Admin', can: ['view', 'report', 'edit', 'save', 'watch', 'inventory', 'team', 'settings', 'field'] },
    field: { label: 'Field team', can: ['view', 'report', 'field'] },
  };
  const DEFAULT_ME = { name: 'Local user', email: '', org: '', role: 'planner' };
  W.me = () => (W.cloud?.user ? { ...W.cloud.user } : { ...DEFAULT_ME, ...get('me', {}) });
  W.setMe = (p) => { const cur = get('me', {}); set('me', { ...cur, ...p, role: W.ROLES[p.role || cur.role] ? p.role || cur.role : 'planner' }); emit('me'); };
  W.can = (action) => (W.ROLES[W.me().role] || W.ROLES.viewer).can.includes(action);
  W.mode = () => (W.cloud?.ready ? 'cloud' : 'local');

  // local team list (who is involved; real access control needs the cloud back end)
  W.team = () => get('team', []);
  W.setTeam = (list) => { if (!W.can('team')) throw new Error('Only an admin can change the team.'); set('team', list.filter((x) => x && x.name).map((x) => ({ name: String(x.name).slice(0, 80), email: String(x.email || '').slice(0, 120), role: W.ROLES[x.role] ? x.role : 'viewer' }))); emit('team'); };

  const listeners = new Set();
  W.on = (fn) => listeners.add(fn);
  const emit = (type, data) => listeners.forEach((fn) => { try { fn(type, data); } catch (e) { console.error(e); } });
  W._emit = emit;

  // ---------------- saved plans ----------------
  const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  W.plans = {
    async list() {
      if (W.mode() === 'cloud') return W.cloud.listPlans();
      return get('plans', []).map(({ id, name, savedAt, savedBy, summary }) => ({ id, name, savedAt, savedBy, summary })).sort((a, b) => (b.savedAt > a.savedAt ? 1 : -1));
    },
    async save(snap, id) {
      if (!W.can('save')) throw new Error(`Your role (${W.me().role}) cannot save plans.`);
      if (W.mode() === 'cloud') {
        try { return await W.cloud.savePlan(snap, id); }
        catch (e) { if (typeof navigator === 'undefined' || navigator.onLine !== false) throw e; // offline: keep it here, share it when back online
          const pend = get('pendingCloud', []); const pid = id || uid(); set('pendingCloud', [...pend.filter((p) => p.id !== pid), { ...snap, id: pid, cloudId: id || null }]); emit('plans'); return pid; }
      }
      const all = get('plans', []);
      const rec = { ...snap, id: id || uid() };
      const i = all.findIndex((p) => p.id === rec.id);
      if (i >= 0) { rec.versions = [...(all[i].versions || []), { savedAt: all[i].savedAt, savedBy: all[i].savedBy, summary: all[i].summary }].slice(-20); all[i] = rec; } else all.push(rec);
      set('plans', all.slice(-50));
      if (JSON.stringify(get('plans', [])).length < 10) throw new Error('Browser storage is full or blocked; use “Download plan file” instead.');
      emit('plans');
      return rec.id;
    },
    /** Plans saved while offline in the shared workspace: upload them now. Returns how many were sent. */
    async syncPending() {
      const pend = get('pendingCloud', []); if (!pend.length || W.mode() !== 'cloud') return 0;
      let n = 0; const left = [];
      for (const p of pend) { try { const { id, cloudId, ...snap } = p; await W.cloud.savePlan(snap, cloudId); n++; } catch (e) { left.push(p); } }
      set('pendingCloud', left); if (n) emit('plans'); return n;
    },
    pending: () => get('pendingCloud', []).length,
    async load(id) { if (W.mode() === 'cloud') return W.cloud.loadPlan(id); const p = get('plans', []).find((x) => x.id === id); if (!p) throw new Error('Plan not found'); return p; },
    async remove(id) { if (!W.can('save')) throw new Error('Your role cannot delete plans.'); if (W.mode() === 'cloud') return W.cloud.deletePlan(id); set('plans', get('plans', []).filter((p) => p.id !== id)); emit('plans'); },
  };

  /** Decision log → CSV (one row per decision). */
  W.decisionsCSV = (decisions) => {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    return ['time,plan_hour,by,role,action,what_changed,note', ...(decisions || []).map((d) => [d.at, `T+${(d.epoch || 0) * AA.config.epochHours}h`, d.by, d.role, d.type, d.reason, d.note].map(q).join(','))].join('\n');
  };

  // ---------------- watch areas ----------------
  const ALERT_RANK = { Green: 1, Orange: 2, Red: 3 };
  W.watch = {
    async list() { if (W.mode() === 'cloud') return W.cloud.listWatch(); return get('watch', []); },
    async add(a) {
      if (!W.can('watch')) throw new Error(`Your role (${W.me().role}) cannot add watch areas.`);
      const area = { id: uid(), name: String(a.name || 'Watch area').slice(0, 80), lat: +a.lat, lon: +a.lon, radiusKm: M.clamp(+a.radiusKm || 100, 5, 1000), hazards: (a.hazards && a.hazards.length ? a.hazards : ['EQ', 'TC', 'FL', 'VO', 'DR', 'WF']), minLevel: ALERT_RANK[a.minLevel] ? a.minLevel : 'Orange', email: String(a.email || '').slice(0, 120) };
      if (!isFinite(area.lat) || !isFinite(area.lon)) throw new Error('Watch area needs a location');
      if (W.mode() === 'cloud') return W.cloud.addWatch(area);
      set('watch', [...get('watch', []), area]); emit('watch'); return area.id;
    },
    async remove(id) { if (W.mode() === 'cloud') return W.cloud.deleteWatch(id); set('watch', get('watch', []).filter((a) => a.id !== id)); emit('watch'); },
  };
  /** Level of a live event on the GDACS scale; USGS PAGER and severity mapped onto it. */
  W.eventLevel = (e) => {
    // GDACS: the current episode's level (a decayed storm keeps its old event-level Red)
    if (e.alertlevel && ALERT_RANK[e.alertlevel]) return ALERT_RANK[e.episodealertlevel] ? e.episodealertlevel : e.alertlevel;
    if (e.pager) return { green: 'Green', yellow: 'Orange', orange: 'Red', red: 'Red' }[e.pager] || 'Green';
    if (e.hazard === 'EQ' && (e.magnitude ?? 0) >= 6.5) return 'Orange';
    return 'Green';
  };
  /** Which events fall inside which watch areas at or above the area's minimum level. Pure function (also used by tools/watch-alerts.js). */
  W.matchWatch = (areas, events) => {
    const out = [];
    (areas || []).forEach((a) => (events || []).forEach((e) => {
      if (!a.hazards.includes(e.hazard)) return;
      const lvl = W.eventLevel(e);
      if (ALERT_RANK[lvl] < ALERT_RANK[a.minLevel]) return;
      const d = M.haversine(a, e);
      if (d <= a.radiusKm) out.push({ area: a, event: e, level: lvl, distKm: d, key: `${a.id}|${e.id}|${lvl}` });
    }));
    return out.sort((x, y) => ALERT_RANK[y.level] - ALERT_RANK[x.level] || x.distKm - y.distKm);
  };
  /** Matches not yet seen on this device (so a notification fires once per event and level). */
  W.newMatches = (matches) => {
    const seen = new Set(get('seenAlerts', []));
    const fresh = matches.filter((m) => !seen.has(m.key));
    set('seenAlerts', [...seen, ...fresh.map((m) => m.key)].slice(-500));
    return fresh;
  };

  // ---------------- inventory source (Google Sheet / CSV / JSON URL) ----------------
  W.inventory = {
    source: () => get('invSource', null),
    setSource: (src) => { if (src && !W.can('inventory')) throw new Error('Your role cannot change the inventory source.'); set('invSource', src); emit('inventory'); },
    /** Fetch and parse rows: CSV (Google Sheets export or any CSV) or JSON (array of rows, or {stores:[...]}). */
    async fetchRows(url) {
      const u = AA.data.sheetCsvUrl(url);
      const text = await AA.data.fetchText(u);
      const t = text.trim();
      let rows;
      if (t.startsWith('[') || t.startsWith('{')) { const j = JSON.parse(t); rows = Array.isArray(j) ? j : j.stores || j.rows || j.data || []; }
      else rows = W.parseCSV(t);
      return W.normaliseRows(rows);
    },
  };
  /** CSV parser with quoted fields. */
  W.parseCSV = (text) => {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim().toLowerCase());
    return rows.filter((r) => r.some((x) => x.trim() !== '')).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
  };
  /** Accept common column spellings so a team's own sheet works without renaming everything. */
  const ALIASES = { name: ['name', 'store', 'depot', 'site'], lat: ['lat', 'latitude', 'y'], lon: ['lon', 'lng', 'long', 'longitude', 'x'], type: ['type', 'kind'], water_l: ['water_l', 'water_litres', 'water_liters', 'water'], food_kg: ['food_kg', 'food'], tents: ['tents', 'shelter', 'tent'], medkits: ['medkits', 'medical', 'medical_kits', 'med_kits'], staff: ['staff', 'personnel', 'workers'], trucks: ['trucks', 'truck'], buses: ['buses', 'bus'], ambulances: ['ambulances', 'ambulance'], beds: ['beds'], address: ['address', 'location', 'addr'] };
  W.normaliseRows = (rows) => (rows || []).map((r) => {
    const low = Object.fromEntries(Object.entries(r).map(([k, v]) => [String(k).trim().toLowerCase().replace(/\s+/g, '_'), v]));
    const o = {};
    Object.entries(ALIASES).forEach(([k, al]) => { const hit = al.find((a) => low[a] !== undefined && low[a] !== ''); if (hit !== undefined) o[k] = k === 'name' || k === 'type' || k === 'address' ? String(low[hit]) : +String(low[hit]).replace(/[, ]/g, ''); });
    return o;
  }).filter((r) => isFinite(r.lat) && isFinite(r.lon) && Math.abs(r.lat) <= 90 && Math.abs(r.lon) <= 180);

  AA.workspace = W;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/cloud.js */
/* Optional shared back end (Supabase): sign-in by e-mailed code, teams, roles enforced by row-level security,
   shared saved plans and watch areas. Off until an admin enters the project URL and public (anon) key in Settings.
   Database set-up: supabase/schema.sql. Skill: skills/workspace/SKILL.md */
(function (root) {
  const AA = root.AA;
  const W = AA.workspace;
  const C = { ready: false, user: null, team: null, teams: [], client: null };
  const LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';

  const loadLib = () => new Promise((res, rej) => {
    if (root.supabase?.createClient) return res(root.supabase);
    const s = document.createElement('script'); s.src = LIB; s.async = true;
    s.onload = () => (root.supabase?.createClient ? res(root.supabase) : rej(new Error('Supabase library did not load')));
    s.onerror = () => rej(new Error('Could not load the Supabase library (network blocked?)'));
    document.head.appendChild(s);
  });
  const must = ({ data, error }) => { if (error) throw new Error(error.message || String(error)); return data; };

  C.config = () => W.get('cloud', null);
  /** Connect with { url, key }. `client` may be injected (tests). Returns true when a session exists. */
  C.init = async (cfg = C.config(), client = null) => {
    C.ready = false; C.user = null;
    if (!cfg?.url || !cfg?.key) return false;
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(cfg.url) && !client) throw new Error('Project URL should look like https://xxxx.supabase.co');
    C.client = client || (await loadLib()).createClient(cfg.url.replace(/\/$/, ''), cfg.key, { auth: { persistSession: true, storageKey: 'aa.sb' } });
    const sess = must(await C.client.auth.getSession());
    if (!sess?.session) { W._emit('cloud'); return false; }
    await C._afterLogin(sess.session.user);
    return true;
  };
  C.configure = async (cfg) => { W.set('cloud', cfg && cfg.url ? { url: cfg.url.trim(), key: cfg.key.trim() } : null); return C.init(); };

  /** Step 1: send a 6-digit code (works from file:// pages too, unlike magic links). */
  C.sendCode = async (email) => { must(await C.client.auth.signInWithOtp({ email, options: { shouldCreateUser: true } })); };
  /** Step 2: verify the code, claim any team invites for this e-mail, load teams. */
  C.verifyCode = async (email, token) => { const d = must(await C.client.auth.verifyOtp({ email, token: String(token).trim(), type: 'email' })); await C._afterLogin(d.user); };
  C.signOut = async () => { try { await C.client.auth.signOut(); } catch (e) { /* ignore */ } C.ready = false; C.user = null; C.team = null; W._emit('cloud'); W._emit('me'); };

  C._afterLogin = async (user) => {
    try { await C.client.rpc('claim_invites'); } catch (e) { /* function missing → schema not installed */ }
    const rows = must(await C.client.from('members').select('team_id, role, name, teams(name)').eq('user_id', user.id));
    C.teams = (rows || []).map((r) => ({ id: r.team_id, name: r.teams?.name || 'Team', role: r.role, myName: r.name }));
    const pick = C.teams.find((t) => t.id === W.get('cloudTeam', null)) || C.teams[0] || null;
    C.useTeam(pick ? pick.id : null, user);
    C.ready = true;
    W._emit('cloud'); W._emit('me');
  };
  C.useTeam = (id, user = C._authUser) => {
    C._authUser = user;
    const t = C.teams.find((x) => x.id === id) || null;
    C.team = t; W.set('cloudTeam', t ? t.id : null);
    C.user = { name: t?.myName || user?.email || 'Signed-in user', email: user?.email || '', org: t?.name || '', role: t?.role || 'viewer', id: user?.id };
    W._emit('me');
  };
  const teamId = () => { if (!C.team) throw new Error('Create or join a team first (Settings → Team).'); return C.team.id; };

  C.createTeam = async (name) => {
    const t = must(await C.client.rpc('create_team', { team_name: String(name).slice(0, 80) }));
    await C._afterLogin(C._authUser); C.useTeam(t);
    return t;
  };

  // ---------------- plans ----------------
  C.listPlans = async () => (must(await C.client.from('plans').select('id, name, summary, saved_by, updated_at').eq('team_id', teamId()).order('updated_at', { ascending: false }).limit(100)) || [])
    .map((r) => ({ id: r.id, name: r.name, savedAt: r.updated_at, savedBy: r.saved_by, summary: r.summary }));
  C.savePlan = async (snap, id) => {
    const row = { team_id: teamId(), name: snap.name, data: snap, summary: snap.summary, saved_by: snap.savedBy };
    if (id) { must(await C.client.from('plans').update(row).eq('id', id)); W._emit('plans'); return id; }
    const r = must(await C.client.from('plans').insert(row).select('id').single()); W._emit('plans'); return r.id;
  };
  C.loadPlan = async (id) => { const r = must(await C.client.from('plans').select('data').eq('id', id).single()); return r.data; };
  C.deletePlan = async (id) => { must(await C.client.from('plans').delete().eq('id', id)); W._emit('plans'); };

  // ---------------- watch areas ----------------
  C.listWatch = async () => (must(await C.client.from('watch_areas').select('*').eq('team_id', teamId())) || [])
    .map((r) => ({ id: r.id, name: r.name, lat: r.lat, lon: r.lon, radiusKm: r.radius_km, hazards: r.hazards, minLevel: r.min_level, email: r.email || '' }));
  C.addWatch = async (a) => { const r = must(await C.client.from('watch_areas').insert({ team_id: teamId(), name: a.name, lat: a.lat, lon: a.lon, radius_km: a.radiusKm, hazards: a.hazards, min_level: a.minLevel, email: a.email }).select('id').single()); W._emit('watch'); return r.id; };
  C.deleteWatch = async (id) => { must(await C.client.from('watch_areas').delete().eq('id', id)); W._emit('watch'); };

  // ---------------- team (admins) ----------------
  C.listMembers = async () => (must(await C.client.from('members').select('user_id, email, name, role').eq('team_id', teamId())) || []);
  C.invite = async (email, role = 'viewer', name = '') => { must(await C.client.from('members').insert({ team_id: teamId(), email: String(email).toLowerCase().trim(), role, name })); };
  C.setRole = async (email, role) => { must(await C.client.from('members').update({ role }).eq('team_id', teamId()).eq('email', String(email).toLowerCase())); };
  C.removeMember = async (email) => { must(await C.client.from('members').delete().eq('team_id', teamId()).eq('email', String(email).toLowerCase())); };

  W.cloud = C;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/models/prediction.js */
/* Prediction model. Skill: skills/prediction/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const P = {};

  const ALERT_S0 = [0.35, 0.35, 0.65, 0.9]; // index by alertScore 0..3

  /** Hazard intensity at distance r (km). Units: EQ → MMI, TC → km/h, others → score 0..1 */
  P.intensity = (sit, r, mag) => {
    const h = sit.hazard;
    const m = mag == null ? sit.magnitude : mag;
    if (h === 'EQ') {
      const depth = sit.depth || 10;
      const a = sit.mmiA != null ? sit.mmiA : 2.5;
      // finite-fault proxy: rupture length L (Wells & Coppersmith 1994, all slip types) shortens the effective distance
      const L = Math.pow(10, -2.44 + 0.59 * m);
      const rEff = Math.max(0, r - 0.25 * L);
      return Math.max(1, a + 1.5 * m - 4.0 * Math.log10(Math.sqrt(rEff * rEff + depth * depth)));
    }
    if (h === 'TC') {
      const Rmax = 30;
      return r <= Rmax ? m : m * Math.pow(Rmax / r, 0.7);
    }
    const s0 = M.clamp(m, 0, 1);
    if (h === 'FL') { const L = 0.5 * (sit.radiusKm || 40); return s0 * Math.exp(-r / L); }
    if (h === 'WF') { const Rb = Math.sqrt((sit.areaKm2 || 50) / Math.PI); return r <= Rb ? s0 : s0 * Math.exp(-(r - Rb) / 5); }
    if (h === 'VO') return r <= 10 ? s0 : s0 * Math.exp(-(r - 10) / 10);
    if (h === 'DR') { const R = Math.min(200, Math.sqrt((sit.areaKm2 || 5000) / Math.PI)); return r <= R ? s0 : s0 * Math.exp(-(r - R) / 20); }
    return 0;
  };

  /** Damage fractions from intensity. shift = fragility perturbation (MC). V = country vulnerability 0..1 */
  P.impact = (hazard, I, V = 0.5, shift = 0, sub) => {
    if (hazard === 'EQ') {
      const fAff = M.Phi((I - 6.5 - shift) / 0.8);
      const fDis = 0.4 * M.Phi((I - 8.2 + 1.2 * (V - 0.5) - shift) / 0.8); // weaker housing → displaced at lower shaking
      const sev = M.Phi((I - 8.5 - shift) / 0.8);
      const theta = 13.5 + 2.5 * (1 - V) + shift;
      const fFat = M.Phi(Math.log(I / theta) / 0.17);
      return { fAff, fDis, sev, fFat, injPerFat: 3.5 };
    }
    if (hazard === 'TC') {
      const k = Math.exp(shift * 0.1);
      const fAff = M.Phi(Math.log(I / (120 * k)) / 0.25);
      const fDis = M.Phi(Math.log(I / (160 * k)) / 0.25);
      const sev = M.Phi(Math.log(I / (210 * k)) / 0.25);
      return { fAff, fDis, sev, fFat: 0.002 * sev, injPerFat: 10 };
    }
    const s = I, sh = shift * 0.05;
    const fAff = M.Phi((s - 0.35 - sh) / 0.15);
    if (hazard === 'FL') { // calibrated per flood type, see P.FLOOD
      const c = P.FLOOD[sub === 'flash' ? 'flash' : 'riverine'], k = Math.exp(shift * 0.5);
      return { fAff, fDis: c.dis * fAff, sev: M.clamp(s, 0, 1), fFat: c.fat * k * fAff, injPerFat: c.inj };
    }
    const kDis = { WF: 0.5, VO: 1.0, DR: 0 }[hazard] ?? 0.3;
    return { fAff, fDis: kDis * fAff, sev: M.clamp(s, 0, 1), fFat: hazard === 'DR' ? 0 : 1e-4 * fAff, injPerFat: 5 };
  };

  /** Flood calibration (ratios to people affected), from documented events:
   *  flash / glacial-lake / cloudburst: Nepal Trishuli flood Aug 2026, 955 deaths / ~93,000 impacted (IFRC) = 1.0 %;
   *    3,458 evacuated (3.7 %); 279–1,473 injured per 955 deaths (0.3–1.5).
   *  riverine: Pakistan 2022, 1,739 deaths / 33 M affected = 0.005 %; world 1980–2009, 539,811 / 2.8 bn = 0.019 %
   *    (Doocy et al., PLOS Currents 2013) → 0.01 % (geometric middle); homeless 2.1 M–displaced 8 M of 33 M → 20 %;
   *    injuries per death 0.67 (world) to 7.4 (Pakistan) → 2. */
  P.FLOOD = {
    flash: { fat: 0.01, dis: 0.04, inj: 1, implied: true, label: 'flash flood (steep terrain, glacial-lake outburst, cloudburst or dam failure)' },
    riverine: { fat: 1e-4, dis: 0.2, inj: 2, label: 'river / plain flood' },
  };
  const FLASH_WORDS = /flash|glof|glacier|glacial|cloud ?burst|dam (break|burst|failure|collapse)|debris|landslide|mudslide/i;
  /** Classify a flood: name keywords first, else terrain relief (max − min elevation within ~20 km). */
  P.floodKind = (name, reliefM) => (FLASH_WORDS.test(name || '') ? 'flash' : reliefM != null && reliefM >= 800 ? 'flash' : 'riverine');

  /** USGS PAGER fatality bands (alert colour → estimated deaths range). */
  P.PAGER_BANDS = { green: [0, 1], yellow: [1, 99], orange: [100, 999], red: [1000, Infinity] };

  /** Rescale one forecast metric (summary + zones) so its P50 equals `target`, keeping the spread. */
  const rescale = (fc, zones, key, target, floor) => {
    const d = fc.summary[key], r = d.p50 > 0 ? target / d.p50 : 0;
    if (d.p50 > 0) { d.p10 *= r; d.p50 = target; d.p90 *= r; zones.forEach((z) => ['p10', 'p50', 'p90'].forEach((q) => (z.fc[key][q] *= r))); }
    else { // model had nothing here: spread the target by affected share
      const totA = M.sum(zones.map((z) => z.fc.aff.p50)) || 1;
      zones.forEach((z) => { const w = z.fc.aff.p50 / totA; z.fc[key] = { p10: (floor || 0) * w, p50: target * w, p90: target * 1.5 * w }; });
      Object.assign(d, { p10: floor || 0, p50: target, p90: target * 1.5 });
    }
    if (floor != null) d.p10 = Math.max(d.p10, floor);
    d.p90 = Math.max(d.p90, d.p50);
  };

  /** Keep the EQ fatality forecast inside the USGS PAGER band (PAGER is the agency's own loss model). */
  P.applyPager = (fc, zones, pager) => {
    const b = P.PAGER_BANDS[pager]; if (!b) return null;
    const p50 = fc.summary.fat.p50; let target = null;
    if (p50 < b[0]) target = b[0] === 1 ? 3 : b[0] * 1.5; // inside the band, near its lower part
    else if (p50 > b[1]) target = b[1] === 1 ? 0 : b[1] * 0.7;
    if (target == null) return { pager, kept: true };
    const ratio = p50 > 0 ? target / p50 : 1;
    rescale(fc, zones, 'fat', target);
    if (p50 > 0) rescale(fc, zones, 'inj', fc.summary.inj.p50 * ratio);
    return { pager, kept: false, from: p50, to: target };
  };

  /** Agency-reported counts are confirmed minimums: the forecast can never be below them.
   *  rep = { deaths, missing, injured, displaced, affected }. Missing people raise the deaths P90. */
  P.applyReported = (fc, zones, rep, calib) => {
    if (!rep) return [];
    const changes = [];
    const fix = (key, val, extra = 0) => {
      if (!(val > 0)) return;
      const d = fc.summary[key], before = d.p50;
      if (d.p50 < val) rescale(fc, zones, key, val + 0.5 * extra, val);
      else d.p10 = Math.max(d.p10, val);
      d.p90 = Math.max(d.p90, val + extra, d.p50);
      changes.push({ key, reported: val, before, after: d.p50 });
    };
    const fat0 = fc.summary.fat.p50, inj0 = fc.summary.inj.p50;
    fix('fat', rep.deaths, rep.missing || 0);
    // no injury count reported: keep the model's injuries-per-death ratio when deaths were raised
    if (!(rep.injured > 0) && fat0 > 0 && fc.summary.fat.p50 > fat0 && inj0 > 0) rescale(fc, zones, 'inj', inj0 * (fc.summary.fat.p50 / fat0), inj0);
    fix('inj', rep.injured);
    fix('dis', rep.displaced);
    fix('aff', Math.max(rep.affected || 0, rep.displaced || 0, (rep.deaths || 0) + (rep.injured || 0) + (rep.missing || 0)));
    // implied exposure: reported deaths ÷ calibrated death rate (flash floods only; river-flood death rates vary 4× so the inference is too loose) — e.g. Nepal 2026: 955 / 1 % ≈ 95,500 vs IFRC 93,000 impacted
    if (calib && calib.implied && rep.deaths > 0) {
      const impliedAff = rep.deaths / calib.fat, a = fc.summary.aff;
      if (impliedAff > a.p50) { const before = a.p50; rescale(fc, zones, 'aff', impliedAff, a.p10); changes.push({ key: 'aff', implied: impliedAff, before, after: impliedAff }); }
      const impliedDis = impliedAff * calib.dis;
      if (impliedDis > fc.summary.dis.p50) rescale(fc, zones, 'dis', impliedDis, fc.summary.dis.p10);
    }
    // displaced and casualties cannot exceed affected
    const A = fc.summary.aff; ['dis'].forEach((k) => { const d = fc.summary[k]; if (d.p50 > A.p50) { A.p50 = d.p50; A.p90 = Math.max(A.p90, d.p90); } });
    return changes;
  };

  /** Radius (km) inside which at least 10 % of people are affected. */
  P.impactRadius = (sit) => {
    for (let r = 1; r <= 300; r += 1) {
      const I = P.intensity(sit, r);
      if (P.impact(sit.hazard, I, sit.countryVul, 0, sit.floodKind).fAff < 0.1) return Math.max(10, r);
    }
    return 300;
  };

  P.rampAt = (sit, hoursFromNow) => {
    if (!['TC', 'FL'].includes(sit.hazard)) return 1;
    const Tp = sit.peakInHours || 0;
    return 1 / (1 + Math.exp(-(hoursFromNow - Tp) / 6));
  };

  const PLACE_DEFAULT_POP = { city: 250000, town: 20000, suburb: 30000, quarter: 15000, neighbourhood: 8000, village: 1500, hamlet: 150 };
  const RURAL = { city: 0.3, town: 0.6, suburb: 0.4, quarter: 0.4, neighbourhood: 0.4, village: 1, hamlet: 1, sector: 0.7 };
  const LOCAL = new Set(['suburb', 'quarter', 'neighbourhood']);
  const DIRS = ['north', 'east', 'south', 'west'];

  /** Build demand zones from OSM places (or modelled sectors when none). */
  P.buildZones = (sit, places, maxZones = 12) => {
    const R = sit.radiusKm;
    const src = { lat: sit.lat, lon: sit.lon };
    const c = sit.focus || src; // planning focus (land point) may differ from an offshore source
    let zones = [];
    const all = (places || []).filter((pl) => M.haversine(c, pl) <= R);
    all.forEach((pl) => {
      const tagged = pl.population > 0;
      const pop = tagged ? pl.population : PLACE_DEFAULT_POP[pl.type] || 1000;
      if (pl.type === 'city' || (pl.type === 'town' && pop >= 300000)) {
        const rc = Math.max(3, Math.sqrt(pop / 4000 / Math.PI)); // urban radius at ~4,000 people/km²
        const locals = all.filter((o) => LOCAL.has(o.type) && M.haversine(pl, o) <= rc * 1.2);
        if (locals.length >= 3) { // the city is represented by its own sectors/suburbs (added below)
          locals.forEach((o) => { o.parent = o.parent || pl.name; o.cityPop = pop / locals.length; });
          return;
        }
        if (pop >= 300000) { // no localities mapped: four quarters, named from the map later
          DIRS.forEach((q, k) => {
            const p = M.destination(pl, k * 90, 0.45 * rc);
            zones.push({ name: `${pl.name} (${q})`, lat: p.lat, lon: p.lon, pop: pop / 4, type: pl.type, popProv: tagged ? 'osm' : 'modelled', needsName: true, parent: pl.name });
          });
          return;
        }
      }
      if (LOCAL.has(pl.type)) {
        const p2 = pl.population > 0 ? pl.population : pl.cityPop ? Math.min(pl.cityPop, 60000) : PLACE_DEFAULT_POP[pl.type];
        zones.push({ name: pl.name, lat: pl.lat, lon: pl.lon, pop: p2, type: pl.type, popProv: pl.population > 0 ? 'osm' : 'modelled', parent: pl.parent || '' });
        return;
      }
      zones.push({ name: pl.name, lat: pl.lat, lon: pl.lon, pop, type: pl.type, popProv: tagged ? 'osm' : 'modelled', parent: pl.parent || '' });
    });
    // merge near-duplicates (< 1.5 km)
    zones = zones.filter((z, i) => { const o = zones.find((x, j) => j < i && M.haversine(z, x) < 1.5); if (o) (o.covers = o.covers || []).push(z.name); return !o; });
    if (zones.length < 4) { // modelled sectors (center + 6 ring)
      const dens = sit.popDensity || 400; // persons/km² assumption, labelled
      const ringR = 0.45 * R, areaCore = Math.PI * (0.3 * R) ** 2, areaSector = (Math.PI * R * R - areaCore) / 6;
      // modelled areas: named from the map (reverse geocoding) by the engine; these labels are only a fallback
      zones.push({ name: 'Area at the centre', lat: c.lat, lon: c.lon, pop: dens * areaCore * 1.5, type: 'sector', popProv: 'modelled', needsName: true });
      for (let k = 0; k < 6; k++) {
        const p = M.destination(c, k * 60 + 30, ringR);
        zones.push({ name: `Area ${Math.round(ringR)} km ${['north-east', 'east', 'south-east', 'south-west', 'west', 'north-west'][k]}`, lat: p.lat, lon: p.lon, pop: dens * areaSector, type: 'sector', popProv: 'modelled', needsName: true });
      }
    }
    zones.forEach((z) => {
      z.distKm = M.haversine(src, z);
      z.I = P.intensity(sit, z.distKm);
      const im = P.impact(sit.hazard, z.I, sit.countryVul, 0, sit.floodKind);
      z.affEst = z.pop * im.fAff;
      z.rural = RURAL[z.type] ?? 0.7;
    });
    zones.sort((a, b) => b.affEst - a.affEst);
    // pick the worst-hit areas but keep them ≥ 2 km apart, so a dense city is covered across its extent;
    // each skipped locality is listed under the nearest chosen area ("also covers …")
    const cand = zones.filter((z) => z.affEst > 1), chosen = [];
    cand.forEach((z) => { if (chosen.length < maxZones && !chosen.some((o) => M.haversine(o, z) < 2)) chosen.push(z); });
    cand.forEach((z) => { if (chosen.includes(z)) return; const near = chosen.reduce((b, o) => (M.haversine(o, z) < M.haversine(b, z) ? o : b), chosen[0]); if (near && M.haversine(near, z) < 6) (near.covers = near.covers || []).push(z.name); });
    zones = chosen;
    zones.forEach((z, i) => { z.id = 'Z' + (i + 1); z.recv = {}; z.surge = 1; });
    return zones;
  };

  /** Monte-Carlo forecast per zone → P10/P50/P90 and three weighted scenarios. */
  P.forecast = (sit, zones, draws = AA.config.mcDraws, seed = AA.config.seed) => {
    const rng = M.mulberry32(seed);
    const V = sit.countryVul ?? 0.5;
    const samples = zones.map(() => ({ aff: [], dis: [], inj: [], fat: [], sev: [] }));
    const totals = { aff: [], dis: [], inj: [], fat: [] };
    for (let n = 0; n < draws; n++) {
      let mag = sit.magnitude;
      if (sit.hazard === 'EQ') mag += 0.2 * M.gauss(rng);
      else if (sit.hazard === 'TC') mag *= Math.exp(0.12 * M.gauss(rng));
      else mag = M.clamp(mag * Math.exp(0.15 * M.gauss(rng)), 0, 1);
      const shift = 0.3 * M.gauss(rng);
      const tot = { aff: 0, dis: 0, inj: 0, fat: 0 };
      zones.forEach((z, i) => {
        const pop = z.pop * Math.exp(0.2 * M.gauss(rng));
        const I = z.sObs != null ? M.clamp(z.sObs * (mag / (sit.magnitude || 1)), 0, 1) : P.intensity(sit, z.distKm, mag); // observed river flow overrides distance decay
        const im = P.impact(sit.hazard, I, V, shift, sit.floodKind);
        const aff = pop * im.fAff, dis = pop * im.fDis, fat = pop * im.fFat, inj = fat * im.injPerFat;
        const s = samples[i];
        s.aff.push(aff); s.dis.push(dis); s.inj.push(inj); s.fat.push(fat); s.sev.push(im.sev);
        tot.aff += aff; tot.dis += dis; tot.inj += inj; tot.fat += fat;
      });
      Object.keys(tot).forEach((k) => totals[k].push(tot[k]));
    }
    const q = (a) => ({ p10: M.quantile(a, 0.1), p50: M.quantile(a, 0.5), p90: M.quantile(a, 0.9) });
    zones.forEach((z, i) => {
      const s = samples[i];
      z.fc = { aff: q(s.aff), dis: q(s.dis), inj: q(s.inj), fat: q(s.fat), sev: q(s.sev) };
      if (z.sevPost == null) z.sevMean = z.fc.sev.p50; // Bayesian posterior overrides when present
    });
    const summary = {}; Object.keys(totals).forEach((k) => (summary[k] = q(totals[k])));
    return { draws, seed, summary };
  };

  /** Scenario value: s ∈ {low, base, high} → P10/P50/P90 */
  P.scenarioValue = (dist, s) => (s === 'low' ? dist.p10 : s === 'high' ? dist.p90 : dist.p50);

  /** Gaussian conjugate update. */
  P.bayes = (mu0, s0, y, sy) => {
    const w0 = 1 / (s0 * s0), wy = 1 / (sy * sy);
    return { mu: (mu0 * w0 + y * wy) / (w0 + wy), sd: Math.sqrt(1 / (w0 + wy)) };
  };

  /** River-flow ratio (peak ÷ yearly median) → flood intensity 0..1: 2× ≈ bank-full (0.35, damage threshold),
   *  5× = 0.65, 12.5× ≈ 0.95. Below 1.2× the river is in its normal range (0). */
  P.flowToS = (ratio) => (ratio == null ? null : ratio < 1.2 ? 0 : M.clamp(0.35 + (0.3 * Math.log(ratio / 2)) / Math.log(2.5), 0, 1));

  /** Catchment radius (km) for each zone: half the distance to its nearest neighbour, 1.5–15 km
   *  (quadrants of large cities use their quadrant size). Used to count people with WorldPop. */
  P.catchments = (zones) => zones.map((z) => {
    const others = zones.filter((o) => o !== z).map((o) => M.haversine(z, o));
    const nn = others.length ? Math.min(...others) : 20;
    return M.clamp(0.5 * nn, 1.5, 15);
  });

  /** Quantile of a PAGER fatality distribution (probability bins on a log scale). */
  P.pagerQuantile = (bins, q) => {
    const tot = M.sum(bins.map((b) => b.p)) || 1; let acc = 0;
    for (const b of bins) {
      const p = b.p / tot;
      if (acc + p >= q && p > 0) {
        const f = (q - acc) / p;
        if (b.min <= 0) return f * b.max; // 0–1 bin: linear
        return Math.pow(10, Math.log10(b.min) + f * (Math.log10(b.max) - Math.log10(b.min)));
      }
      acc += p;
    }
    return bins[bins.length - 1].max;
  };

  /** Replace the fatality forecast with the USGS PAGER distribution (country-calibrated, ShakeMap-based) and
   *  recompute affected/displaced by applying our fragility curves to PAGER's population exposure by MMI. */
  P.applyPagerLosses = (fc, zones, pg, V = 0.5) => {
    if (!pg?.bins) return null;
    const q = { p10: P.pagerQuantile(pg.bins, 0.1), p50: P.pagerQuantile(pg.bins, 0.5), p90: P.pagerQuantile(pg.bins, 0.9) };
    const before = { ...fc.summary.fat }, inj0 = fc.summary.inj.p50, fat0 = fc.summary.fat.p50;
    rescale(fc, zones, 'fat', q.p50);
    Object.assign(fc.summary.fat, q);
    if (fat0 > 0 && inj0 > 0) rescale(fc, zones, 'inj', inj0 * (q.p50 / fat0)); else rescale(fc, zones, 'inj', q.p50 * 3.5);
    const out = { quantiles: q, before, level: pg.level };
    if (pg.exposure?.length) {
      let aff = 0, dis = 0;
      pg.exposure.forEach((e) => { const im = P.impact('EQ', e.mmi, V); aff += e.pop * im.fAff; dis += e.pop * im.fDis; });
      // exposure covers the whole shaken area; our zones cover the planning radius, so only raise, never lower
      if (aff > fc.summary.aff.p50) { rescale(fc, zones, 'aff', aff, fc.summary.aff.p10); out.aff = aff; }
      if (dis > fc.summary.dis.p50) { rescale(fc, zones, 'dis', dis, fc.summary.dis.p10); out.dis = dis; }
    }
    return out;
  };

  P.ALERT_S0 = ALERT_S0;
  AA.prediction = P;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/models/fairness.js */
/* Fairness: need score, Sphere demand, equity metrics. Skill: skills/fairness/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const F = {};

  // Sphere Handbook 2018 minimums + labelled planning ratios
  F.RATES = {
    water: { flow: true, f: (a, d) => (15 * d + 3 * (a - d)) / 1000 },   // kL / day
    food: { flow: true, f: (a, d) => (0.6 * d + 0.3 * (a - d)) / 1000 }, // t / day
    shelter: { flow: false, f: (a, d) => d / 5 },                        // tents (target)
    medical: { flow: false, f: (a, d, inj) => inj / 50 + a / 1000 },      // modules (target)
    staff: { flow: false, f: (a, d, inj) => inj / 20 + d / 500 },         // staff (target)
  };

  /** Cumulative demand target for zone z, commodity k, scenario s, at end of epoch t. */
  F.targetDemand = (z, k, s, epoch, sit) => {
    const P = AA.prediction, cfg = AA.config;
    const a = P.scenarioValue(z.fc.aff, s), d = Math.min(a, P.scenarioValue(z.fc.dis, s)), inj = P.scenarioValue(z.fc.inj, s);
    const sevScale = z.sevPost != null ? M.clamp(z.sevPost / Math.max(z.fc.sev.p50, 0.02), 0.2, 3) : 1;
    const hoursEnd = (epoch + 1) * cfg.epochHours;
    const ramp = P.rampAt(sit, hoursEnd);
    const r = F.RATES[k];
    const base = r.f(a, d, inj) * sevScale * (z.surge || 1) * ramp;
    return r.flow ? base * hoursEnd / 24 : base;
  };

  /** Expected net demand d_ik (Σ_s p_s D_iks − recv), plus P90 for pre-positioning. */
  F.netDemand = (zones, sit, epoch) => {
    const w = AA.config.scenarioWeights;
    zones.forEach((z) => {
      z.D = {}; z.d = {}; z.D90 = {};
      AA.config.commodities.forEach(({ key }) => {
        const exp = w.low * F.targetDemand(z, key, 'low', epoch, sit) + w.base * F.targetDemand(z, key, 'base', epoch, sit) + w.high * F.targetDemand(z, key, 'high', epoch, sit);
        z.D[key] = exp;
        z.D90[key] = F.targetDemand(z, key, 'high', epoch, sit);
        z.d[key] = z.served ? 0 : Math.max(0, exp - (z.recv[key] || 0));
      });
    });
  };

  /** Need score N_i with full breakdown for the explainer. */
  F.needScores = (zones, sit) => {
    const w = AA.config.needWeights;
    const sev = zones.map((z) => (z.sevPost != null ? z.sevPost : z.sevMean));
    const pop = zones.map((z) => z.fc.aff.p50);
    const recvFrac = zones.map((z) => {
      let got = 0, need = 0;
      AA.config.commodities.forEach((c) => { got += (z.recv[c.key] || 0) * c.kg; need += (z.D?.[c.key] || 0) * c.kg; });
      return need > 0 ? M.clamp(got / need, 0, 1) : 0;
    });
    const sevN = M.minmax(sev), popN = M.minmax(pop);
    const recvN = recvFrac.every((v) => v === 0) ? recvFrac : M.minmax(recvFrac);
    zones.forEach((z, i) => {
      z.vul = M.clamp(0.5 * z.rural + 0.5 * (sit.countryVul ?? 0.5), 0, 1);
      const acc = M.clamp(z.acc ?? 0.5, 0, 1);
      const N = w.sev * sevN[i] + w.pop * popN[i] + w.vul * z.vul + w.acc * acc - w.recv * recvN[i];
      z.need = M.clamp(N, 0, 1);
      z.needParts = { sev: sev[i], sevN: sevN[i], pop: pop[i], popN: popN[i], vul: z.vul, acc, recvFrac: recvFrac[i], recvN: recvN[i] };
    });
  };

  /** Gini of shortage ratios (classical, for reporting). */
  F.gini = (q) => {
    const n = q.length, mean = M.mean(q); if (!n || mean < 1e-9) return 0;
    let s = 0; for (const a of q) for (const b of q) s += Math.abs(a - b);
    return s / (2 * n * n * mean);
  };

  AA.fairness = F;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/models/efficiency.js */
/* Efficiency: allocation MILP, BPR congestion, Clarke–Wright consolidation, casualty LP.
   Skill: skills/efficiency/SKILL.md. Solver: javascript-lp-solver (global `solver`). */
(function (root) {
  const AA = root.AA, M = AA.math;
  const E = {};
  const getSolver = () => root.solver || (typeof require !== 'undefined' ? require('javascript-lp-solver') : null);

  E.BPR_SLOPES = [1 + 0.75 * 0.25 ** 4, 1 + 0.75 * 0.75 ** 4, 1 + 0.75 * 1.5 ** 4];
  E.bprTime = (t0, v, cap) => t0 * (1 + 0.15 * Math.pow(v / Math.max(cap, 1e-9), 4));

  E.tripCost = (cls, km, hours) => {
    const v = AA.config.vehicles[cls];
    return 2 * km * v.cD + 2 * hours * v.cT + v.cF;
  };

  /**
   * problem: { zones:[{id,need,d:{k},theta}], depots:[{id,open,stock:{k},fleet:{truck,bus}}],
   *            tau:[j][i] hours (Infinity = unreachable), dist:[j][i] km }
   */
  E.buildModel = (pb, opts = {}) => {
    const cfg = AA.config, ob = { ...cfg.objective, ...(opts.objective || {}) };
    const K = cfg.commodities, I = pb.zones, J = pb.depots, nI = I.length || 1;
    const dt = cfg.epochHours;
    const model = { optimize: 'obj', opType: 'min', constraints: {}, variables: {}, ints: {} };
    const C = model.constraints, Vv = model.variables;
    const addVar = (name, coefs) => { Vv[name] = Object.assign(Vv[name] || {}, coefs); };
    const crit = K.filter((k) => k.critical).map((k) => k.key);

    // ---- normaliser C0: direct trips from each zone's nearest open depot ----
    let C0 = 0;
    I.forEach((z, i) => {
      let best = -1, bt = Infinity;
      J.forEach((dp, j) => { if (dp.open && pb.tau[j][i] < bt) { bt = pb.tau[j][i]; best = j; } });
      if (best < 0 || !isFinite(bt)) return;
      ['truck', 'bus'].forEach((cls) => {
        const load = K.filter((k) => k.cls === cls).reduce((s, k) => s + (z.d[k.key] || 0) * k.kg, 0);
        if (load <= 0) return;
        C0 += Math.ceil(load / cfg.vehicles[cls].cap) * E.tripCost(cls, pb.dist[best][i], bt) + (cls === 'truck' ? load * cfg.loadCostPerKg : 0);
      });
    });
    C0 = Math.max(C0, 1);
    const a = ob.alpha / C0;

    // ---- per zone congestion capacity and mean access time ----
    const kap = I.map((z) => Math.max(2, cfg.bprCapacityPerEpoch * (1 - (z.theta || 0))));
    const tbar = I.map((z, i) => { const ts = J.map((_, j) => pb.tau[j][i]).filter(isFinite); return ts.length ? M.mean(ts) : 1; });

    const vars = { x: [], n: [] };
    // total demand per commodity: common per-unit normaliser so zone size does not distort priorities
    const Dk = {}; K.forEach((k) => (Dk[k.key] = Math.max(M.EPS, M.sum(I.map((z) => z.d[k.key] || 0)))));
    I.forEach((z, i) => {
      K.forEach((k) => {
        const d = z.d[k.key] || 0;
        if (d <= 1e-9) return;
        const dem = `dem_${i}_${k.key}`;
        C[dem] = { equal: d };
        const pi = cfg.criticality[k.key] || 1, wN = 0.5 + (z.need || 0);
        addVar(`u_${i}_${k.key}`, { obj: (pi * wN) / Dk[k.key], [dem]: 1 });
        // need-weighted minimax per commodity: (0.5 + N_i)·q_ik ≤ M_k
        C[`mm_${i}_${k.key}`] = { max: 0 };
        addVar(`u_${i}_${k.key}`, { [`mm_${i}_${k.key}`]: wN / d });
        addVar(`M_${k.key}`, { [`mm_${i}_${k.key}`]: -1 });
        if (k.critical) { // service floor
          C[`fl_${i}_${k.key}`] = { min: ob.phi * d };
          addVar(`s_${i}_${k.key}`, { obj: ob.mu / Dk[k.key], [`fl_${i}_${k.key}`]: 1 });
        }
        J.forEach((dp, j) => {
          if (!dp.open || !isFinite(pb.tau[j][i]) || !((dp.stock[k.key] || 0) > 1e-9)) return;
          const xn = `x_${j}_${i}_${k.key}`;
          const coef = { obj: a * cfg.loadCostPerKg * (k.cls === 'truck' ? k.kg : 0), [dem]: 1, [`sup_${j}_${k.key}`]: 1, [`cap_${j}_${i}_${k.cls}`]: k.kg };
          if (k.critical) coef[`fl_${i}_${k.key}`] = 1;
          addVar(xn, coef);
          C[`sup_${j}_${k.key}`] = { max: dp.stock[k.key] };
          vars.x.push({ name: xn, j, i, k: k.key });
          const nn = `n_${j}_${i}_${k.cls}`;
          if (!Vv[nn] || Vv[nn].obj == null) {
            const veh = cfg.vehicles[k.cls];
            C[`cap_${j}_${i}_${k.cls}`] = { max: 0 };
            C[`fleet_${j}_${k.cls}`] = { max: (dp.fleet[k.cls] || 0) * dt };
            addVar(nn, { obj: a * E.tripCost(k.cls, pb.dist[j][i], pb.tau[j][i]), [`cap_${j}_${i}_${k.cls}`]: -veh.cap, [`fleet_${j}_${k.cls}`]: 2 * pb.tau[j][i] + cfg.serviceHours, [`cong_${i}`]: 1 });
            model.ints[nn] = 1;
            vars.n.push({ name: nn, j, i, cls: k.cls });
          }
        });
      });
      // BPR piecewise congestion on zone access
      if (vars.n.some((v) => v.i === i)) {
        C[`cong_${i}`] = { equal: 0 };
        E.BPR_SLOPES.forEach((sl, s) => {
          const fn = `f_${i}_${s}`;
          const co = { obj: a * cfg.vehicles.truck.cT * tbar[i] * (sl - 1), [`cong_${i}`]: -1 };
          if (s < 2) { C[`fb_${i}_${s}`] = { max: kap[i] / 2 }; co[`fb_${i}_${s}`] = 1; }
          addVar(fn, co);
        });
      }
    });
    K.forEach((k) => addVar(`M_${k.key}`, { obj: (ob.delta * (cfg.criticality[k.key] || 1)) / 3 }));
    // linearised Gini on shortage ratios, critical commodities
    crit.forEach((k) => {
      const idx = I.map((z, i) => i).filter((i) => (I[i].d[k] || 0) > 1e-9);
      for (let p = 0; p < idx.length; p++) for (let q = p + 1; q < idx.length; q++) {
        const i1 = idx[p], i2 = idx[q], d1 = I[i1].d[k], d2 = I[i2].d[k];
        const g = `g_${i1}_${i2}_${k}`, ca = `ga_${i1}_${i2}_${k}`, cb = `gb_${i1}_${i2}_${k}`;
        C[ca] = { min: 0 }; C[cb] = { min: 0 };
        addVar(g, { obj: (2 * ob.beta) / (nI * nI), [ca]: 1, [cb]: 1 });
        addVar(`u_${i1}_${k}`, { [ca]: -1 / d1, [cb]: 1 / d1 });
        addVar(`u_${i2}_${k}`, { [ca]: 1 / d2, [cb]: -1 / d2 });
      }
    });
    return { model, vars, C0, kap, tbar, Dk };
  };

  const solveOnce = (model) => getSolver().Solve(model);

  /** Solve allocation; MILP with fallback to relax-and-round. Returns a rich, explainable result. */
  E.allocate = (pb, opts = {}) => {
    const cfg = AA.config, K = cfg.commodities;
    const built = E.buildModel(pb, opts);
    const { model, vars } = built;
    const t0 = Date.now();
    let res, method;
    const relaxed = { ...model, ints: {} };
    const lp = solveOnce(relaxed);
    const nInts = Object.keys(model.ints).length;

/* Routing: damage-aware matrices, path choice, closures. Skill: skills/routing/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const R = {};

  /** Road damage θ at point p for the current epoch (θ_t = θ0(1−ρ)^t + Σ η_e(1−ρ)^(t−t_e)). */
  R.damageAt = (sit, st, p) => {
    const cfg = AA.config, P = AA.prediction;
    const r = M.haversine(sit, p);
    const I = P.intensity(sit, r);
    let th0 = 0;
    if (sit.hazard === 'EQ') th0 = M.Phi((I - 9.0) / 1.0);
    else if (sit.hazard === 'TC') th0 = M.Phi(Math.log(Math.max(I, 1) / 200) / 0.3);
    else if (sit.hazard === 'FL') th0 = 0.6 * I;
    else if (sit.hazard === 'WF' || sit.hazard === 'VO') th0 = 0.8 * I;
    const decay = (t) => Math.pow(1 - cfg.roadRecovery, Math.max(0, t));
    let th = th0 * decay(st.epoch || 0);
    (st.shocks || []).forEach((e) => { const d = M.haversine(e, p); if (d < e.radiusKm) th += e.eta * (1 - d / e.radiusKm) * decay((st.epoch || 0) - e.epoch); });
    return M.clamp(th, 0, 1);
  };

  /** Mean θ along the straight segment a→b (8 samples) — used to slow matrix times. */
  R.lineDamage = (sit, st, a, b) => {
    let s = 0; const n = 8;
    for (let k = 0; k <= n; k++) s += R.damageAt(sit, st, { lat: a.lat + (b.lat - a.lat) * k / n, lon: a.lon + (b.lon - a.lon) * k / n });
    return s / (n + 1);
  };

  R.hitsClosure = (coords, closures, bufKm) => {
    if (!closures || !closures.length) return false;
    for (const c of closures) for (let k = 1; k < coords.length; k++) {
      const a = { lat: coords[k - 1][1], lon: coords[k - 1][0] }, b = { lat: coords[k][1], lon: coords[k][0] };
      if (Math.abs(a.lat - c.lat) > 0.2 || Math.abs(a.lon - c.lon) > 0.2) continue;
      if (M.pointSegDist(c, a, b) <= bufKm) return true;
    }
    return false;
  };

  /** Evaluate a geometry: damage stats + generalised cost. coords = [[lon,lat],...] */
  R.evaluate = (sit, st, coords, distKm, hours, cls = 'truck') => {
    const cfg = AA.config, v = cfg.vehicles[cls];
    const step = Math.max(1, Math.floor(coords.length / 40));
    const ths = []; for (let k = 0; k < coords.length; k += step) ths.push(R.damageAt(sit, st, { lat: coords[k][1], lon: coords[k][0] }));

  R.routeLeg = async (sit, st, a, b, cls = 'truck') => {
    const tryRoutes = async (pts) => {
      const rs = await AA.data.osrmRoute(pts).catch(() => null);

    };
    let cands = await tryRoutes([a, b]);

    from.forEach((a, j) => {

    });
    return { tau, dist, theta };
  };

  AA.routing = R;
})(typeof window !== 'undefined' ? window : globalThis);

/* Facility location: hazard-safe MCLP + p-median tie-break. Skill: skills/facility-location/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const FL = {};

  /** Candidate grid (5×5) around the focus, flagged hazard-unsafe when heavy damage > 0.3. */
  FL.candidates = (sit, n = 5) => {
    const c = sit.focus || sit, half = Math.min(1.2 * sit.radiusKm, 60);

    for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {

      const p = { lat: c.lat + dy / 110.57, lon: c.lon + dx / (111.32 * Math.cos(M.toRad(c.lat))) };
      const I = AA.prediction.intensity(sit, M.haversine(sit, p));

      out.push({ ...p, sev, safe: sev <= 0.3, kind: 'grid' });
    }
    return out;
  };

  const combos = function* (n, k, start = 0, acc = []) {
    if (acc.length === k) { yield acc.slice(); return; }
    for (let i = start; i <= n - (k - acc.length); i++) { acc.push(i); yield* combos(n, k, i + 1, acc); acc.pop(); }
  };

  /**
   * zones: [{need, fc}], cand: [{safe}], tau[c][i] hours.
   * Exact MCLP by enumeration when C(n,P) ≤ 60 000, otherwise greedy + 1-swap.
   */
  FL.mclp = (zones, cand, tau, P = AA.config.warehouses, Tc = AA.config.coverageMinutes / 60) => {
    const idx = cand.map((c, j) => j).filter((j) => cand[j].safe);
    const w = zones.map((z) => (z.need ?? 0.5) * (z.fc ? z.fc.aff.p90 : z.pop || 1));
    const wMax = Math.max(1, ...w);
    const score = (S) => {
      let cov = 0, med = 0;
      zones.forEach((z, i) => {
        let best = Infinity; S.forEach((j) => { if (tau[j][i] < best) best = tau[j][i]; });
        if (best <= Tc) cov += w[i];
        med += (w[i] / wMax) * (isFinite(best) ? best : 99);
      });
      return { cov, med, val: cov - 1e-4 * wMax * med };
