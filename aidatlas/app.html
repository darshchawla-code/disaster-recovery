  const logIdx = (p) => M.clamp((Math.log10(Math.max(p, 1e-5)) + 4) / 4, 0, 1); // 1e-4 → 0, 1 → 1

  /**
   * inputs: { eq:[{lat,lon,magnitude}], eqYears, events:[{lat,lon,hazard}], eventYears,
   *           q100:[per cell m³/s] | null, elev:[per cell m] | null, places:[{lat,lon,population,type}],
   *           hospitals:[{lat,lon}], country:{vul,lcc} }
   */
  RK.assess = (cells, inp) => {
    const gr = RK.gutenbergRichter((inp.eq || []).map((e) => e.magnitude), inp.eqYears || 50);
    const regionArea = Math.PI * 400 * 400, footprint = Math.PI * 50 * 50;
    const kEq = cells.map((c) => M.sum((inp.eq || []).map((e) => Math.exp(-(M.haversine(c, e) ** 2) / (2 * 50 * 50)))));
    const kEqMean = M.mean(kEq) || 1;
    const elevMed = inp.elev ? M.quantile(inp.elev.filter(isFinite), 0.5) : 0;
    const popK = cells.map((c) => M.sum((inp.places || []).map((p) => (p.population || ({ city: 250000, town: 20000, village: 1500 })[p.type] || 500) * Math.exp(-(M.haversine(c, p) ** 2) / (2 * 10 * 10)))));
    const popMax = Math.max(1, ...popK);
    const hazards = ['TC', 'FL', 'WF', 'VO', 'DR'];
    cells.forEach((c, i) => {
      const comp = {};
      // earthquake: regional G-R rate redistributed by epicentre kernel
      const rateEq = gr.lambda6 * (footprint / regionArea) * (kEq[i] / kEqMean) * (inp.eq?.length ? 1 : 0);
      comp.EQ = 1 - Math.exp(-10 * rateEq);
      // event-frequency hazards (σ = 75 km kernel), plus river-flood index from GloFAS
      hazards.forEach((h) => {
        const lam = M.sum((inp.events || []).filter((e) => e.hazard === h).map((e) => Math.exp(-(M.haversine(c, e) ** 2) / (2 * 75 * 75)))) / Math.max(1, inp.eventYears || 25);
        comp[h] = 1 - Math.exp(-10 * lam);
      });
      if (inp.q100 && isFinite(inp.q100[i])) {
        const low = inp.elev && inp.elev[i] < elevMed ? 1.25 : 1;
        c.q100 = inp.q100[i];
        comp.FL = Math.max(comp.FL, M.clamp((1 - Math.exp(-inp.q100[i] / 500)) * low, 0, 0.95));
      }
      const H0 = 1 - Object.values(comp).reduce((p, x) => p * (1 - x), 1);
      const H = logIdx(H0);
      const E = Math.log10(1 + popK[i]) / Math.log10(1 + popMax);
      const near = (inp.places || []).filter((p) => M.haversine(c, p) < 15);
      const ruralPop = M.sum(near.filter((p) => ['village', 'hamlet'].includes(p.type)).map((p) => p.population || 1500));
      const allPop = M.sum(near.map((p) => p.population || ({ city: 250000, town: 20000 })[p.type] || 1500));
      const rural = allPop ? ruralPop / allPop : 0.8;
      const V = M.clamp(0.5 * (inp.country?.vul ?? 0.5) + 0.5 * rural, 0.01, 1);
      const dH = (inp.hospitals || []).length ? Math.min(...inp.hospitals.map((h) => M.haversine(c, h))) : 40;
      const LCC = M.clamp(0.5 * M.clamp(dH / 30, 0, 1) + 0.5 * (inp.country?.lcc ?? 0.5), 0.01, 1);
      const HE = Math.sqrt(H * E);
      const R = Math.cbrt(HE) * Math.cbrt(V) * Math.cbrt(LCC);
      const dom = Object.entries(comp).sort((a, b) => b[1] - a[1])[0];
      Object.assign(c, { comp, H0, H, E, V, LCC, R, dominant: dom[1] > 0 ? dom[0] : 'EQ', hospKm: dH, pop: popK[i] });
    });
    return { gr, cells };
  };

  AA.risk = RK;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/models/savings.js */
/* Cost-saving report: the optimised plan compared with the usual manual practice, "send from the nearest store".
   Same demand, same stock, same vehicles, same road times; only the decision rule differs.
   Skill: skills/savings/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const S = {};

  /**
   * Baseline: every area is supplied from its nearest open, reachable store; when that store runs out of an item
   * (or out of vehicle hours) the next-nearest store is used. Areas are served in list order (Z1 first = most
   * affected), as requests usually arrive. Direct trips only, no multi-stop runs, no fairness rule.
   * pb = { zones:[{d:{k}}], depots:[{open,stock,fleet}], tau:[j][i] h, dist:[j][i] km }
   */
  S.nearestStore = (pb) => {
    const cfg = AA.config, K = cfg.commodities, E = AA.efficiency, dt = cfg.epochHours;
    const stock = pb.depots.map((d) => ({ ...d.stock }));
    const hours = pb.depots.map((d) => ({ truck: (d.fleet.truck || 0) * dt, bus: (d.fleet.bus || 0) * dt }));
    const ship = [], trips = [];
    pb.zones.forEach((z, i) => {
      const order = pb.depots.map((d, j) => ({ d, j })).filter(({ d, j }) => d.open && pb.tau[j] && isFinite(pb.tau[j][i])).sort((a, b) => pb.tau[a.j][i] - pb.tau[b.j][i]);
      ['truck', 'bus'].forEach((cls) => {
        const ks = K.filter((k) => k.cls === cls);
        const left = {}; ks.forEach((k) => (left[k.key] = z.d?.[k.key] || 0));
        for (const { j } of order) {
          if (ks.every((k) => left[k.key] <= 1e-9)) break;
          // what this store can give
          const give = {}; let kg = 0;
          ks.forEach((k) => { give[k.key] = Math.min(left[k.key], stock[j][k.key] || 0); kg += give[k.key] * k.kg; });
          if (kg <= 1e-9) continue;
          const cyc = 2 * pb.tau[j][i] + cfg.serviceHours, cap = cfg.vehicles[cls].cap;
          const possible = Math.floor(hours[j][cls] / cyc + 1e-9);
          if (possible <= 0) continue;
          const need = Math.ceil(kg / cap - 1e-9), n = Math.min(need, possible);
          const frac = Math.min(1, (n * cap) / kg);
          hours[j][cls] -= n * cyc;
          trips.push({ j, i, cls, n });
          ks.forEach((k) => { const q = give[k.key] * frac; if (q > 1e-9) { ship.push({ j, i, k: k.key, qty: q }); stock[j][k.key] -= q; left[k.key] -= q; } });
        }
      });
    });
    let transport = 0, handling = 0;
    trips.forEach((t) => (transport += t.n * E.tripCost(t.cls, pb.dist[t.j][t.i], pb.tau[t.j][t.i])));
    ship.forEach((s) => { const k = K.find((c) => c.key === s.k); if (k.cls === 'truck') handling += s.qty * k.kg * cfg.loadCostPerKg; });
    return { ship, trips, cost: { transport, handling, total: transport + handling } };
  };

  /** Metrics of any plan {ship, trips, cost} on the same problem. */
  S.metrics = (pb, plan, tripsOverride) => {
    const cfg = AA.config, K = cfg.commodities;
    const delivered = {}, demand = {};
    K.forEach((k) => { delivered[k.key] = M.sum(plan.ship.filter((s) => s.k === k.key).map((s) => s.qty)); demand[k.key] = M.sum(pb.zones.map((z) => z.d?.[k.key] || 0)); });
    const nTrips = tripsOverride ?? M.sum(plan.trips.map((t) => t.n));
    const vehHours = M.sum(plan.trips.map((t) => t.n * (2 * pb.tau[t.j][t.i] + cfg.serviceHours)));
    let kgT = 0, kg = 0;
    plan.ship.forEach((s) => { const k = K.find((c) => c.key === s.k); kgT += s.qty * k.kg * pb.tau[s.j][s.i]; kg += s.qty * k.kg; });
    const crit = K.filter((k) => k.critical).map((k) => k.key);
    const zoneGot = pb.zones.map((z, i) => { const o = {}; K.forEach((k) => (o[k.key] = M.sum(plan.ship.filter((s) => s.i === i && s.k === k.key).map((s) => s.qty)))); return o; });
    const ratio = (i, k) => { const d = pb.zones[i].d?.[k] || 0; return d > 1e-9 ? M.clamp(1 - zoneGot[i][k] / d, 0, 1) : 0; };
    const gini = {}; crit.forEach((k) => (gini[k] = AA.fairness.gini(pb.zones.map((z, i) => i).filter((i) => (pb.zones[i].d?.[k] || 0) > 1e-9).map((i) => ratio(i, k)))));
    const critDem = M.sum(crit.map((k) => demand[k] * K.find((c) => c.key === k).kg)), critDel = M.sum(crit.map((k) => Math.min(delivered[k], demand[k]) * K.find((c) => c.key === k).kg));
    // areas left with less than half of their water (the first thing people die without)
    const leftBehind = pb.zones.filter((z, i) => (z.d?.water || 0) > 1e-9 && zoneGot[i].water < 0.5 * z.d.water).map((z) => z.name || z.id);
    // high-need areas (top third by need score) served first or not
    const byNeed = pb.zones.map((z, i) => i).sort((a, b) => (pb.zones[b].need || 0) - (pb.zones[a].need || 0));
    const topN = byNeed.slice(0, Math.max(1, Math.ceil(byNeed.length / 3)));
    const topWater = M.sum(topN.map((i) => pb.zones[i].d?.water || 0)), topGot = M.sum(topN.map((i) => Math.min(zoneGot[i].water, pb.zones[i].d?.water || 0)));
    const tonnes = kg / 1000;
    return {
      cost: plan.cost.transport + plan.cost.handling, trips: nTrips, vehHours, delivered, demand,
      coverage: Object.fromEntries(K.map((k) => [k.key, demand[k.key] > 1e-9 ? Math.min(1, delivered[k.key] / demand[k.key]) : 1])),
      critCoverage: critDem > 0 ? critDel / critDem : 1, avgHours: kg > 0 ? kgT / kg : 0, tonnes,
      costPerTonne: tonnes > 0 ? (plan.cost.transport + plan.cost.handling) / tonnes : 0, gini, leftBehind,
      topNeedWater: topWater > 0 ? topGot / topWater : 1,
    };
  };

  /** Compare the current optimised run with the nearest-store baseline. */
  S.compare = (st) => {
    const run = st?.lastRun; if (!run) return null;
    // A store added after this solve (e.g. new supplies) has no travel times yet: compare on the stores the solve saw.
    const pb = run.pb.depots.length > run.pb.tau.length ? { ...run.pb, depots: run.pb.depots.slice(0, run.pb.tau.length) } : run.pb;
    const base = S.nearestStore(pb);
    const b = S.metrics(pb, base), o = S.metrics(pb, run.alloc, run.cons?.tripsAfter);
    // optimised vehicle hours after consolidation (multi-stop runs replace separate part-loaded trips)
    if (run.cons?.tours?.length) o.vehHours = M.sum(run.cons.tours.map((t) => t.hours || 0));
    const pct = (a, z) => (z > 1e-9 ? (z - a) / z : 0);
    const perT = b.costPerTonne > 0 ? pct(o.costPerTonne, b.costPerTonne) : 0;
    return {
      baseline: b, optimised: o,
      saved: {
        money: b.cost - o.cost, moneyPct: pct(o.cost, b.cost), perTonnePct: perT,
        vehHours: b.vehHours - o.vehHours, vehHoursPct: pct(o.vehHours, b.vehHours),
        trips: b.trips - o.trips, faster: b.avgHours - o.avgHours,
        critPts: o.critCoverage - b.critCoverage, topNeedPts: o.topNeedWater - b.topNeedWater,
        fewerLeftBehind: b.leftBehind.length - o.leftBehind.length,
      },
      epochHours: AA.config.epochHours,
    };
  };

  /** One-sentence verdicts in plain English, best first. */
  S.headlines = (c) => {
    if (!c) return [];
    const f = AA.fmt, s = c.saved, out = [];
    const pctS = (x) => `${Math.round(Math.abs(x) * 100)} %`;
    if (s.money > 1) out.push(`Saves ${f.usd(s.money)} (${pctS(s.moneyPct)}) in transport this ${c.epochHours}-hour period.`);
    else if (s.perTonnePct > 0.02) out.push(`Costs ${f.usd(-s.money)} more in total, because it delivers more, but ${pctS(s.perTonnePct)} less per tonne delivered.`);
    if (s.vehHours > 0.5) out.push(`Uses ${f.n(s.vehHours, 0)} fewer vehicle-hours (${pctS(s.vehHoursPct)}).`);
    if (s.critPts > 0.005) out.push(`Delivers ${Math.round(s.critPts * 100)} percentage points more of the critical need (water and medical).`);
    if (s.topNeedPts > 0.005) out.push(`The highest-need areas get ${Math.round(s.topNeedPts * 100)} points more of their water.`);
    if (s.fewerLeftBehind > 0) out.push(`${s.fewerLeftBehind} fewer area${s.fewerLeftBehind > 1 ? 's are' : ' is'} left with less than half their water.`);
    if (s.faster > 0.05) out.push(`Supplies arrive ${f.min(s.faster)} sooner on average.`);
    if (!out.length) out.push('Here the nearest-store rule happens to give about the same result: stores and areas are close together and stock is enough.');
    return out;
  };

  AA.savings = S;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/models/readiness.js */
/* Pre-season readiness score: is the stock and transport in a district enough for the worst likely (P90)
   first 72 hours of a disaster in each of its high-risk areas?  Pure model, no network.
   Skill: skills/readiness/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const RD = {};
  RD.DAYS = 3;                 // stock must cover the first 72 hours
  RD.REACH_HOURS = 3;          // a store counts for an area if its stock can be on the road there within 3 h
  RD.TRANSPORT_WEIGHT = 2;     // weight of "enough trucks" next to the item weights (criticality)
  RD.GRADES = [[80, 'Ready', 'ready'], [50, 'Partly ready', 'partly'], [0, 'Not ready', 'not']];
  RD.grade = (s) => RD.GRADES.find(([t]) => s >= t);

  /** P90 need for the first 72 hours from forecast zones (same rates and P90 rule as storage-site sizing). */
  RD.need72 = (zones) => {
    const F = AA.fairness, P = AA.prediction, out = {};
    AA.config.commodities.forEach((c) => (out[c.key] = 0));
    let aff = 0;
    zones.forEach((z) => {
      const a = P.scenarioValue(z.fc.aff, 'high'), d = Math.min(a, P.scenarioValue(z.fc.dis, 'high')), inj = P.scenarioValue(z.fc.inj, 'high');
      aff += a;
      AA.config.commodities.forEach((c) => { const r = F.RATES[c.key]; out[c.key] += r.flow ? r.f(a, d, inj) * RD.DAYS : r.f(a, d, inj); });
    });
    return { need: out, affP90: aff };
  };

  /** Inventory rows (Workspace → Inventory source, same columns as the CSV import) → stores in model units. */
  RD.storesFromRows = (rows) => {
    const scaleOf = { water_l: ['water', 1 / 1000], food_kg: ['food', 1 / 1000], tents: ['shelter', 1], medkits: ['medical', 1], staff: ['staff', 1] };
    return (rows || []).map((r, k) => {
      const stock = { water: 0, food: 0, shelter: 0, medical: 0, staff: 0 };
      Object.entries(scaleOf).forEach(([col, [key, f]]) => (stock[key] = (+r[col] || 0) * f));
      return { name: r.name || `Store ${k + 1}`, lat: +r.lat, lon: +r.lon, type: r.type || 'warehouse', address: r.address || '', stock, fleet: { truck: +r.trucks || 0, bus: +r.buses || 0, amb: +r.ambulances || 0 }, prov: 'your inventory' };
    }).filter((s) => isFinite(s.lat) && isFinite(s.lon));
  };
  /** OpenStreetMap facilities with the planning-assumption stock by type (labelled "assumed"). */
  RD.storesFromFacilities = (facs) => (facs || []).map((f) => {
    const t = AA.engine?.STOCK?.[f.type] || AA.engine?.STOCK?.warehouse;
    if (!t) return null;
    return { name: f.name || `${f.type} (unnamed)`, lat: f.lat, lon: f.lon, type: f.type, address: f.address || '', stock: { ...t.stock }, fleet: { ...t.fleet }, prov: 'assumed by facility type' };
  }).filter(Boolean);

  /**
   * areas: [{ name, lat, lon, R, sit, need:{k}, affP90 }]   stores: [{ name, lat, lon, stock:{k}, fleet:{truck,bus} }]
   * tau (optional): [store][area] road hours; default = straight line × circuity at the fallback speed.
   */
  RD.score = (areas, stores, tau = null) => {
    const cfg = AA.config, K = cfg.commodities, P = AA.prediction;
    const hrs = (j, a) => (tau && isFinite(tau[j]?.[a]) ? tau[j][a] : (M.haversine(stores[j], areas[a]) * cfg.circuity) / cfg.fallbackSpeedKmh);
    const W = Object.fromEntries(K.map((k) => [k.key, cfg.criticality[k.key] || 1]));
    const wSum = M.sum(Object.values(W)) + RD.TRANSPORT_WEIGHT;
    const res = areas.map((ar, a) => {
      // a store counts if it is within reach and not itself badly damaged in this area's scenario
      const usable = stores.map((s, j) => {
        const h = hrs(j, a);
        const sev = ar.sit ? P.impact(ar.sit.hazard, P.intensity(ar.sit, M.haversine(ar.sit, s)), ar.sit.countryVul, 0, ar.sit.floodKind).sev : 0;
        return { s, j, h, sev, ok: h <= RD.REACH_HOURS && sev < 0.6 };
      });
      const ok = usable.filter((u) => u.ok);
      const items = K.map((k) => {
        const have = M.sum(ok.map((u) => u.s.stock[k.key] || 0)), need = ar.need[k.key] || 0;
        return { key: k.key, label: k.label, unit: k.unit, have, need, r: need > 1e-9 ? Math.min(1, have / need) : 1, short: Math.max(0, need - have) };
      });
      // transport: can the trucks and buses in reach move the 72-hour need in 72 hours?
      const T = RD.DAYS * 24;
      const cap = (cls) => M.sum(ok.map((u) => (u.s.fleet[cls] || 0) * Math.floor(T / (2 * u.h + cfg.serviceHours)) * cfg.vehicles[cls].cap));
      const kgNeed = (cls) => M.sum(K.filter((k) => k.cls === cls).map((k) => (ar.need[k.key] || 0) * k.kg));
      const capT = cap('truck'), capB = cap('bus'), nT = kgNeed('truck'), nB = kgNeed('bus');
      const rT = nT > 0 ? Math.min(1, capT / nT) : 1, rB = nB > 0 ? Math.min(1, capB / nB) : 1;
      const rTrans = Math.min(rT, rB);
      const cycle = ok.length ? M.mean(ok.map((u) => 2 * u.h + cfg.serviceHours)) : 2 * RD.REACH_HOURS;
      const trucksShort = nT > capT ? Math.ceil((nT - capT) / cfg.vehicles.truck.cap / Math.max(1, Math.floor(T / cycle))) : 0;
      const busesShort = nB > capB ? Math.ceil((nB - capB) / cfg.vehicles.bus.cap / Math.max(1, Math.floor(T / cycle))) : 0;
      const score = (100 * (M.sum(items.map((it) => W[it.key] * it.r)) + RD.TRANSPORT_WEIGHT * rTrans)) / wSum;
      return { area: ar, score, items, transport: { r: rTrans, rT, rB, trucksShort, busesShort, capKg: capT, needKg: nT }, stores: ok.map((u) => ({ name: u.s.name, hours: u.h, prov: u.s.prov })), excluded: usable.filter((u) => !u.ok && u.h <= RD.REACH_HOURS).map((u) => u.s.name) };
    });
    // district: weighted by people at risk (P90 affected); the weakest area is reported separately
    const wts = res.map((r) => Math.max(1, r.area.affP90 || 1));
    const district = res.length ? M.sum(res.map((r, i) => r.score * wts[i])) / M.sum(wts) : 0;
    const weakest = res.slice().sort((a, b) => a.score - b.score)[0] || null;
    // stock to add so that ANY one of these areas could be served (worst single area per item)
    const gaps = K.map((k) => ({ key: k.key, label: k.label, unit: k.unit, add: Math.max(0, ...res.map((r) => r.items.find((x) => x.key === k.key).short)) })).filter((g) => g.add > 1e-6);
    const vehicles = { trucks: Math.max(0, ...res.map((r) => r.transport.trucksShort)), buses: Math.max(0, ...res.map((r) => r.transport.busesShort)) };
    const g = RD.grade(district);
    return { score: district, grade: g[1], gradeKey: g[2], areas: res, weakest, gaps, vehicles, stores: stores.length, provs: [...new Set(stores.map((s) => s.prov))] };
  };

  AA.readiness = RD;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/engine.js */
/* Orchestrator + dynamic response. Skills: orchestrator, dynamic-response */
(function (root) {
  const AA = root.AA, M = AA.math;
  const ENG = {};
  const listeners = new Set();
  ENG.on = (fn) => listeners.add(fn);
  const emit = (type, data) => listeners.forEach((fn) => { try { fn(type, data); } catch (e) { console.error(e); } });

  // Assumed starting stocks by facility type (units per commodity) — labelled "assumed" in UI.
  ENG.STOCK = {
    warehouse: { stock: { water: 300, food: 80, shelter: 2000, medical: 100, staff: 20 }, fleet: { truck: 10, bus: 1, amb: 0 }, repl: 0.1 },
    staging: { stock: { water: 250, food: 60, shelter: 1500, medical: 120, staff: 50 }, fleet: { truck: 8, bus: 2, amb: 2 }, repl: 0.1 },
    hospital: { stock: { water: 40, food: 5, shelter: 0, medical: 300, staff: 80 }, fleet: { truck: 2, bus: 2, amb: 6 }, repl: 0.05 },
    fire_station: { stock: { water: 120, food: 5, shelter: 200, medical: 40, staff: 40 }, fleet: { truck: 4, bus: 1, amb: 2 }, repl: 0.05 },
    police: { stock: { water: 20, food: 5, shelter: 100, medical: 20, staff: 60 }, fleet: { truck: 2, bus: 2, amb: 0 }, repl: 0.02 },
    airlift: { stock: { water: 200, food: 60, shelter: 1000, medical: 150, staff: 40 }, fleet: { truck: 6, bus: 2, amb: 2 }, repl: 0 },
  };
  const TYPE_LABEL = { warehouse: 'Warehouse', staging: 'Staging site (modelled)', hospital: 'Hospital', fire_station: 'Fire station', police: 'Police station', airlift: 'New supply arrival' };
  ENG.TYPE_LABEL = TYPE_LABEL;

  // ---------------- situations ----------------
  const S0 = AA.prediction.ALERT_S0;
  ENG.situationFromEvent = (e) => {
    const sit = { hazard: e.hazard, lat: e.lat, lon: e.lon, name: e.name, country: e.country, iso2: e.iso2 || '', src: e.src, prov: e.prov || 'live', event: e, peakInHours: 0 };
    if (e.hazard === 'EQ') {
      sit.magnitude = +(e.magnitude ?? e.severity ?? 6); sit.depth = Math.max(5, +(e.depth ?? 10));
      if (e.mmi) sit.mmiA = M.clamp(e.mmi - 1.5 * sit.magnitude + 4.0 * Math.log10(sit.depth), 1.0, 4.0);
    } else if (e.hazard === 'TC') {
      sit.magnitude = Math.max(60, +(e.severity || 120));
      // GDACS reports the storm's lifetime maximum wind; cap it to the current episode's alert band
      const cap = { 1: 118, 2: 177 }[e.episodealertscore];
      if (cap && sit.magnitude > cap) { sit.windNote = `Reported ${Math.round(sit.magnitude)} km/h is the lifetime maximum; the current GDACS episode is ${e.episodealertlevel}, so planning uses ${cap} km/h.`; sit.magnitude = cap; }
    } else {
      sit.magnitude = S0[e.alertscore || 1] ?? 0.5;
      if (e.hazard === 'WF') sit.areaKm2 = Math.max(5, (+e.severity || 2000) / 100);

    return sit;
  };
  ENG.situationFromPlan = (p) => {
    const sit = { hazard: p.hazard, lat: p.lat, lon: p.lon, name: p.name, country: p.country, iso2: p.iso2, src: 'Planning scenario', prov: 'scenario', peakInHours: +p.peakInHours || 0 };

    return sit;
  };

  // ---------------- depots ----------------
  const mkDepot = (f, sit, scale, kind) => {
    const t = ENG.STOCK[kind] || ENG.STOCK.warehouse;
    const I = AA.prediction.intensity(sit, M.haversine(sit, f));
    const sev = AA.prediction.impact(sit.hazard, I, sit.countryVul).sev;
    const stock = {}; Object.entries(t.stock).forEach(([k, v]) => (stock[k] = v * scale));
    return { id: '', name: f.name, type: kind, typeLabel: TYPE_LABEL[kind], lat: f.lat, lon: f.lon, sev, open: sev < 0.6, damaged: sev >= 0.6, stock, init: { ...stock }, fleet: { ...t.fleet }, repl: t.repl, prov: kind === 'staging' ? 'modelled' : kind === 'airlift' ? 'event' : 'osm-location / assumed-stock', osm: f.osm, beds: f.beds, address: f.address || '', unnamed: !!f.unnamed || kind === 'staging' };
  };
  ENG.pickDepots = (sit, facs, scale = 1) => {
    const c = sit.focus || sit, R = sit.radiusKm;
    const near = (type, n) => facs.filter((f) => f.type === type).map((f) => ({ f, d: M.haversine(c, f) })).filter((x) => x.d <= R + 30).sort((a, b) => a.d - b.d).slice(0, n).map((x) => x.f);
    const chosen = [...near('warehouse', 3).map((f) => [f, 'warehouse']), ...near('hospital', 3).map((f) => [f, 'hospital']), ...near('fire_station', 2).map((f) => [f, 'fire_station']), ...near('police', 1).map((f) => [f, 'police'])];
    let depots = chosen.map(([f, k]) => mkDepot(f, sit, scale, k));
    // ensure capacity outside the damage footprint: staging sites on a ring when too few are usable
    if (depots.filter((d) => d.open).length < 3 || !depots.some((d) => d.type === 'warehouse')) {
      const ring = Math.min(R + 10, 80);
      [45, 135, 225, 315].forEach((b, k) => { const p = M.destination(c, b, ring); depots.push(mkDepot({ ...p, name: `Staging site ${'ABCD'[k]}` }, sit, scale, 'staging')); });
    }
    depots = depots.slice(0, 10);
    depots.forEach((d, j) => (d.id = 'D' + (j + 1)));
    return depots;
  };

  // ---------------- build a planning state ----------------
  ENG.state = null;
  const progress = (msg) => emit('progress', msg);

  const clone = (o) => JSON.parse(JSON.stringify(o, (k, v) => (v instanceof Set ? [...v] : v)));

  ENG.build = async (sit, opts = {}) => {
    const D = AA.data, P = AA.prediction;
    const sit0 = clone(sit);
    // every external read goes through io(): recorded for saved plans, replayed from the snapshot when restoring
    const snap = opts.snapshot || null, inputs = {};
    const io = async (k, fn) => { if (snap && k in snap) { inputs[k] = snap[k]; if (snap[k] && snap[k].__error) throw new Error(snap[k].__error); return snap[k]; } try { const v = await fn(); inputs[k] = v; return v; } catch (e) { inputs[k] = { __error: e.message }; throw e; } };
    const notes = sit.windNote ? [sit.windNote] : [];
    const ev = sit.event || {};
    const isLive = ev.prov === 'live';
    progress('Reading country vulnerability');
    if (!sit.iso2 || !sit.country) { try { const r = await io('reverse', () => D.reverse(sit.lat, sit.lon)); sit.iso2 = sit.iso2 || r.iso2; sit.country = sit.country || r.country; sit.placeName = r.short; } catch (e) { notes.push('Reverse geocoding unavailable'); } }
    sit.countryIdx = await io('country', () => D.countryIndex(sit.iso2));
    sit.countryVul = sit.countryIdx.vul;
    progress('Locating the impact focus on land');
    try {
      const n = await io('nearest', () => D.osrmNearest(sit));
      if (n && n.offKm > 25) { sit.focus = { lat: n.lat, lon: n.lon, offKm: n.offKm }; notes.push(`Event centre is ${Math.round(n.offKm)} km from the nearest road; planning focus moved to the nearest reachable land point.`); }
    } catch (e) { notes.push('OSRM nearest unavailable'); }
    const gid = ev.eventid || (/^(EQ|TC|FL|VO|DR|WF)-(\d+)$/.exec(ev.id || '') || [])[2];
    const isGdacs = gid && /GDACS/.test(ev.src || '');

    if (sit.hazard === 'FL' && isGdacs) {

      try {
        const polys = await io('footprint', () => D.gdacsGeometry('FL', gid, ev.episodeid));
        if (polys) {
          const bb = M.polysBBox(polys), half = Math.max(M.haversine({ lat: bb.s, lon: bb.c.lon }, { lat: bb.n, lon: bb.c.lon }), M.haversine({ lat: bb.c.lat, lon: bb.w }, { lat: bb.c.lat, lon: bb.e })) / 2;

          sit.radiusKm = M.clamp(half, 20, 120);

          notes.push(`Flood outline from GDACS: about ${Math.round(2 * half)} km across; towns are searched inside it.`);
        }
      } catch (e) { notes.push('GDACS flood outline unavailable; a circle around the event point is used.'); }
    }
    sit.radiusKm = sit.hazard === 'FL' ? (sit.radiusKm || 40) : P.impactRadius(sit);
    const focus = sit.focus || sit;
    const searchKm = Math.min(sit.radiusKm, 120);
    progress('Finding towns, hospitals, fire stations and warehouses (OpenStreetMap)');
    const [pr, fr] = await Promise.allSettled([io('places', () => D.places(focus, searchKm)), io('facs', () => D.facilitiesAny(focus, Math.min(searchKm, 50) + 20))]);
    let places = pr.status === 'fulfilled' ? pr.value : [];
    const facs = fr.status === 'fulfilled' ? fr.value : [];
    if (sit.footprint && places.length) {
      const inside = places.filter((pl) => M.distToPolys(pl, sit.footprint) <= 5);
      if (inside.length >= 3) places = inside;
    }
    if (!places.length) notes.push('No populated places returned by OpenStreetMap; modelled population sectors used.');
    if (!facs.length) notes.push('No facilities returned by OpenStreetMap; modelled staging sites used.');
    if (sit.hazard === 'FL' && !sit.floodKind) {
      progress('Reading terrain to classify the flood (Open-Meteo elevation)');
      try { sit.reliefM = await io('relief', () => D.relief(focus)); } catch (e) { sit.reliefM = null; }
      sit.floodKind = P.floodKind(sit.name, sit.reliefM);
      notes.push(`Flood type: ${P.FLOOD[sit.floodKind].label}${sit.reliefM != null ? ` (terrain relief ${Math.round(sit.reliefM)} m within 20 km)` : ''}. Deaths are modelled at ${sit.floodKind === 'flash' ? '1 in 100' : '1 in 10,000'} people affected.`);
    }
    facs.forEach((f) => { if (!f.name) { f.name = `${TYPE_LABEL[f.type] || 'Facility'} (unnamed on the map)`; f.unnamed = true; } });
    const zones = P.buildZones({ ...sit, lat: sit.lat, lon: sit.lon, focus }, places, 12);
    // name modelled areas and city quarters after the real locality at that spot (Nominatim reverse geocoding)
    const addrCache = (snap && snap.addr) || {};
    inputs.addr = addrCache;
    const toName = zones.filter((z) => z.needsName);
    if (toName.length) {
      progress('Naming areas from the map (OpenStreetMap)');
      const used = new Set(zones.filter((z) => !z.needsName).map((z) => z.name));
      for (const z of toName) {
        const a = await ENG.lookup(z, 16, addrCache);
        if (a && a.locality) {
          let n = z.parent && a.locality !== z.parent ? `${a.locality}, ${z.parent}` : a.locality;
          if (used.has(n)) n = `${n} (${compass(focus, z)})`;
          z.name = n; z.address = a.address; z.locality = a.locality;
        }
        used.add(z.name);
      }
    }
    // population: WorldPop 100 m grid counts people around each zone (replaces OSM tags / defaults)
    if (AA.config.worldpop !== false && !AA.config.lowBandwidth && zones.length) {
      progress('Counting people around each area (WorldPop 100 m grid)');
      try {
        const pops = await io('worldpop', () => ENG.worldpopZones(zones));
        let n = 0;
        zones.forEach((z, i) => { const v = pops.counts[i]; if (v > 0) { z.popOSM = z.pop; z.pop = v; z.popProv = 'WorldPop 2020'; z.catchKm = pops.radii[i]; n++; } });
        if (n) notes.push(`Population from WorldPop 2020 (100 m grid) for ${n} of ${zones.length} areas; each area counts people within ${Math.round(Math.min(...pops.radii))}–${Math.round(Math.max(...pops.radii))} km.`);
        else notes.push('WorldPop returned no counts; OpenStreetMap populations used.');
      } catch (e) { notes.push('WorldPop unavailable; OpenStreetMap populations or defaults used.'); }
    }
    // observed river flow (live floods only): GloFAS discharge vs its yearly median at each zone
    if (sit.hazard === 'FL' && isLive && zones.length) {
      progress('Reading river flow at each area (GloFAS)');
      try {
        const fl = await io('flow', () => D.flowRatios(zones));
        let n = 0;
        zones.forEach((z, i) => { const f = fl[i]; if (f && f.ratio != null) { z.flow = f; z.sObs = P.flowToS(f.ratio); n++; } });

      } catch (e) { notes.push('River-flow data unavailable; flood intensity modelled from distance.'); }
    }
    zones.forEach((z) => { const I = z.sObs != null ? z.sObs : z.I; z.affEst = z.pop * P.impact(sit.hazard, I, sit.countryVul, 0, sit.floodKind).fAff; });

    if (sit.hazard === 'EQ') {
      const uid = D.usgsIdOf(ev);

      if (uid) { progress('Reading the USGS PAGER loss estimate'); try { pg = await io('pager', () => D.pagerLosses(uid)); } catch (e) { notes.push('USGS PAGER loss estimate unavailable.'); } }
      if (pg) {
        fcast.pagerLosses = P.applyPagerLosses(fcast, zones, pg, sit.countryVul); fcast.pagerLosses.url = pg.url; fcast.pagerLosses.median = pg.median;

        notes.push(`USGS PAGER (${pg.level}): deaths most likely ${Math.round(q.p50).toLocaleString()} (10–90 % range ${Math.round(q.p10).toLocaleString()}–${Math.round(q.p90).toLocaleString()}); used instead of our curve${fcast.pagerLosses.aff ? `; people affected from PAGER shaking exposure ${Math.round(fcast.pagerLosses.aff).toLocaleString()}` : ''}.`);

        }

    }
    const depots = ENG.pickDepots(sit, facs, opts.supplyScale || 1);
    const hospitals = facs.filter((f) => f.type === 'hospital').map((h) => ({ ...h, d: M.haversine(focus, h), sev: P.impact(sit.hazard, P.intensity(sit, M.haversine(sit, h)), sit.countryVul, 0, sit.floodKind).sev }))
      .filter((h) => h.sev < 0.6).sort((a, b) => a.d - b.d).slice(0, 5).map((h, k) => ({ ...h, id: 'H' + (k + 1), beds: Math.round((h.beds || 150) * 0.3), bedsProv: h.beds ? 'osm×30% free' : 'assumed 150×30% free' }));

  };

  /** WorldPop counts for each zone's catchment circle; 3 requests at a time; overall budget ~60 s. */
  ENG.worldpopZones = async (zones) => {
    const radii = AA.prediction.catchments(zones), out = new Array(zones.length).fill(null);
    let next = 0; const t0 = Date.now();
    const worker = async () => { while (next < zones.length && Date.now() - t0 < 60000) { const i = next++; try { out[i] = await AA.data.worldpop(M.circleRing(zones[i], radii[i])); } catch (e) { out[i] = null; } } };

  };

  // ---------------- addresses ----------------
  const compass = (c, p) => { const b = (Math.atan2((p.lon - c.lon) * Math.cos(M.toRad(c.lat)), p.lat - c.lat) * 180 / Math.PI + 360) % 360; return ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'][Math.round(b / 45) % 8]; };

  /** Reverse-geocode a point once; results kept in the plan (state.inputs.addr) so saved plans reopen without lookups. */
  ENG.lookup = async (p, zoom = 18, cache = ENG.state?.inputs?.addr || {}) => {
    const key = `${(+p.lat).toFixed(4)},${(+p.lon).toFixed(4)},${zoom}`;
    if (key in cache) return cache[key];
    try { const a = await AA.data.reverseDetail(p.lat, p.lon, zoom); cache[key] = a; return a; } catch (e) { return null; }
  };
  /** Fill in street addresses for storage sites, supply stores, hospitals and areas (in that order), in the background.
   *  Uses OSM address tags when present; otherwise Nominatim at ≤ 1 request/s. Emits 'addresses' after each group. */
  let enriching = null, enrichAgain = false;
  ENG.enrichAddresses = () => {
    if (enriching) { enrichAgain = true; return enriching; }
    enriching = (async () => {
      do {
        enrichAgain = false;
        const st = ENG.state; if (!st) break;
        const sites = st.warehouses ? st.warehouses.sizes.map((x) => st.warehouses.cand[x.j]) : [];
        const groups = [['storage', sites], ['stores', st.depots], ['hospitals', st.hospitals], ['areas', st.zones]];
        for (const [g, items] of groups) {
          let changed = false;
          for (const it of items) {
            if (ENG.state !== st) return;
            if (it.address && !it.unnamed) continue;
            const a = await ENG.lookup(it, g === 'areas' ? 17 : 18, st.inputs.addr);
            if (!a) { it.addressPending = false; changed = true; continue; }
            if (!it.address) it.address = a.address;
            it.locality = it.locality || a.locality;
            if (it.unnamed) {

              it.name = it.type === 'staging' ? `${it.name.split(' near ')[0]}${where ? ` near ${where}` : ''}` : `${TYPE_LABEL[it.type] || 'Facility'}${where ? ` on ${where}` : ''}`;
              it.unnamed = false;
            }
            changed = true;
          }
          if (changed) emit('addresses', g);
        }
      } while (enrichAgain);
    })().finally(() => { enriching = null; });
    return enriching;
  };

  // ---------------- decision log ----------------
  /** Append an entry to the decision log (who, when, what, why). */
  ENG.decide = (type, p = {}, reason = '', note = '') => {
    const st = ENG.state; if (!st) return;
    const who = AA.workspace ? AA.workspace.me() : { name: 'Local user', role: 'planner' };
    st.decisions.push({ at: new Date().toISOString(), epoch: st.epoch, by: who.name, role: who.role, type, reason, note: note || p.note || '' });
    emit('decision', st.decisions[st.decisions.length - 1]);
  };

  // ---------------- saved plans ----------------
  /** Everything needed to rebuild this plan later, offline: original situation, recorded inputs, and the event list. */
  ENG.snapshot = (name) => {
    const st = ENG.state; if (!st) return null;
    const sm = st.fcast.summary;
    return {
      v: 1, name: name || st.sit.name || 'Plan', savedAt: new Date().toISOString(), savedBy: AA.workspace ? AA.workspace.me().name : 'Local user',
      sit0: st.sit0, opts: st.opts, inputs: clone(st.inputs), events: clone(st.events), decisions: clone(st.decisions), collab: AA.collab ? AA.collab.snapshot(st) : undefined,
      summary: { hazard: st.sit.hazard, place: st.sit.placeName || st.sit.country || '', epoch: st.epoch, zones: st.zones.length, affected: Math.round(sm.aff.p50), displaced: Math.round(sm.dis.p50), deaths: Math.round(sm.fat.p50), cost: Math.round(st.lastRun?.alloc?.cost?.total || 0) },
    };
  };
  /** Rebuild a saved plan: same inputs (no new downloads unless missing), then replay every decision in order. */
  ENG.restore = async (snap) => {
    if (!snap || snap.v !== 1) throw new Error('Not an AidAtlas plan file');
    await ENG.build(clone(snap.sit0), { ...snap.opts, snapshot: snap.inputs || {} });
    const st = ENG.state;
    for (const e of snap.events || []) await ENG.event(e.type, clone(e.p), { replay: true });

  };

  ENG.refreshTable = async (io) => {
    const st = ENG.state;
    const pts = [...st.depots, ...st.zones, ...st.hospitals];
    progress('Building road travel-time matrix (OSRM)');
    try { st.table = io ? await io('table0', () => AA.data.osrmTable(pts)) : await AA.data.osrmTable(pts); st.tableProv = 'OSRM road network'; }
    catch (e) { st.table = null; st.tableProv = 'estimated (haversine × 1.35 at 40 km/h)'; st.notes.push('OSRM table unavailable; travel times estimated.'); }

  };
  const sub = (st, fromKind, fromList, toKind, toList) => {
    if (!st.table) return null;
    const ix = st.tableIdx; const nD = ix.d.length, nZ = ix.z.length;
    const off = { d: 0, z: nD, h: nD + nZ };
    const fi = fromList.map((x) => ix[fromKind].indexOf(x.id)), ti = toList.map((x) => ix[toKind].indexOf(x.id));

  };

  // ---------------- one optimisation pass ----------------
  let solving = Promise.resolve();
  ENG.solve = (reason) => (solving = solving.then(() => solveInner(reason)).catch((e) => { console.error(e); emit('error', e.message); }));

  const solveInner = async (reason, depth = 0, basePrev = null) => {
    const st = ENG.state, sit = st.sit, R = AA.routing, F = AA.fairness, E = AA.efficiency;
    progress('Optimising allocation');
    F.netDemand(st.zones, sit, st.epoch);
    const dz = R.adjustMatrix(sit, st, st.depots, st.zones, sub(st, 'd', st.depots, 'z', st.zones));
    const zz = R.adjustMatrix(sit, st, st.zones, st.zones, sub(st, 'z', st.zones, 'z', st.zones));

    st.depots.forEach((d, j) => st.zones.forEach((z, i) => { if (st.blocked.has(`${d.id}>${z.id}`)) dz.tau[j][i] = Infinity; }));

    const accRaw = st.zones.map((z, i) => {
      const ts = st.depots.map((d, j) => (d.open ? dz.tau[j][i] : Infinity)).filter(isFinite);

    const accN = M.minmax(accRaw); st.zones.forEach((z, i) => { z.acc = accN[i]; z.accHours = accRaw[i]; });
    F.needScores(st.zones, sit);
    const pb = { zones: st.zones, depots: st.depots, tau: dz.tau, dist: dz.dist };
    const alloc = E.allocate(pb, { objective: st.objective });
    const cons = E.consolidate(pb, alloc, zz.tau);
    // casualties → hospitals
    const ramp = AA.prediction.rampAt(sit, (st.epoch + 1) * AA.config.epochHours);
    const cas = st.zones.map((z) => Math.max(0, 0.25 * z.fc.inj.p50 * ramp * (z.surge || 1) - (st.transported[z.id] || 0)));
    const A = M.sum(st.depots.filter((d) => d.open).map((d) => d.fleet.amb || 0));
    const casualty = E.casualties(cas, st.hospitals, zh.tau, A);
    const prev = depth ? basePrev : st.lastRun;
    st.lastRun = { reason, epoch: st.epoch, at: new Date().toISOString(), pb, alloc, cons, casualty, cas, ambulances: A, matrices: { dz, zz, zh }, legs: [], routing: 'pending' };
    st.lastRun.diff = diffRuns(prev, st.lastRun);
    if (depth) st.log.shift(); // a re-solve replaces its own entry
    st.log.unshift({ epoch: st.epoch, reason, diff: st.lastRun.diff, cost: alloc.cost.total, method: alloc.method });
    emit('solved', st.lastRun);
    // route legs progressively, then re-solve once if any (depot, zone) pair turned out isolated
    const newlyBlocked = await routeAll(st.lastRun);
    if (newlyBlocked && depth < 2) { await solveInner(`${reason.split(' → ')[0]} → re-solved without ${st.blocked.size} isolated road arc(s)`, depth + 1, prev); }
  };

  const routeAll = async (run) => {
    const st = ENG.state, sit = st.sit, R = AA.routing;
    const pairs = new Map();
    run.cons.tours.forEach((t, ti) => {
      let prev = { kind: 'd', idx: t.j };
      t.stops.forEach((i) => { const key = `${prev.kind}${prev.idx}>z${i}|${t.cls}`; if (!pairs.has(key)) pairs.set(key, { from: prev, to: { kind: 'z', idx: i }, cls: t.cls, tours: [] }); pairs.get(key).tours.push(ti); prev = { kind: 'z', idx: i }; });
    });
    const ptOf = (p) => (p.kind === 'd' ? st.depots[p.idx] : st.zones[p.idx]);
    let blocked = 0;
    const closuresKey = st.closures.map((c) => c.lat.toFixed(4) + c.lon.toFixed(4)).join('|') + '#' + st.epoch + '#' + st.shocks.length + '#' + st.congestion;
    for (const [key, p] of pairs) {
      if (st.lastRun !== run) return 0; // superseded by a newer solve
      const a = ptOf(p.from), b = ptOf(p.to);
      const ck = `${a.lat.toFixed(4)},${a.lon.toFixed(4)}>${b.lat.toFixed(4)},${b.lon.toFixed(4)}|${p.cls}|${closuresKey}`;
      let res = st.routeCache.get(ck);
      if (!res) { res = await R.routeLeg(sit, st, a, b, p.cls); st.routeCache.set(ck, res); }
      const leg = { key, from: p.from, to: p.to, cls: p.cls, tours: p.tours, a, b, ...res };
      run.legs.push(leg);
      emit('leg', leg);
      if (res.airdrop && p.from.kind === 'd') { const k = `${st.depots[p.from.idx].id}>${st.zones[p.to.idx].id}`; if (!st.blocked.has(k)) { st.blocked.add(k); blocked++; } }
    }
    run.routing = 'done';
    emit('routed', run);
    return blocked;
  };

  const diffRuns = (a, b) => {
    if (!a) return null;
    const K = AA.config.commodities;
    const unmet = (r) => { const o = {}; K.forEach((k) => (o[k.key] = M.sum(r.alloc.unmet.map((u) => u[k.key] || 0)))); return o; };
    const ua = unmet(a), ub = unmet(b);
    const trips = (r) => { const o = {}; r.alloc.trips.forEach((t) => { const id = r.pb.zones[t.i].id; o[id] = (o[id] || 0) + t.n; }); return o; };
    const ta = trips(a), tb = trips(b);
    const ids = new Set([...Object.keys(ta), ...Object.keys(tb)]);
    const redirected = [...ids].map((id) => ({ id, before: ta[id] || 0, after: tb[id] || 0 })).filter((x) => x.before !== x.after);
    return { unmet: K.map((k) => ({ k: k.key, before: ua[k.key], after: ub[k.key] })), cost: { before: a.alloc.cost.total, after: b.alloc.cost.total }, redirected };
  };

  // ---------------- warehouses (pre-positioning) ----------------
  ENG.planWarehouses = async () => {
    const st = ENG.state, sit = st.sit, FL = AA.facility;
    progress('Choosing storage sites (MCLP)');
    const cand = FL.candidates(sit);
    st.depots.forEach((d) => cand.push({ lat: d.lat, lon: d.lon, sev: d.sev, safe: d.sev <= 0.3, kind: 'existing', name: d.name }));
    let base = null;
    try {
      const t = await AA.data.osrmTable([...cand, ...st.zones]);
      const n = cand.length;
      base = { dur: cand.map((_, a) => st.zones.map((_, b) => t.dur[a][n + b])), dist: cand.map((_, a) => st.zones.map((_, b) => t.dist[a][n + b])) };
      cand.forEach((c, k) => { if (c.kind === 'grid' && t.snapped[k] && t.snapped[k].offKm < 5) { c.lat = t.snapped[k].lat; c.lon = t.snapped[k].lon; } });
    } catch (e) { st.notes.push('Warehouse travel times estimated (OSRM unavailable).'); }
    const m = AA.routing.adjustMatrix(sit, st, cand, st.zones, base);
    const sol = FL.mclp(st.zones, cand, m.tau);
    const sizes = FL.size(st.zones, sol);
    st.warehouses = { cand, sol, sizes, tau: m.tau };
    emit('warehouses', st.warehouses);
    return st.warehouses;
  };

  // ---------------- dynamic events ----------------
  ENG.event = async (type, p = {}, meta = {}) => {
    const st = ENG.state; if (!st) return;
    if (!meta.replay && AA.workspace && !AA.workspace.can('edit')) { emit('error', `Your role (${AA.workspace.me().role}) can view plans but not change them.`); return; }
    if (type !== 'advance') st.events.push({ type, p: clone(p), at: new Date().toISOString() });
    const z = p.zoneId ? st.zones.find((x) => x.id === p.zoneId) : null;
    const d = p.depotId ? st.depots.find((x) => x.id === p.depotId) : null;
    let reason = '';
    switch (type) {
      case 'surge': z.surge = (z.surge || 1) * 1.5; z.served = false; reason = `Demand surge +50 % in ${z.name}`; break;
      case 'served': z.served = true; reason = `${z.name} marked sufficiently served`; break;
      case 'unserved': z.served = false; reason = `${z.name} needs aid again`; break;
      case 'depot': d.open = !d.open; reason = `${d.name} ${d.open ? 'back online' : 'offline'}`; break;
      case 'breakdown': d.fleet.truck = Math.max(0, d.fleet.truck - 1); reason = `Truck breakdown at ${d.name}`; break;
      case 'closure': st.closures.push({ lat: p.lat, lon: p.lon }); reason = `Road closed near ${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}`; break;
      case 'clearClosures': st.closures = []; st.blocked.clear(); reason = 'All road closures cleared'; break;
      case 'aftershock': {
        st.shocks.push({ lat: p.lat ?? st.sit.lat, lon: p.lon ?? st.sit.lon, radiusKm: 0.5 * st.sit.radiusKm, eta: 0.35, epoch: st.epoch });
        st.zones.forEach((zz) => { if (M.haversine(zz, { lat: p.lat ?? st.sit.lat, lon: p.lon ?? st.sit.lon }) < 0.5 * st.sit.radiusKm) zz.surge = (zz.surge || 1) * 1.15; });
        reason = 'Aftershock / new damage: roads degraded, demand +15 % nearby'; break;
      }
      case 'supply': {
        const nd = mkDepot({ lat: p.lat, lon: p.lon, name: `Supply arrival ${st.depots.length + 1}` }, st.sit, st.supplyScale, 'airlift');
        nd.id = 'D' + (st.depots.length + 1); st.depots.push(nd); await ENG.refreshTable();
        reason = `New supplies arrived at ${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}`; break;
      }
      case 'congestion': st.congestion = st.congestion > 1 ? 1 : 1.4; reason = st.congestion > 1 ? 'Congestion: travel times +40 %' : 'Congestion cleared'; break;
      case 'spread': {
        const P = AA.prediction;
        let pl = p._place;
        if (pl === undefined) { let places = []; try { places = await AA.data.places(p, 6); } catch (e) {} pl = places.sort((a, b) => M.haversine(p, a) - M.haversine(p, b))[0] || null; st.events[st.events.length - 1].p._place = pl; }
        const pop = pl ? pl.population || 1500 : 400 * Math.PI * 25;
        const nz = { id: 'Z' + (st.zones.length + 1), name: pl ? `${pl.name} (spread)` : 'New affected area', lat: p.lat, lon: p.lon, pop, type: pl?.type || 'sector', popProv: pl?.population ? 'osm' : 'modelled', rural: 0.8, recv: {}, surge: 1, spread: true };
        nz.distKm = 0.3 * st.sit.radiusKm; nz.I = P.intensity(st.sit, nz.distKm);
        P.forecast(st.sit, [nz]); st.zones.push(nz); await ENG.refreshTable();
        reason = `Disaster spread to ${nz.name}`; break;
      }
      case 'report': {
        const prior = { mu: z.sevPost ?? z.sevMean, sd: z.sevSd ?? 0.15 };
        const post = AA.prediction.bayes(prior.mu, prior.sd, p.value, p.sd || 0.1);
        z.sevPost = M.clamp(post.mu, 0, 1); z.sevSd = post.sd;
        z.bayes = { prior, obs: { y: p.value, sd: p.sd || 0.1 }, post };
        reason = `Field report for ${z.name}: severity ${prior.mu.toFixed(2)} → ${post.mu.toFixed(2)}`; break;
      }
      case 'supplyScale': {
        st.supplyScale = p.value; st.depots.forEach((dp) => { const t = ENG.STOCK[dp.type]; if (!t) return; Object.keys(dp.stock).forEach((k) => { const used = dp.init[k] - dp.stock[k]; dp.init[k] = t.stock[k] * p.value; dp.stock[k] = Math.max(0, dp.init[k] - used); }); });
        reason = `Supply level set to ${p.value}×`; break;
      }
      case 'importDepots': {
        const scaleOf = { water_l: ['water', 1 / 1000], food_kg: ['food', 1 / 1000], tents: ['shelter', 1], medkits: ['medical', 1], staff: ['staff', 1] };
        const nd = p.rows.map((r, k) => {
          const stock = { water: 0, food: 0, shelter: 0, medical: 0, staff: 0 };
          Object.entries(scaleOf).forEach(([col, [key, f]]) => (stock[key] = (+r[col] || 0) * f));
          const I = AA.prediction.intensity(st.sit, M.haversine(st.sit, r));
          const sev = AA.prediction.impact(st.sit.hazard, I, st.sit.countryVul).sev;
          return { id: 'D' + (k + 1), name: r.name || `Store ${k + 1}`, type: r.type || 'warehouse', typeLabel: `${TYPE_LABEL[r.type] || 'Store'} (your inventory)`, lat: +r.lat, lon: +r.lon, sev, open: sev < 0.6, damaged: sev >= 0.6, stock, init: { ...stock }, fleet: { truck: +r.trucks || 0, bus: +r.buses || 0, amb: +r.ambulances || 0 }, repl: 0, prov: 'imported inventory', beds: +r.beds || 0, address: r.address || '' };
        }).filter((d) => isFinite(d.lat) && isFinite(d.lon));
        if (!nd.length) return;
        st.depots = nd; st.blocked.clear(); await ENG.refreshTable();
        reason = `Imported ${nd.length} supply stores from your inventory`; break;
      }
      case 'objective': st.objective = { ...AA.config.objective, ...p }; reason = 'Policy weights changed'; break;
      case 'advance': {
        // record what was actually dispatched, so a restored plan reproduces the same deliveries and stock
        const run = st.lastRun; if (!run) return;
        const executed = p.executed || { ship: run.alloc.ship.map((x) => ({ i: x.i, j: x.j, k: x.k, qty: x.qty })), cas: run.casualty.flows.map((x) => ({ i: x.i, h: x.h, n: x.n })) };
        if (!meta.replay) st.events.push({ type: 'advance', p: { executed }, at: new Date().toISOString() });
        return ENG.advance(meta, executed);
      }
      default: return;
    }
    st.routeCache.clear();
    if (!meta.replay) ENG.decide(type, p, reason, meta.note);
    const done = ENG.solve(reason);
    if (['supply', 'importDepots', 'spread'].includes(type)) done.then(() => ENG.enrichAddresses());
    return done;
  };

  /** Rolling-horizon step: execute first-epoch decisions only, then re-optimise. */
  ENG.advance = async (meta = {}, executed = null) => {
    const st = ENG.state, run = st.lastRun; if (!run) return;
    const ex = executed || { ship: run.alloc.ship, cas: run.casualty.flows };
    ex.ship.forEach((s) => {
      const z = st.zones[s.i], dp = st.depots[s.j];
      z.recv[s.k] = (z.recv[s.k] || 0) + s.qty;
      dp.stock[s.k] = Math.max(0, dp.stock[s.k] - s.qty);
    });
    ex.cas.forEach((f) => { const id = st.zones[f.i].id; st.transported[id] = (st.transported[id] || 0) + f.n; st.hospitals[f.h].beds = Math.max(0, st.hospitals[f.h].beds - f.n); });
    st.depots.forEach((dp) => { if (dp.open && dp.repl) Object.keys(dp.stock).forEach((k) => (dp.stock[k] += dp.init[k] * dp.repl)); });
    st.epoch += 1;
    st.routeCache.clear();
    if (!meta.replay) ENG.decide('advance', {}, `Advanced to T+${st.epoch * AA.config.epochHours} h`, meta.note);
    return ENG.solve(`Advanced to T+${st.epoch * AA.config.epochHours} h: deliveries recorded, stock replenished, roads partly cleared`);
  };

  AA.engine = ENG;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/pipelines.js */
/* Multi-step analyses shared by the app and the public API (server/api.js): risk grid for a place,
   design scenarios for its high-risk areas, pre-season readiness. Network reads happen here; the maths is in
   js/models/*. Skill: skills/risk-assessment/SKILL.md, skills/readiness/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const PL = {};
  const noop = () => {};

  /** Forecast only (no stores, no routing): country vulnerability → impact radius → places (OSM) → zones →
   *  optional WorldPop counts → 400-draw Monte Carlo. Shared by the API (/v1/forecast) and the back-test. */
  PL.forecast = async (sit, opts = {}) => {
    const D = AA.data, P = AA.prediction, notes = [], step = opts.step || noop;
    if (!sit.iso2 && opts.reverse !== false) { try { const r = await D.reverse(sit.lat, sit.lon); sit.iso2 = r.iso2; sit.country = sit.country || r.country; } catch (e) { notes.push('Country lookup unavailable.'); } }
    try { sit.countryIdx = await D.countryIndex(sit.iso2); } catch (e) { sit.countryIdx = { vul: 0.5, lcc: 0.5, prov: 'assumed' }; notes.push('Country indicators unavailable; vulnerability assumed 0.5.'); }
    sit.countryVul = sit.countryIdx.vul;
    sit.radiusKm = sit.hazard === 'FL' ? (sit.radiusKm || 40) : P.impactRadius(sit);
    step('Finding towns (OpenStreetMap)…');
    let places = []; try { places = await D.places(sit, Math.min(sit.radiusKm, 120)); } catch (e) { notes.push('OpenStreetMap places unavailable; modelled population sectors used.'); }
    const zones = P.buildZones(sit, places, 12);
    if (opts.worldpop && zones.length) {
      step('Counting people (WorldPop)…');
      try { const pops = await AA.engine.worldpopZones(zones); zones.forEach((z, i) => { const v = pops.counts[i]; if (v > 0) { z.pop = v; z.popProv = 'WorldPop 2020'; } }); } catch (e) { notes.push('WorldPop unavailable; OpenStreetMap populations used.'); }
    }
    const fc = P.forecast(sit, zones);
    return { sit, zones, fc, places: places.length, notes };
  };

  /** Default design intensity per hazard (same as the Plan-mode defaults). */
  PL.DESIGN = { TC: 200, FL: 0.8, WF: 0.8, VO: 0.9, DR: 0.7 };

  /** 6 × 6 risk grid (~120 × 120 km) around a place, top 5 cells named after their locality. */
  PL.risk = async (place, step = noop, opts = {}) => {
    const D = AA.data, RK = AA.risk, half = opts.halfKm || 60, n = opts.n || 6;
    const cells = RK.grid(place, half, n);
    step('Reading earthquake catalogue (USGS, since 1973)…');
    const eq = await D.usgsHistory(place.lat, place.lon, 400, 4.5, '1973-01-01').catch(() => []);
    step('Reading storm, flood, fire and volcano records (GDACS, EONET)…');
    const deg = 2.5;
    const [g, e] = await Promise.allSettled([place.country ? D.gdacsHistory(place.country) : Promise.resolve([]), D.eonetHistory([place.lon - deg, place.lat - deg, place.lon + deg, place.lat + deg])]);
    const events = [...(g.status === 'fulfilled' ? g.value : []), ...(e.status === 'fulfilled' ? e.value : [])].filter((x) => x.hazard !== 'EQ' && M.haversine(place, x) < 300);
    step('Reading 20 years of river discharge (GloFAS) and elevation…');
    let q100 = null, elev = null;
    try {
      const lats = cells.map((c) => c.lat.toFixed(3)), lons = cells.map((c) => c.lon.toFixed(3));
      const y1 = new Date().getUTCFullYear() - 1;
      const [fl, el] = await Promise.all([D.floodSeries(lats, lons, `${y1 - 19}-01-01`, `${y1}-12-31`), D.elevation(lats, lons)]);
      elev = el.elevation;
      const arr = Array.isArray(fl) ? fl : [fl];
      q100 = arr.map((loc) => {
        const t = loc.daily.time, q = loc.daily.river_discharge; const byY = {};
        t.forEach((d, k) => { const y = d.slice(0, 4); if (q[k] != null) byY[y] = Math.max(byY[y] ?? 0, q[k]); });
        const gm = RK.gumbel(Object.values(byY)); return gm ? Math.max(0, gm.q(100)) : NaN;
      });
    } catch (err) { /* discharge unavailable: flood hazard falls back to event frequency */ }
    step('Reading population and hospitals (OpenStreetMap)…');
    const [pl, fac, ci] = await Promise.all([D.places(place, half + 10).catch(() => []), D.facilities(place, half + 10).catch(() => []), D.countryIndex(place.iso2)]);
    const res = RK.assess(cells, { eq, eqYears: new Date().getUTCFullYear() - 1973, events, eventYears: new Date().getUTCFullYear() - 2000, q100, elev, places: pl, hospitals: fac.filter((x) => x.type === 'hospital'), country: ci });
    res.cells.forEach((c) => { const near = pl.slice().sort((a, b) => M.haversine(c, a) - M.haversine(c, b))[0]; c.name = near && M.haversine(c, near) < 15 ? `Around ${near.name}` : `Cell ${c.id.slice(1)} (${c.lat.toFixed(2)}, ${c.lon.toFixed(2)})`; });
    const top = res.cells.slice().sort((a, b) => b.R - a.R).slice(0, 5);
    const compass = (c) => { const b = (Math.atan2(c.lon - place.lon, c.lat - place.lat) * 180 / Math.PI + 360) % 360; return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(b / 45) % 8]; };
    step('Naming the high-risk areas…');
    for (const c of top) {
      try { const a = await D.reverseDetail(c.lat, c.lon, 14); if (a.locality) { c.name = `${a.locality}${a.city && a.city !== a.locality ? `, ${a.city}` : ''}`; c.address = a.address; } } catch (err) { /* keep the fallback name */ }
    }
    top.forEach((c) => { if (top.filter((o) => o.name === c.name).length > 1) c.name = `${c.name} (${compass(c)}, ${Math.round(M.haversine(place, c))} km)`; });
    return { place: place.short || place.name, placeObj: place, gr: res.gr, top, cells: res.cells, counts: `${eq.length} earthquakes, ${events.length} other events, ${q100 ? 'GloFAS discharge' : 'no discharge data'}`, places: pl, facs: fac, country: ci };
  };

  /** Design scenario for one high-risk cell: its dominant hazard at a 1-in-475-year size (earthquakes) or the default intensity. */
  PL.scenario = (c, rr) => {
    const hzd = c.dominant, place = rr.placeObj || {};
    const mag = hzd === 'EQ' ? Math.min(8, Math.max(6.5, rr.gr.a != null ? (rr.gr.a - Math.log10(1 / 475)) / rr.gr.b : 6.5)) : PL.DESIGN[hzd];
    return AA.engine.situationFromPlan({ lat: c.lat, lon: c.lon, name: `${AA.HAZARDS[hzd].label} risk scenario · ${c.name}`, country: rr.country ? place.country : '', iso2: place.iso2, hazard: hzd, magnitude: mag, depth: 10, peakInHours: 24, areaKm2: 200 });
  };

  /** Readiness of the district for each of its top-5 high-risk areas. opts.rows = inventory rows (else OSM + assumed stock). */
  PL.readiness = async (rr, opts = {}) => {
    const P = AA.prediction, RD = AA.readiness, step = opts.step || noop;
    step('Forecasting the worst likely case (P90) in each high-risk area…');
    const areas = rr.top.map((c) => {
      const sit = PL.scenario(c, rr);
      sit.countryVul = rr.country?.vul ?? 0.5;
      sit.radiusKm = sit.hazard === 'FL' ? (sit.radiusKm || 40) : P.impactRadius(sit);
      const zones = P.buildZones(sit, rr.places || [], 12);
      P.forecast(sit, zones);
      const { need, affP90 } = RD.need72(zones);
      return { name: c.name, lat: c.lat, lon: c.lon, R: c.R, hazard: c.dominant, sit, need, affP90, zones: zones.length };
    });
    const stores = opts.rows?.length ? RD.storesFromRows(opts.rows) : RD.storesFromFacilities(rr.facs);
    let tau = null;
    if (opts.roads !== false && stores.length && stores.length <= 90) {
      step('Reading road travel times from stores to each area (OSRM)…');
      try { const t = await AA.data.osrmTable([...stores, ...areas]); const n = stores.length; tau = stores.map((_, j) => areas.map((_, a) => (t.dur[j][n + a] != null ? t.dur[j][n + a] / 3600 : NaN))); } catch (e) { tau = null; }
    }
    const out = RD.score(areas, stores, tau);
    out.place = rr.place; out.source = opts.rows?.length ? (opts.sourceLabel || 'your inventory') : 'OpenStreetMap facilities with assumed stock';
    out.roads = tau ? 'OSRM road network' : `estimated (straight line × ${AA.config.circuity} at ${AA.config.fallbackSpeedKmh} km/h)`;
    out.at = new Date().toISOString();
    return out;
  };

  AA.pipelines = PL;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/field.js */
/* Field reports: what a field team sees on the ground (location, photo, damage, needs, road access), shared with
   the control room and fed into the plan's Bayesian severity update.
   Two ways to send: (1) the shared back end (Supabase table field_reports + storage bucket field-photos), or
   (2) with no back end, a short text code ("AA1.…") sent by WhatsApp/SMS and pasted into the plan.
   Used by field.html (the field app) and the plan view. Skill: skills/field-app/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const FR = {};

  FR.DAMAGE = [
    { v: 0, key: 'none', label: 'No damage', hint: 'Buildings and roads intact' },
    { v: 0.25, key: 'minor', label: 'Minor', hint: 'Cracks, broken windows, some flooding of streets' },
    { v: 0.5, key: 'moderate', label: 'Moderate', hint: 'Some homes unsafe, water inside houses, people leaving' },
    { v: 0.75, key: 'severe', label: 'Severe', hint: 'Many homes collapsed or flooded to the roof, injuries' },
    { v: 1, key: 'destroyed', label: 'Destroyed', hint: 'Most buildings down or washed away' },
  ];
  FR.NEEDS = [['water', 'Water'], ['food', 'Food'], ['shelter', 'Shelter'], ['medical', 'Medical'], ['rescue', 'Search & rescue']];
  FR.ROAD = { open: 'Road open', partly: 'Road partly blocked', blocked: 'Road blocked' };
  FR.SD = { trained: 0.1, crowd: 0.2 };
  FR.damageLabel = (v) => (FR.DAMAGE.slice().sort((a, b) => Math.abs(a.v - v) - Math.abs(b.v - v))[0] || FR.DAMAGE[0]).label;

  const uid = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const num = (x, d = 0) => (isFinite(+x) ? Math.max(0, Math.round(+x)) : d);

  /** Clean and validate a report; throws with a plain message when unusable. */
  FR.normalise = (r) => {
    if (!r || typeof r !== 'object') throw new Error('Empty report');
    const lat = +r.lat, lon = +r.lon;
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) throw new Error('Report has no valid location');
    const damage = M.clamp(+r.damage, 0, 1);
    if (!isFinite(damage)) throw new Error('Report has no damage level');
    const needs = [...new Set((r.needs || []).filter((n) => FR.NEEDS.some(([k]) => k === n)))];
    return {
      id: String(r.id || uid()).slice(0, 40), at: r.at && !isNaN(Date.parse(r.at)) ? new Date(r.at).toISOString() : new Date().toISOString(),
      lat: +lat.toFixed(6), lon: +lon.toFixed(6), acc: isFinite(+r.acc) ? Math.round(+r.acc) : null,
      damage, needs, people: { affected: num(r.people?.affected), injured: num(r.people?.injured), trapped: num(r.people?.trapped) },
      road: FR.ROAD[r.road] ? r.road : 'open', note: String(r.note || '').slice(0, 500), by: String(r.by || '').slice(0, 80), team: String(r.team || '').slice(0, 80),
      trained: !!r.trained, place: String(r.place || '').slice(0, 120), photo: r.photo || null, photoUrl: r.photoUrl || null, plan: String(r.plan || '').slice(0, 80),
    };
  };

  // ---------------- text code (no back end) ----------------
  const b64 = {
    enc: (s) => (typeof btoa === 'function' ? btoa(unescape(encodeURIComponent(s))) : Buffer.from(s, 'utf8').toString('base64')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
    dec: (s) => { const t = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4); return typeof atob === 'function' ? decodeURIComponent(escape(atob(t))) : Buffer.from(t, 'base64').toString('utf8'); },
  };
  const check = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).slice(-4).padStart(4, '0'); };
  /** Compact code for WhatsApp/SMS. The photo is not included (send it separately). */
  FR.encode = (r) => {
    const n = FR.normalise(r);
    const o = { i: n.id, t: n.at, a: n.lat, o: n.lon, c: n.acc, d: n.damage, n: n.needs, p: [n.people.affected, n.people.injured, n.people.trapped], r: n.road, x: n.note, b: n.by, m: n.team, q: n.trained ? 1 : 0, l: n.place, g: n.plan };
    Object.keys(o).forEach((k) => (o[k] === '' || o[k] == null || (Array.isArray(o[k]) && !o[k].length)) && delete o[k]);
    const body = b64.enc(JSON.stringify(o));
    return `AA1.${body}.${check(body)}`;
  };
  /** Every valid code in a pasted text (a WhatsApp message may hold several, with chat text around them). */
  FR.decodeAll = (text) => {
    const out = [], errors = [];
    String(text || '').replace(/AA1\.([A-Za-z0-9_-]+)\.([0-9a-z]{4})/g, (m, body, sum) => {
      if (check(body) !== sum) { errors.push('A code was damaged in sending (checksum does not match).'); return m; }
      try {
        const o = JSON.parse(b64.dec(body));
        out.push(FR.normalise({ id: o.i, at: o.t, lat: o.a, lon: o.o, acc: o.c, damage: o.d, needs: o.n, people: { affected: o.p?.[0], injured: o.p?.[1], trapped: o.p?.[2] }, road: o.r, note: o.x, by: o.b, team: o.m, trained: o.q === 1, place: o.l, plan: o.g, via: 'code' }));
      } catch (e) { errors.push(`A code could not be read: ${e.message}`); }
      return m;
    });
    return { reports: out, errors };
  };
  FR.shareText = (r) => {
    const n = FR.normalise(r);
    const needs = n.needs.map((k) => FR.NEEDS.find(([x]) => x === k)[1].toLowerCase()).join(', ');
    return `AidAtlas field report${n.place ? ` · ${n.place}` : ''}\n${FR.damageLabel(n.damage)} damage · ${FR.ROAD[n.road]}${needs ? ` · needs ${needs}` : ''}${n.people.trapped ? ` · ${n.people.trapped} trapped` : ''}\n${n.lat.toFixed(5)}, ${n.lon.toFixed(5)}\nPaste into AidAtlas → plan → Field reports:\n${FR.encode(n)}`;
  };

  // ---------------- matching to the plan ----------------
  /** Nearest demand zone, if the report is close enough to describe it (its catchment, at least 3 km, at most 25 km). */
  FR.match = (r, zones) => {
    let best = null;
    (zones || []).forEach((z) => { const d = M.haversine(r, z); if (!best || d < best.distKm) best = { zone: z, distKm: d }; });
    if (!best) return null;
    const lim = M.clamp((best.zone.catchKm || 6) * 1.2, 3, 25);
    return best.distKm <= lim ? best : { ...best, outside: true };
  };
  /** Engine events a report turns into: a Bayesian severity update for its area, plus a road closure when blocked. */
  FR.toEvents = (r, st) => {
    const ev = [];
    const m = FR.match(r, st?.zones);
    if (m && !m.outside) ev.push({ type: 'report', p: { zoneId: m.zone.id, value: r.damage, sd: r.trained ? FR.SD.trained : FR.SD.crowd, fieldId: r.id } });
    if (r.road === 'blocked') ev.push({ type: 'closure', p: { lat: r.lat, lon: r.lon, fieldId: r.id } });
    return { events: ev, match: m };
  };
  /** Reports inside or near the plan's impact area (radius + 30 km). */
  FR.inPlanArea = (reports, st) => { const c = st.sit.focus || st.sit; return (reports || []).filter((r) => M.haversine(c, r) <= st.sit.radiusKm + 30); };

  // ---------------- shared back end ----------------
  const cloud = () => AA.workspace?.cloud;
  const ready = () => { const C = cloud(); if (!C?.ready || !C.team) throw new Error('Sign in to the shared workspace first (Workspace → Shared back end).'); return C; };
  FR.cloudAvailable = () => { const C = cloud(); return !!(C && C.ready && C.team); };
  /** Upload the photo (if any) and insert the report. photoBlob: a JPEG Blob. */
  FR.cloudSend = async (r, photoBlob = null) => {
    const C = ready(), n = FR.normalise(r);
    let photo_path = null;
    if (photoBlob) {
      photo_path = `${C.team.id}/${n.id}.jpg`;
      const up = await C.client.storage.from('field-photos').upload(photo_path, photoBlob, { contentType: 'image/jpeg', upsert: true });
      if (up.error) throw new Error(`Photo upload failed: ${up.error.message}`);
    }
    const row = { id: n.id, team_id: C.team.id, at: n.at, lat: n.lat, lon: n.lon, acc_m: n.acc, damage: n.damage, needs: n.needs, people: n.people, road: n.road, note: n.note, by_name: n.by || C.user?.name || '', team_name: n.team, trained: n.trained, place: n.place, plan: n.plan, photo_path };
    const ins = await C.client.from('field_reports').upsert(row);
    if (ins.error) throw new Error(ins.error.message);
    return n.id;
  };
  /** Reports of my team since a time (ISO), newest first, with signed photo links (1 hour). */
  FR.cloudList = async (sinceIso = null, limit = 300) => {
    const C = ready();
    let q = C.client.from('field_reports').select('*').eq('team_id', C.team.id).order('at', { ascending: false }).limit(limit);
    if (sinceIso) q = q.gte('at', sinceIso);
    const { data, error } = await q; if (error) throw new Error(error.message);
    const rows = data || [];
    const paths = rows.map((x) => x.photo_path).filter(Boolean);
    let urls = {};
    if (paths.length) { const s = await C.client.storage.from('field-photos').createSignedUrls(paths, 3600); (s.data || []).forEach((u) => { if (u.signedUrl) urls[u.path] = u.signedUrl; }); }
    return rows.map((x) => { try { return FR.normalise({ id: x.id, at: x.at, lat: x.lat, lon: x.lon, acc: x.acc_m, damage: x.damage, needs: x.needs, people: x.people, road: x.road, note: x.note, by: x.by_name, team: x.team_name, trained: x.trained, place: x.place, plan: x.plan, photoUrl: urls[x.photo_path] || null, via: 'cloud' }); } catch (e) { return null; } }).filter(Boolean);
  };

  AA.field = FR;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/collab.js */
/* Shared live plan: tasks (who does what, where, by when) and comments, for many agencies on one plan.
   Without a back end they live inside the plan (saved plans and plan files carry them).
   With the shared back end and a saved plan they live in tables plan_tasks / plan_comments and update live
   (Supabase Realtime, with a 30-second check as fallback); a newer saved version of the plan is announced.
   Skill: skills/collab/SKILL.md */
(function (root) {
  const AA = root.AA, W = AA.workspace;
  const COL = {};
  COL.STATUS = { open: 'To do', doing: 'In progress', done: 'Done' };
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const listeners = new Set();
  COL.on = (fn) => listeners.add(fn);
  const emit = (type, data) => listeners.forEach((fn) => { try { fn(type, data); } catch (e) { console.error(e); } });

  /** Where this plan's tasks live: 'cloud' (shared, live) or 'plan' (inside the plan). */
  COL.mode = (st) => (W.cloud?.ready && W.cloud.team && st?.savedId && W.mode() === 'cloud' ? 'cloud' : 'plan');
  const box = (st) => (st.collab = st.collab || { tasks: [], comments: [] });
  COL.tasks = (st) => box(st).tasks.slice().sort((a, b) => ({ doing: 0, open: 1, done: 2 }[a.status] - { doing: 0, open: 1, done: 2 }[b.status]) || String(a.due || '9').localeCompare(String(b.due || '9')) || (a.at < b.at ? 1 : -1));
  COL.comments = (st) => box(st).comments.slice().sort((a, b) => (a.at < b.at ? 1 : -1));

  const me = () => W.me();
  const isMine = (t) => { const m = me(); const a = String(t.assignee || '').toLowerCase(); return !!a && (a === String(m.email || '').toLowerCase() || a === String(m.name || '').toLowerCase()); };
  COL.canCreate = () => W.can('edit');
  COL.canUpdate = (t) => W.can('edit') || isMine(t);
  COL.canComment = () => true; // every role, incl. viewers and field teams, may comment
  COL.isOverdue = (t, now = new Date()) => t.status !== 'done' && t.due && t.due < now.toISOString().slice(0, 10);

  const clean = (t) => ({
    id: String(t.id || uid()).slice(0, 40), title: String(t.title || '').trim().slice(0, 200), zoneId: t.zoneId ? String(t.zoneId).slice(0, 12) : '',
    assignee: String(t.assignee || '').trim().slice(0, 120), due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || '') ? t.due : '', status: COL.STATUS[t.status] ? t.status : 'open',
    note: String(t.note || '').slice(0, 500), by: String(t.by || me().name || '').slice(0, 80), at: t.at || new Date().toISOString(), updatedAt: t.updatedAt || t.at || new Date().toISOString(),
  });

  // ---------------- tasks ----------------
  COL.addTask = async (st, t) => {
    if (!COL.canCreate()) throw new Error(`Your role (${me().role}) can comment but not create tasks.`);
    const task = clean({ ...t, by: me().name });
    if (!task.title) throw new Error('Give the task a title.');
    if (COL.mode(st) === 'cloud') await cloud.upsertTask(st, task);
    box(st).tasks.push(task);
    AA.engine.decide('task', {}, `Task added: “${task.title}”${task.assignee ? ` → ${task.assignee}` : ''}${task.due ? ` by ${task.due}` : ''}`);
    emit('tasks', st); return task;
  };
  COL.updateTask = async (st, id, patch) => {
    const t = box(st).tasks.find((x) => x.id === id); if (!t) throw new Error('Task not found.');
    if (!COL.canUpdate(t)) throw new Error('Only planners or the person the task is assigned to can change it.');
    const next = clean({ ...t, ...patch, id: t.id, by: t.by, at: t.at, updatedAt: new Date().toISOString() });
    if (COL.mode(st) === 'cloud') await cloud.upsertTask(st, next);
    Object.assign(t, next);
    if (patch.status) AA.engine.decide('task', {}, `Task “${t.title}” → ${COL.STATUS[t.status].toLowerCase()}`);
    emit('tasks', st); return t;
  };
  COL.removeTask = async (st, id) => {
    if (!W.can('edit')) throw new Error('Only planners can delete tasks.');
    if (COL.mode(st) === 'cloud') await cloud.deleteTask(id);
    box(st).tasks = box(st).tasks.filter((x) => x.id !== id); emit('tasks', st);
  };

  // ---------------- comments ----------------
  COL.addComment = async (st, text, zoneId = '') => {
    const c = { id: uid(), text: String(text || '').trim().slice(0, 1000), zoneId: zoneId || '', by: me().name || 'someone', role: me().role, at: new Date().toISOString() };
    if (!c.text) throw new Error('Write something first.');
    if (COL.mode(st) === 'cloud') await cloud.insertComment(st, c);
    box(st).comments.push(c); emit('comments', st); return c;
  };

  // ---------------- plan files: tasks and comments travel with the snapshot ----------------
  COL.snapshot = (st) => JSON.parse(JSON.stringify(box(st)));
  COL.restore = (st, data) => { st.collab = { tasks: (data?.tasks || []).map(clean), comments: (data?.comments || []).slice(-500) }; };

  // ---------------- shared back end ----------------
  const C = () => W.cloud;
  const must = ({ data, error }) => { if (error) throw new Error(error.message || String(error)); return data; };
  const cloud = {
    upsertTask: async (st, t) => must(await C().client.from('plan_tasks').upsert({ id: t.id, plan_id: st.savedId, team_id: C().team.id, title: t.title, zone_id: t.zoneId, assignee: t.assignee, due: t.due || null, status: t.status, note: t.note, by_name: t.by, updated_at: t.updatedAt })),
    deleteTask: async (id) => must(await C().client.from('plan_tasks').delete().eq('id', id)),
    insertComment: async (st, c) => must(await C().client.from('plan_comments').insert({ id: c.id, plan_id: st.savedId, team_id: C().team.id, zone_id: c.zoneId, body: c.text, by_name: c.by, by_role: c.role })),
    load: async (st) => {
      const [t, c, p] = await Promise.all([
        C().client.from('plan_tasks').select('*').eq('plan_id', st.savedId),
        C().client.from('plan_comments').select('*').eq('plan_id', st.savedId).order('created_at', { ascending: false }).limit(300),
        C().client.from('plans').select('updated_at, saved_by').eq('id', st.savedId).single(),
      ]);
      return { tasks: (must(t) || []).map((r) => clean({ id: r.id, title: r.title, zoneId: r.zone_id, assignee: r.assignee, due: r.due || '', status: r.status, note: r.note, by: r.by_name, at: r.created_at, updatedAt: r.updated_at })),
        comments: (must(c) || []).map((r) => ({ id: r.id, text: r.body, zoneId: r.zone_id || '', by: r.by_name, role: r.by_role, at: r.created_at })), plan: must(p) };
    },
  };
  COL._cloud = cloud;

  /** Push the plan's own tasks and comments to the shared tables (after a first cloud save). */
  COL.pushLocal = async (st) => {
    if (COL.mode(st) !== 'cloud') return 0;
    let n = 0;
    for (const t of box(st).tasks) { await cloud.upsertTask(st, t); n++; }
    for (const c of box(st).comments) { try { await cloud.insertComment(st, c); n++; } catch (e) { /* already there */ } }
    return n;
  };

  /** Merge shared rows into the plan; returns what changed (for a toast). */
  COL.merge = (st, remote) => {
    const b = box(st), before = JSON.stringify(b);
    const byId = new Map(b.tasks.map((t) => [t.id, t]));
    remote.tasks.forEach((t) => { const mine = byId.get(t.id); if (!mine || mine.updatedAt < t.updatedAt) byId.set(t.id, t); });
    const remoteIds = new Set(remote.tasks.map((t) => t.id));
    b.tasks = [...byId.values()].filter((t) => remoteIds.has(t.id)); // deleted elsewhere → gone here
    const cIds = new Set(b.comments.map((c) => c.id));
    remote.comments.forEach((c) => { if (!cIds.has(c.id)) b.comments.push(c); });
    return before !== JSON.stringify(b);
  };

  let timer = null, channel = null, lastSeenSave = null;
  /** Start live updates for an open plan (cloud only): Realtime + 30-s polling fallback + newer-version notice. */
  COL.start = (st) => {
    COL.stop();
    if (COL.mode(st) !== 'cloud') return;
    lastSeenSave = null;
    const pull = async () => {
      if (AA.engine.state !== st) return COL.stop();
      try {
        const r = await cloud.load(st);
        if (COL.merge(st, r)) emit('remote', st);
        if (lastSeenSave && r.plan?.updated_at && r.plan.updated_at > lastSeenSave && r.plan.saved_by !== me().name) emit('newer', { by: r.plan.saved_by, at: r.plan.updated_at });
        lastSeenSave = r.plan?.updated_at || lastSeenSave;
      } catch (e) { emit('error', e.message); }
    };
    pull();
    timer = setInterval(pull, 30000);
    try {
      channel = C().client.channel(`plan-${st.savedId}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'plan_tasks', filter: `plan_id=eq.${st.savedId}` }, pull)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'plan_comments', filter: `plan_id=eq.${st.savedId}` }, pull)
        .subscribe();
    } catch (e) { channel = null; /* realtime not available: polling still works */ }
  };
  COL.stop = () => { clearInterval(timer); timer = null; try { if (channel) C()?.client?.removeChannel(channel); } catch (e) { /* ignore */ } channel = null; };
  COL.markSaved = (at) => { lastSeenSave = at || new Date().toISOString(); };

  AA.collab = COL;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/exports.js */
/* Exports to the tools agencies already use, and import from KoboToolbox / ODK.
   - GeoJSON (RFC 7946): ArcGIS Online / Pro, QGIS, Google Earth via conversion, any GIS.
   - HXL-tagged CSV (Humanitarian Exchange Language): HDX and other HXL tools read the second row of tags.
   - Plain CSV tables (needs, dispatches, tasks): spreadsheets, and Sahana Eden's CSV importer after column mapping.
   - KoboToolbox / ODK: examples/aidatlas-field-xlsform.xlsx is the same field report as the AidAtlas field app;
     its CSV export comes back in through importKobo().
   Skill: skills/exports/SKILL.md */
(function (root) {
  const AA = root.AA, M = AA.math;
  const X = {};
  const r = (x, d = 0) => (x == null || !isFinite(x) ? null : M.round(x, d));
  const pt = (p, props) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [r(+p.lon, 6), r(+p.lat, 6)] }, properties: props });

  /** The whole plan as one GeoJSON FeatureCollection; every feature has a `layer` property to style or filter by. */
  X.geojson = (st) => {
    const run = st.lastRun, K = AA.config.commodities, F = [];
    const c = st.sit.focus || st.sit;
    F.push({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [M.circleRing(c, st.sit.radiusKm, 64)] }, properties: { layer: 'impact_area', name: st.sit.name, hazard: st.sit.hazard, radius_km: r(st.sit.radiusKm, 1) } });
    st.zones.forEach((z, i) => F.push(pt(z, { layer: 'affected_area', id: z.id, name: z.name, address: z.address || '', need_score: r(z.need, 3), severity: r(z.sevPost ?? z.sevMean, 3), population: r(z.pop), population_source: z.popProv,
      affected_p10: r(z.fc.aff.p10), affected_p50: r(z.fc.aff.p50), affected_p90: r(z.fc.aff.p90), displaced_p50: r(z.fc.dis.p50), injured_p50: r(z.fc.inj.p50), deaths_p50: r(z.fc.fat.p50), deaths_p90: r(z.fc.fat.p90),
      ...Object.fromEntries(K.map((k) => [`need_${k.key}_${k.unit.replace(/\W+/g, '')}`, r(z.d?.[k.key] || 0, 2)])),
      ...(run ? Object.fromEntries(K.map((k) => [`unmet_${k.key}`, r(run.alloc.unmet[i]?.[k.key] || 0, 2)])) : {}), served: !!z.served })));
    st.depots.forEach((d) => F.push(pt(d, { layer: 'supply_store', id: d.id, name: d.name, type: d.type, open: d.open, address: d.address || '', provenance: d.prov, trucks: d.fleet.truck || 0, buses: d.fleet.bus || 0, ambulances: d.fleet.amb || 0, ...Object.fromEntries(K.map((k) => [`stock_${k.key}`, r(d.stock[k.key] || 0, 2)])) })));
    st.hospitals.forEach((h) => F.push(pt(h, { layer: 'hospital', id: h.id, name: h.name, free_beds: h.beds, address: h.address || '' })));
    (st.warehouses?.sizes || []).forEach((s, k) => { const cc = st.warehouses.cand[s.j]; F.push(pt(cc, { layer: 'storage_site', id: `S${k + 1}`, serves: s.zones.join(' '), address: cc.address || '', ...Object.fromEntries(Object.entries(s.stock).map(([q, v]) => [`stock72h_${q}`, r(v, 2)])) })); });
    (run?.legs || []).forEach((l) => { const coords = l.best?.coords || [[l.a.lon, l.a.lat], [l.b.lon, l.b.lat]]; F.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords.map(([x, y]) => [r(x, 6), r(y, 6)]) }, properties: { layer: 'route', from: l.from.kind === 'd' ? st.depots[l.from.idx].id : st.zones[l.from.idx].id, to: st.zones[l.to.idx].id, vehicle: l.cls, air_drop: !!l.airdrop, km: r(l.best?.km, 1), hours: r(l.best?.h, 2) } }); });
